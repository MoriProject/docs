  /api/v3/orders/{orderId}:
    get:
      summary: Get order details
      operationId: getOrderV3
      description: |
        Get the details of an order you own in **one shape for every order type and watermark engine**: Anti-AI, AI Detection, watermark embed, and watermark extract orders, whether you created them with v2 or v3. You can call this endpoint whatever the order status.

        **Common top-level fields**: `type`, `orderId`, `orderName`, `channel`, `status`, `createdAt`, `updatedAt`, `expiresAt`, `retentionDays`, `thumbnailImageUrl`, `processingDelayed`, `errors`, `inputFiles`, and `result`. Every order returns the same set of keys; only `result` differs by order type.
        - `type` is `antiAi`, `aiDetection`, `watermarkEmbed`, or `watermarkExtract`. Watermark orders created with v3 use the same values, without an engine suffix
        - `status` is one of `pending`, `inProgress`, `complete`, `failed`, and `expired`. v2 watermark extract orders stored as `detected` or `undetected` return `complete`, with the outcome in `result.detectionStatus`
        - `processingDelayed` is calculated only for watermark orders created with v3. It is always `false` for other orders
        - `errors` is `{ errorCode, errorMessage }` for a failed order, otherwise `null`

        **`inputFiles[]`**: `{ fileId, fileName }` for each input file, in request order. Use `inputFiles.length` for the file count.
        - `role` (`original` or `query`) appears only on `watermarkExtract` orders. The `watermarked` role of v2 orders is returned as `query`
        - `uploadUrl` (presigned `PUT` URL) appears only while `status` is `pending` and the file is waiting for upload. Otherwise the key is omitted, not set to `null`

        **`result`**: the key is always present. It is an object only when `status` is `complete`, and `null` for `pending`, `inProgress`, `failed`, and `expired`.
        - `antiAi`: `{ outputFiles: [{ fileId, fileName, inputFileId }] }`
        - `watermarkEmbed`: `{ outputFiles: [{ fileId, fileName, inputFileId, watermarkText }] }`. A v3 order that embeds several watermark texts in one input file returns one output file per text
        - `watermarkExtract`: `{ detectionStatus, watermarkText, reportSupported, reports }`. `detectionStatus` is `detected`, `undetected`, `inconclusive`, `unsupported`, or `error`. `watermarkText` is `null` unless `detectionStatus` is `detected`. v2 orders return `reportSupported: false` and `reports: []`
        - `aiDetection`: `{ verdict, probability, options, originalImageUrl, heatmapUrl, overlayUrl }`. `verdict` is `likely_real`, `uncertain_real`, `uncertain_ai`, or `likely_ai`, and is `null` when `probability` is `null`. `options` is `null` when no options were stored

        **`fileId`**: every `fileId` and `inputFileId` is a numeric string with no separator such as `-`. `result.outputFiles[].fileId` is unique within the order and matches `files[].fileId` from [`GET /api/v3/orders/{orderId}/download`](/api-reference/orders/download-order-v3) in value and order.

        **Expired orders**: you can still get an `expired` order, but `result` is `null` and no URLs are issued.

        **Changes from the previous v3 response (breaking change, 2026-10-08)**
        - For watermark orders created with v3, `files[]`, `outputs[]`, and the top-level `reports[]` moved to `inputFiles[]`, `result.outputFiles[]`, and `result.reports[]`. Output `fileId` values changed from `{inputFileId}-{n}` to numeric strings
        - The `detectionStatus` value `not_detected` is now `undetected`
        - For other orders, which used the v2 detail format, the top-level `fileCount`, `statusCode`, `watermarks`, `watermarkText`, `probability`, `options`, `originalImageUrl`, `heatmapUrl`, and `overlayUrl` fields moved to `inputFiles` and `result`. The AI Detection `statusCode` is now `result.verdict`
        - The response of the deprecated [`GET /api/v2/orders/{orderId}`](/api-reference/orders/get-order) is unchanged

        **Test keys (`sk_test_`)**: returns only test orders created with the same key. Live orders and other accounts' orders return `404 ORDER_NOT_FOUND`, as do test orders requested with a live key. Every test order, created with v2 or v3, uses this shape. An `inProgress` test order becomes `complete` or `failed` when you get it more than five seconds after the uploads finish. The `uploadUrl` of a pending test order is `https://api.bizmori.com/api/v2/test-uploads/{signedToken}`. `result.reports` of a test extract order is always empty, and `reportSupported` is `true` only for a v3 test extract order whose `detectionStatus` is `detected`. `expiresAt` is seven days after the order was created.
      tags:
      - Orders
      security:
      - BearerAuth: []
      parameters: &id001
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,20}$
        description: Order ID
      responses:
        '200':
          description: Order details. The top-level fields are the same for every order type; only `result` depends on `type`
          content:
            application/json:
