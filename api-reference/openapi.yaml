  /api/v2/orders/webhooks/{webhookId}/events/{eventId}/retry:
    post:
      summary: Retry webhook event
      operationId: retryWebhookEvent
      description: 'Manually retry sending a single failed webhook event. A test API key can retry only an event in its owner''s test endpoint; an inaccessible endpoint returns `WEBHOOK_NOT_FOUND`, and an event outside an accessible endpoint returns `WEBHOOK_EVENT_NOT_FOUND`.

        - Only events with `FAILED` status can be retried

        - On success, the event status changes to `SENT`

        - If the retry fails, the event remains `FAILED` and a scheduler-based retry is queued for 30
        minutes later

        - Test API keys can manage only test endpoints owned by the same owner

        '
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          type: integer
        description: Webhook ID
      - in: path
        name: eventId
        required: true
        schema:
          type: integer
        description: Webhook event ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
                        description: Original event UUID
                      success:
                        type: boolean
                        description: Whether the retry was successful
                      status_code:
                        type: integer
                        description: HTTP response code from the webhook endpoint (when success is true)
                      status:
                        type: string
                        description: Event status (when retry fails)
                        example: FAILED
                      error:
                        type: string
                        description: Error message (when retry fails)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook endpoint or event not found or not accessible to this API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                webhookNotFound:
                  summary: Webhook endpoint not found or not accessible
                  value:
                    code: WEBHOOK_NOT_FOUND
                webhookEventNotFound:
                  summary: Event not found in the accessible webhook endpoint
                  value:
                    code: WEBHOOK_EVENT_NOT_FOUND
        '422':
          description: Event is not retryable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/webhooks/WEBHOOK_ID/events/EVENT_ID/retry\
          \ \\\n  -H \"Authorization: Bearer YOUR_API_TOKEN\""
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch(\n  `https://api.bizmori.com/api/v2/orders/webhooks/${webhookId}/events/${eventId}/retry`,\n\
          \  {\n    method: 'POST',\n    headers: { 'Authorization': 'Bearer YOUR_API_TOKEN' }\n  }\n\
          );\nconst data = await response.json();"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    f'https://api.bizmori.com/api/v2/orders/webhooks/{webhook_id}/events/{event_id}/retry',\n\
          \    headers={'Authorization': 'Bearer YOUR_API_TOKEN'}\n)\ndata = response.json()"
