  /api/v3/orders/{orderId}/reports:
    post:
      summary: Create an order report
      operationId: createOrderReport
      description: |
        Create a PDF analysis report for an order. BIZ MORI picks the report type from the order type, so you don't send it:

        - Watermark extract orders created with the v3 API → `watermarkDetection`
        - AI Detection orders → `aiDetection`

        Image watermark reports support `ko-KR`, `en-US`, and `ja-JP`. PDF watermark reports support `ko-KR` only. Requesting the same order and locale again returns the existing report.

        **Responses**
        - `202` with `queued` or `processing`: the report is being generated. Poll [`GET /api/v3/orders/{orderId}/reports/{locale}`](/api-reference/reports/get-report)
        - `200` with `completed`: the report already exists and includes `download`
        - `200` with `failed`: generation failed and cannot be retried (`failure.retryable` is `false`)

        **Retries for watermark reports**
        If a watermark report is `failed`, calling this endpoint again for the same order and locale starts a new attempt (`202`). Each attempt reserves 1 credit; failed attempts are refunded and only a successful attempt is charged. After 3 failed attempts the report is not regenerated.

        Returns `400 ORDER_EXPIRED` after the order's retention period ends, even if a report exists.
      tags:
      - Reports
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
        description: Order ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum:
                  - ko-KR
                  - en-US
                  - ja-JP
                  default: ko-KR
                  description: Report language. Defaults to `ko-KR`.
            example:
              locale: en-US
      responses:
        '200':
          description: The report is already complete, or it failed and cannot be retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
        '202':
          description: The report request was accepted and is `queued` or `processing`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
        '400':
          description: Invalid request, the order type does not support the locale, or the order's retention
            period has ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                locale:
                  value:
                    code: REPORT_LOCALE_UNSUPPORTED
                expired:
                  value:
                    code: ORDER_EXPIRED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The order does not exist or belongs to another account, or the completed report file
            is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order:
                  value:
                    code: ORDER_NOT_FOUND
                report:
                  value:
                    code: REPORT_NOT_FOUND
        '409':
          description: The order is not complete or cannot produce a report yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: REPORT_NOT_AVAILABLE
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Report generation is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
      x-codeSamples:
      - lang: curl
        label: cURL
        source: |
          curl -X POST https://api.bizmori.com/api/v3/orders/ORDER_ID/reports \
            -H "Authorization: Bearer YOUR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
            "locale": "en-US"
          }'
      - lang: javascript
        label: JavaScript
        source: |
          const orderId = 'ORDER_ID';
          const response = await fetch(`https://api.bizmori.com/api/v3/orders/${orderId}/reports`, {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer YOUR_API_KEY',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              "locale": "en-US"
            })
          });
          const { data } = await response.json();
      - lang: python
        label: Python
        source: |
          import requests

          order_id = 'ORDER_ID'
          response = requests.post(
              f'https://api.bizmori.com/api/v3/orders/{order_id}/reports',
              headers={'Authorization': 'Bearer YOUR_API_KEY'},
              json={
                "locale": "en-US"
              }
          )
          data = response.json()['data']
  /api/v3/orders/{orderId}/reports/{locale}:
    get:
      summary: Get an order report
      operationId: getOrderReport
      description: |
        Get the status of a report and, when it is `completed`, its download URL. A locale with no report request returns `404 REPORT_NOT_FOUND`.

        A new `download.url` is issued on every call and expires after 300 seconds. An expired URL returns `403` from storage and cannot be renewed. Don't store the URL: call this endpoint when the user clicks download and open the returned URL right away.

        Returns `400 ORDER_EXPIRED` after the order's retention period ends, whatever the report status.
      tags:
      - Reports
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,20}$
        description: Order ID
      - in: path
        name: locale
        required: true
        schema:
          type: string
          enum:
          - ko-KR
          - en-US
          - ja-JP
        description: Report language
      responses:
        '200':
          description: Report resource in `queued`, `processing`, `completed`, or `failed` status. `download`
            is set only when `completed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
              example:
                data:
                  orderId: '1234567891'
                  reportType: watermarkDetection
                  locale: en-US
                  status: completed
                  download:
                    url: https://s3.ap-northeast-2.amazonaws.com/...
                    expiresInSeconds: 300
                  failure: null
        '400':
          description: Invalid request, the order type does not support the locale, or the order's retention
            period has ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                locale:
                  value:
                    code: REPORT_LOCALE_UNSUPPORTED
                expired:
                  value:
                    code: ORDER_EXPIRED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The order does not exist, no report was requested for this locale, or the completed
            report file is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order:
                  value:
                    code: ORDER_NOT_FOUND
                report:
                  value:
                    code: REPORT_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Report generation is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
      x-codeSamples:
      - lang: curl
        label: cURL
        source: |
          curl -X GET https://api.bizmori.com/api/v3/orders/ORDER_ID/reports/en-US \
            -H "Authorization: Bearer YOUR_API_KEY"
      - lang: javascript
        label: JavaScript
        source: |
          const orderId = 'ORDER_ID';
          const locale = 'en-US';
          const response = await fetch(`https://api.bizmori.com/api/v3/orders/${orderId}/reports/${locale}`, {
            headers: { 'Authorization': 'Bearer YOUR_API_KEY' }
          });
          const { data } = await response.json();
          if (data.status === 'completed') window.location.href = data.download.url;
      - lang: python
        label: Python
        source: |
          import requests

          order_id = 'ORDER_ID'
          locale = 'en-US'
          response = requests.get(
              f'https://api.bizmori.com/api/v3/orders/{order_id}/reports/{locale}',
              headers={'Authorization': 'Bearer YOUR_API_KEY'}
          )
          data = response.json()['data']
          if data['status'] == 'completed':
              pdf = requests.get(data['download']['url']).content
