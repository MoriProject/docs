  /api/v3/orders/wtr-extract:
    post:
      summary: Create a watermark extract order
      operationId: createWatermarkV1ExtractOrder
      description: |
        Create an order that checks one file for an invisible watermark.

        - Submit the original file together with the file to inspect on every request
        - Image originals accept `jpg`, `jpeg`, `png`, `webp`, `bmp`, `tif`, or `tiff` files to inspect. PDF originals accept PDF, PNG, or JPEG files to inspect
        - BMP and TIFF files follow the same limits as watermark embed. A file that cannot be processed finishes as `complete` with `detectionStatus` `unsupported`, not `failed`, and the credit is refunded
        - The response `files[]` contains two entries: `files[0]` is the original and `files[1]` is the file to inspect. Upload each with `PUT` to its `uploadUrl`
        - Processing starts automatically when both files are uploaded. Each order uses 1 credit, and `unsupported` or `error` results are refunded
        - Read the outcome from `result` in [`GET /api/v3/orders/{orderId}`](/api-reference/orders/get-order-v3)
      tags:
      - Watermark Extract
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - file
              properties:
                idempotencyKey:
                  type: string
                  maxLength: 255
                  description: Idempotency key. Use a new UUIDv4 for each new order and reuse it only when
                    retrying the same request. The same key returns the existing order; the same key with
                    a different request body returns `409 WATERMARK_V2_CONFLICT`.
                file:
                  type: object
                  required:
                  - fileName
                  - originalFile
                  description: The file to inspect
                  properties:
                    fileName:
                      type: string
                      maxLength: 255
                      description: File name of the file to inspect, with extension
                    originalFile:
                      type: object
                      required:
                      - fileName
                      description: The original file the watermark was embedded into
                      properties:
                        fileName:
                          type: string
                          maxLength: 255
            example:
              idempotencyKey: 6c3b9f7e-2d41-4a8e-9b5f-0e1d2c3b4a59
              file:
                fileName: suspect.png
                originalFile:
                  fileName: campaign.png
      responses:
        '200':
          description: Order created with upload URLs for the original file and the file to inspect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatermarkV1OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The same `idempotencyKey` was used with a different request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WATERMARK_V2_CONFLICT
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Watermark processing is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WATERMARK_V2_UNAVAILABLE
