  /api/v3/orders/{orderId}/download:
    get:
      summary: Get order result download URLs
      operationId: downloadOrderV3
      description: |
        Issue a download URL for every output file of a completed Anti-AI or watermark embed order, plus one URL for all results, in a single call. The response has the same shape whether the watermark order was created with v2 or v3.

        - `files[]`: `{ fileId, downloadUrl }` for each output file. It lists the same files in the same order as `result.outputFiles[]` from [`GET /api/v3/orders/{orderId}`](/api-reference/orders/get-order-v3), with the same `fileId` values
        - `archiveUrl`: one URL for all results. Always a string
          - Anti-AI orders and watermark embed orders created with v2: a ZIP archive of the results
          - Watermark embed orders created with v3: a ZIP archive with two or more output files. With one output file, the URL of that file (the same file as `files[0].downloadUrl`)
        - `expiresInSeconds`: how long the URLs are valid. 3600 seconds (1 hour) by default, shortened to the time left until the retention period ends (`expiresAt`) if that is sooner. Call this endpoint again for fresh URLs

        **Error check order** (the first matching error is returned)
        1. The order does not exist or belongs to another account → `404 ORDER_NOT_FOUND`
        2. Watermark extract or AI Detection order → `400 ORDER_TYPE_CANT_DOWNLOAD`, even after the retention period ends
        3. The retention period has ended → `400 ORDER_EXPIRED`. If the retention period cannot be determined → `409 FILE_RETENTION_UNKNOWN`
        4. `status` is not `complete` (`pending`, `inProgress`, or `failed`) → `400 ORDER_NOT_COMPLETED`

        **Changes from the previous v3 response (breaking change, 2026-10-08)**: the response changed from `{ downloadUrl, expiresInSeconds: 300 }` to `{ archiveUrl, files, expiresInSeconds }`, and Anti-AI orders and v2 watermark embed orders are now supported. URLs are valid for up to 3600 seconds instead of 300. An incomplete order returns `ORDER_NOT_COMPLETED` instead of `VALIDATION_FAILED`, and an extract order returns `ORDER_TYPE_CANT_DOWNLOAD`. The per-file endpoint `GET /api/v3/orders/{orderId}/files/{fileId}/download` was removed; use `files[]` instead.

        **Test keys (`sk_test_`)**: works for completed Anti-AI and watermark embed test orders created with the same key, whether with v2 or v3. The URLs point to sample files served from `https://api.bizmori.com/api/v2/test-samples/{signedToken}`, not to your processed files. An Anti-AI test order without output files returns `files: []` and a sample ZIP as `archiveUrl`. A v3 embed test order with one output file returns that sample file as `archiveUrl`; other test orders return a sample ZIP. `expiresInSeconds`, the error codes, and the check order follow the same rules as live orders.
      tags:
      - Orders
      security:
      - BearerAuth: []
      parameters: *id001
      responses:
        '200':
          description: A download URL for each output file and one URL for all results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrderV3DownloadResponse'
              examples:
                antiAi:
                  summary: Anti-AI (2 outputs, `archiveUrl` is a ZIP)
                  value:
                    data:
                      archiveUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/zip/1001/archive.zip?X-Amz-...
                      files:
                      - fileId: '21'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/cat.png?X-Amz-...
                      - fileId: '22'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/dog.png?X-Amz-...
                      expiresInSeconds: 3600
                watermarkEmbedV3Multiple:
                  summary: Watermark embed (v3) (2 outputs, `archiveUrl` is a ZIP)
                  value:
                    data:
                      archiveUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/archive/2001.zip?X-Amz-...
                      files:
                      - fileId: '201'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/logo-1.png?X-Amz-...
                      - fileId: '202'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/logo-2.png?X-Amz-...
                      expiresInSeconds: 3600
                watermarkEmbedV3Single:
                  summary: Watermark embed (v3) (1 output, `archiveUrl` is the output file URL)
                  value:
                    data:
                      archiveUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/logo.png?X-Amz-...
                      files:
                      - fileId: '201'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/logo.png?X-Amz-...
                      expiresInSeconds: 3600
                watermarkEmbedV2:
                  summary: Watermark embed (v2) (2 outputs; 20 minutes left until `expiresAt`, so the URLs expire sooner)
                  value:
                    data:
                      archiveUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/zip/2101.zip?X-Amz-...
                      files:
                      - fileId: '41'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/a.png?X-Amz-...
                      - fileId: '42'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/b.png?X-Amz-...
                      expiresInSeconds: 1200
        '400':
          description: Invalid request, an order type that cannot be downloaded, an expired order, or an incomplete order
          content:
