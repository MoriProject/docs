    post:
      summary: Retry failed webhook events
      operationId: retryFailedWebhookEvents
      description: 'Retry all failed webhook events within a specified date range. A test API key can retry only its owner''s test endpoint; an inaccessible endpoint returns `WEBHOOK_NOT_FOUND`.

        - Retries up to 50 failed events per request

        - Date range must not exceed 7 days

        - Each event is retried individually

        - Test API keys can manage only test endpoints owned by the same owner

        '
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          type: integer
        description: Webhook ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fromDate
              - toDate
              properties:
                fromDate:
                  type: string
                  format: date
                  description: Start date (ISO 8601 format, e.g. 2026-01-01)
                  example: '2026-01-01'
                toDate:
                  type: string
                  format: date
                  description: End date (ISO 8601 format, e.g. 2026-01-07). Must be within 7 days of fromDate.
                  example: '2026-01-07'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of failed events found in the date range
                      succeeded:
                        type: integer
                        description: Number of events successfully resent
                      failed:
                        type: integer
                        description: Number of events that failed to resend
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
        '422':
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
