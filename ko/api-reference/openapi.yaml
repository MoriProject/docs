paths:
  /api/v2/orders/anti-ai:
    post:
      summary: Anti-AI 주문 생성
      operationId: createAntiAiOrder
      description: 'AI 감지 방지 처리를 위한 주문을 생성합니다.


        ## 입력 모드 (업로드 / URL / 혼합)

        입력 모드는 각 파일 객체에 `originalFileUrl` 포함 여부로 결정됩니다:

        - **업로드 모드** (`originalFileUrl` 없음): 프리사인드 URL 발급 → 클라이언트가 S3에 업로드 → `/confirm` 호출

        - **URL 모드** (`originalFileUrl` 제공): URL에서 이미지를 다운로드하여 즉시 처리

        - **혼합 모드**: 일부 파일은 업로드 모드, 나머지는 URL 모드로 동시 처리


        ### 동작 방식

        | 조건 | 주문 상태 | Confirm 필요 |

        |------|-----------|-------------|

        | 모든 파일에 `originalFileUrl` 있음 | `inProgress` | 불필요 (즉시 처리) |

        | `originalFileUrl` 없는 파일 포함 | `pending` | 필요 (업로드 후 confirm) |


        ## Zero Copy 모드

        `mode.zeroCopy: true`로 설정하면, 처리 결과가 고객이 제공한 프리사인드 URL로 직접 업로드됩니다.

        이 경우 `outputTargets` 배열이 필수이며 `files` 배열과 동일한 길이여야 합니다.

        '
      tags:
      - Anti-AI
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - files
              properties:
                idempotencyKey:
                  type: string
                  description: 중복 요청 방지를 위한 멱등성 키
                orderName:
                  type: string
                  maxLength: 64
                  description: 주문 이름 (미입력 시 자동 생성)
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - fileName
                    properties:
                      fileName:
                        type: string
                        description: 파일 이름 (확장자 포함)
                        example: image.jpg
                      originalFileUrl:
                        type: string
                        format: uri
                        description: '원본 이미지 URL (선택)

                          - 제공 시: URL 모드 (프리사인드 URL 미발급, 즉시 처리)

                          - 미제공 시: 업로드 모드 (프리사인드 URL 발급, confirm 필요)

                          '
                        example: https://example.com/image.jpg
                mode:
                  type: object
                  description: 처리 모드 설정
                  properties:
                    zeroCopy:
                      type: boolean
                      default: false
                      description: Zero Copy 모드 활성화
                outputTargets:
                  type: array
                  description: Zero Copy 모드 결과 업로드 대상 (mode.zeroCopy가 true일 때 필수)
                  items:
                    type: object
                    required:
                    - fileKey
                    - url
                    - presignedUrlExpiresAt
                    properties:
                      fileKey:
                        type: string
                        description: 파일 키 (식별자)
                      url:
                        type: string
                        format: uri
                        description: 결과 업로드를 위한 프리사인드 URL
                      presignedUrlExpiresAt:
                        type: string
                        format: date-time
                        description: 프리사인드 URL 만료 시각 (ISO 8601)
                options:
                  $ref: '#/components/schemas/OrderOptions'
            examples:
              uploadMode:
                summary: 업로드 모드 (기본)
                value:
                  idempotencyKey: 2f4b6c82-8a6e-4f39-9f8a-7d3b5c1e2a40
                  files:
                  - fileName: image1.jpg
                  - fileName: image2.png
                  options:
                    strength: high
              urlMode:
                summary: URL 모드 (즉시 처리)
                value:
                  idempotencyKey: 3c7a5e19-9b2f-4d86-a1c4-6f8e0b3d5a71
                  files:
                  - fileName: image1.jpg
                    originalFileUrl: https://example.com/image1.jpg
                  - fileName: image2.png
                    originalFileUrl: https://example.com/image2.png
                  options:
                    strength: high
              mixedMode:
                summary: 혼합 모드
                value:
                  idempotencyKey: 4d8b6f2a-a3c1-4e97-b2d5-7a9f1c4e6b82
                  files:
                  - fileName: upload-file.jpg
                  - fileName: url-file.png
                    originalFileUrl: https://example.com/image.png
                  options:
                    strength: standard
      responses:
        '200':
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderName:
                        type: string
                      orderId:
                        type: string
                      status:
                        type: string
                        enum:
                        - pending
                        - inProgress
                        description: '주문 상태

                          - `pending`: 업로드 파일 포함 (confirm 필요)

                          - `inProgress`: 모든 파일이 URL 모드 (즉시 처리)

                          '
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/AntiAiOrderFile'
              examples:
                uploadModeResponse:
                  summary: 업로드 모드 응답
                  value:
                    data:
                      orderName: anti_ai_2026-02-09
                      orderId: '123456789'
                      status: pending
                      files:
                      - fileId: '1'
                        fileName: image1.jpg
                        uploadUrl: https://s3.amazonaws.com/...
                        fileKey: temp/123456789/0/image1.jpg
                urlModeResponse:
                  summary: URL 모드 응답
                  value:
                    data:
                      orderName: anti_ai_2026-02-09
                      orderId: '123456789'
                      status: inProgress
                      files:
                      - fileId: '1'
                        fileName: image1.jpg
                        originalFileUrl: https://example.com/image1.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/UsageLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/anti-ai \\\n  -H\
          \ \"Authorization: Bearer YOUR_API_TOKEN\" \\\n  -H \"Content-Type: application/json\"\
          \ \\\n  -d '{\n    \"idempotencyKey\": \"2f4b6c82-8a6e-4f39-9f8a-7d3b5c1e2a40\",\n    \"files\": [\n\
          \      {\"fileName\": \"image1.jpg\"},\n      {\"fileName\": \"image2.png\"\
          }\n    ],\n    \"options\": {\"strength\": \"high\"}\n  }'"
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch('https://api.bizmori.com/api/v2/orders/anti-ai',\
          \ {\n  method: 'POST',\n  headers: {\n    'Authorization': 'Bearer YOUR_API_TOKEN',\n\
          \    'Content-Type': 'application/json'\n  },\n  body: JSON.stringify({\n\
          \    idempotencyKey: '2f4b6c82-8a6e-4f39-9f8a-7d3b5c1e2a40',\n    files: [\n      { fileName: 'image1.jpg'\
          \ },\n      { fileName: 'image2.png' }\n    ],\n    options: { strength:\
          \ 'high' }\n  })\n});\nconst data = await response.json();"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    'https://api.bizmori.com/api/v2/orders/anti-ai',\n\
          \    headers={'Authorization': 'Bearer YOUR_API_TOKEN'},\n    json={\n        'idempotencyKey':\
          \ '2f4b6c82-8a6e-4f39-9f8a-7d3b5c1e2a40',\n        'files': [\n            {'fileName': 'image1.jpg'},\n\
          \            {'fileName': 'image2.png'}\n        ],\n        'options':\
          \ {'strength': 'high'}\n    }\n)\ndata = response.json()"
  /api/v2/orders/anti-ai/confirm:
    post:
      summary: Anti-AI 주문 확인
      operationId: confirmAntiAiOrder
      description: '파일 업로드 완료 후 처리를 시작하기 위해 호출합니다.

        - 모든 업로드 파일이 S3에 업로드된 후 호출

        - 처리가 시작되면 상태가 `inProgress`로 변경

        - 혼합 모드에서는 업로드 파일만 S3 존재 여부를 확인하며, URL 파일은 이미 준비됨

        - 모든 파일이 URL 모드인 주문은 이미 `inProgress` 상태이므로 confirm 불필요

        '
      tags:
      - Anti-AI
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - orderId
