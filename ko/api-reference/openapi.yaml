  /api/v3/orders/{orderId}:
    get:
      summary: 주문 상세 조회
      operationId: getOrderV3
      description: |
        호출 계정이 소유한 주문의 상세를 **주문 종류·워터마크 엔진과 관계없이 한 가지 형식**으로 조회합니다. Anti-AI, AI Detection, 워터마크 삽입·검출 주문을 v2·v3 어느 쪽으로 만들었든 조회할 수 있습니다. 주문 상태와 관계없이 항상 호출할 수 있습니다.

        **공통 최상위 필드**: `type`, `orderId`, `orderName`, `channel`, `status`, `createdAt`, `updatedAt`, `expiresAt`, `retentionDays`, `thumbnailImageUrl`, `processingDelayed`, `errors`, `inputFiles`, `result`. 모든 주문에서 이 키 집합이 같고, 주문 종류별 차이는 `result` 안에만 있습니다.
        - `type`은 `antiAi`, `aiDetection`, `watermarkEmbed`, `watermarkExtract` 중 하나입니다. v3로 만든 워터마크 주문도 엔진 버전 접미사 없이 같은 값을 씁니다
        - `status`는 `pending`, `inProgress`, `complete`, `failed`, `expired` 5개 값만 씁니다. v2 워터마크 검출 주문의 저장 status `detected`/`undetected`는 `complete`로 반환하고 판정 값은 `result.detectionStatus`에 담습니다
        - `processingDelayed`는 v3로 만든 워터마크 주문만 계산합니다. 그 외 주문은 항상 `false`입니다
        - `errors`는 주문 처리 실패 정보(`OrderErrors`)이며 API 오류 응답 `{ code }`와 다릅니다. 실패하지 않은 주문은 `null`이고, 실패한 뒤 만료된 주문은 저장된 값을 유지합니다. v3로 만든 워터마크 주문은 저장된 값을 `{ errorCode, errorMessage }`로 바꾸며, 저장값이 `null`이면 실패 주문이어도 `null` 그대로입니다. 그 밖의 주문은 저장값을 그대로 반환하므로 `errorCode`가 없는 객체이거나, 일부 오래된 주문은 문자열입니다
        - `retentionDays`(7 또는 30)는 주문을 만들 때 계정의 파일 보관 설정에서 가져와 주문에 고정합니다. 나중에 설정을 바꿔도 기존 주문은 바뀌지 않습니다. `expiresAt`은 주문이 처음 완료될 때 완료 시각 + `retentionDays`로 정해지며 처리 중에는 임시값입니다. 결과 파일은 `expiresAt`까지 받을 수 있습니다
        - `retentionDays`와 `expiresAt`은 데이터 예외에서만 `null`입니다. `expiresAt`이 `null`이어도 무기한 보관이 아닙니다. 이때 v3 다운로드는 다운로드 가능한 종류(Anti-AI·워터마크 삽입)에서 `409 FILE_RETENTION_UNKNOWN`을 반환하고, 워터마크 검출·AI Detection 주문은 주문 종류를 보관 기한보다 먼저 검사하므로 `400 ORDER_TYPE_CANT_DOWNLOAD`를 반환합니다. 없거나 다른 계정의 주문은 그보다 먼저 `404 ORDER_NOT_FOUND`입니다
        - 이미지 URL의 유효 시간은 보관 기간과 별개입니다. Anti-AI·AI Detection·v2 워터마크 주문의 저장된 이미지(`thumbnailImageUrl`, `result.originalImageUrl`, `result.heatmapUrl`, `result.overlayUrl`)는 발급 시점부터 최대 7일이며 `expiresAt`까지만 서명합니다. v3로 만든 워터마크 주문의 썸네일은 보관 기한 전에만 발급하지만 900초(15분)로 고정 서명하므로, 발급된 URL이 `expiresAt` 뒤까지 유효할 수 있습니다. 상태별 고정 이미지 URL은 서명 URL이 아닙니다. 새 URL이 필요하면 다시 조회하세요

        **`inputFiles[]`**: 입력 파일마다 `{ fileId, fileName }`을 요청 순서대로 반환합니다. 파일 수는 `inputFiles.length`로 확인하세요.
        - `role`(`original`/`query`)은 `watermarkExtract` 주문에만 나옵니다. v2 주문의 `watermarked` 역할은 `query`로 반환합니다
        - `uploadUrl`(presigned `PUT` URL)은 `status`가 `pending`이고 해당 파일이 업로드 대기 중일 때만 나옵니다. 그 외에는 키 자체가 없습니다(`null`로 채우지 않음)
        - `uploadHeaders`는 v3로 만든 워터마크 주문에서 `uploadUrl`과 함께만 나옵니다. PUT할 때 이 헤더를 그대로 보내세요. 다른 `Content-Type`을 보내면 스토리지가 403 `SignatureDoesNotMatch`를 반환하고 파일은 저장되지 않습니다.

        **`result`**: 키는 항상 있습니다. `status`가 `complete`일 때만 객체이고, `pending`·`inProgress`·`failed`·`expired`에서는 `null`입니다.
        - `antiAi`: `{ outputFiles: [{ fileId, fileName, inputFileId }] }`
        - `watermarkEmbed`: `{ outputFiles: [{ fileId, fileName, inputFileId, watermarkText }] }`. v3 주문에서 입력 파일 하나에 워터마크 문구를 여러 개 넣으면 문구마다 결과 파일이 하나씩 나옵니다
        - `watermarkExtract`: `{ detectionStatus, watermarkText, reportSupported, reports }`. `detectionStatus`는 `detected`, `undetected`, `inconclusive`, `unsupported`, `error` 중 하나이며, 검출 기록이 없거나 알 수 없는 값으로 남은 v2 주문만 `null`입니다. `error`·`unsupported`는 완료된 주문의 검출 결과로, 주문 실패(`status: failed`, `result: null`, 사유는 `errors`)와 다릅니다. `detectionStatus`가 `detected`가 아니면 `watermarkText`는 `null`입니다. v2 주문은 `reportSupported: false`, `reports: []`입니다
        - `aiDetection`: `{ verdict, probability, options, originalImageUrl, heatmapUrl, overlayUrl }`. `verdict`는 `likely_real`(AI 생성이 아닐 가능성이 높음), `uncertain_real`(AI 생성이 아닐 가능성이 있음), `uncertain_ai`(AI 생성일 가능성이 있음), `likely_ai`(AI 생성일 가능성이 높음) 중 하나이며 `probability`가 `null`이면 `verdict`도 `null`입니다. 판정 값은 AI 생성 여부를 확정하지 않습니다. 저장된 옵션이 없으면 `options`는 `null`입니다

        **`fileId`**: 모든 `fileId`와 `inputFileId`는 숫자로만 된 문자열입니다(`-` 같은 구분자 없음). `result.outputFiles[].fileId`는 주문 안에서 유일하며 [`GET /api/v3/orders/{orderId}/download`](/ko/api-reference/orders/download-order-v3)의 `files[].fileId`와 값·순서가 같습니다.

        **만료 주문**: `expired` 주문도 조회할 수 있지만 `result`는 `null`이고 URL을 발급하지 않습니다.

        **이전 v3 응답과의 차이(breaking change, 2026-10-08)**
        - v3로 만든 워터마크 주문의 `files[]`, `outputs[]`, 최상위 `reports[]`가 `inputFiles[]`, `result.outputFiles[]`, `result.reports[]`로 옮겨졌습니다. 결과 `fileId`가 `{inputFileId}-{n}` 형식에서 숫자 문자열로 바뀌었습니다
        - `detectionStatus` 값 `not_detected`가 `undetected`로 바뀌었습니다
        - v2 상세와 같은 형식을 쓰던 그 외 주문의 최상위 `fileCount`, `statusCode`, `watermarks`, `watermarkText`, `probability`, `options`, `originalImageUrl`, `heatmapUrl`, `overlayUrl` 필드가 `inputFiles`와 `result`로 옮겨졌습니다. AI Detection의 `statusCode`는 `result.verdict`로 바뀌었습니다
        - deprecated된 [`GET /api/v2/orders/{orderId}`](/ko/api-reference/orders/get-order)의 응답은 바뀌지 않습니다

        **테스트 키(`sk_test_`)**: 키가 속한 계정이 소유한 테스트 주문만 조회합니다. live 주문과 다른 계정의 주문은 `404 ORDER_NOT_FOUND`이며, live 키로 테스트 주문을 조회해도 마찬가지입니다. v2·v3로 만든 모든 테스트 주문을 이 형식으로 반환합니다. 이 조회는 읽기 전용이 아닙니다. 같은 계정의 `inProgress` 테스트 주문은 업로드가 끝나고 5초가 지난 뒤 조회하면 `complete` 또는 `failed`가 되고, 테스트 웹훅을 등록했다면 이벤트가 전송됩니다. pending 테스트 주문의 `uploadUrl`은 `https://api.bizmori.com/api/v2/test-uploads/{signedToken}`입니다. 검출 테스트 주문의 `result.reports`는 항상 빈 배열이며, `reportSupported`는 v3로 만든 검출 테스트 주문의 `detectionStatus`가 `detected`일 때만 `true`입니다. `expiresAt`은 운영 주문과 같은 규칙(완료 시각 + 계정의 보관 기간)을 따릅니다. v3로 만든 워터마크 주문은 운영 주문처럼 `uploadHeaders`를 주지만 테스트 업로드는 `Content-Type`을 검사하지 않습니다.
