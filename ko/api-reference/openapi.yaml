  /api/v2/orders/wtr-extract:
    post:
      summary: 워터마크 추출 주문 생성
      operationId: createWatermarkExtractOrder
      x-mint:
        href: /ko/api-reference/watermark-extract/create-order
      description: '워터마크 추출 주문을 생성합니다.

        - 주문당 파일 1개

        - 이미지 (jpg, jpeg, png, webp, bmp, tiff) 또는 PDF 파일 지원

        - 이미지의 경우 `includeOriginal: true`로 원본 파일도 함께 업로드 가능

        - PDF는 `includeOriginal` 미지원

        '
      tags:
      - Watermark Extract
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - file
              properties:
                idempotencyKey:
                  type: string
                  description: 멱등성 키
                file:
                  type: object
                  required:
                  - fileName
                  properties:
                    fileName:
                      type: string
                      description: 워터마크된 파일 이름 (확장자 포함)
                      example: watermarked.jpg
                    includeOriginal:
                      type: boolean
                      default: false
                      description: '원본 파일 포함 (이미지 전용)

                        - true: 원본 파일 업로드 URL도 발급

                        - PDF 파일에는 사용 불가

                        '
                    originalFile:
                      type: object
                      description: 원본 파일 정보 (includeOriginal이 true일 때 필수)
                      required:
                      - fileName
                      properties:
                        fileName:
                          type: string
                          description: 원본 파일 이름
                          example: original.jpg
            examples:
              imageOnly:
                summary: 단일 이미지 (워터마크만)
                value:
                  idempotencyKey: 8b3f1d6e-e7a5-424b-b6c9-1e4d5a8c0f26
                  file:
                    fileName: watermarked.jpg
              imageWithOriginal:
                summary: 이미지 + 원본 포함
                value:
                  idempotencyKey: 9c4a2e7f-f8b6-435c-87da-2f5e6b9d1a37
                  file:
                    fileName: watermarked.jpg
                    includeOriginal: true
                    originalFile:
                      fileName: original.jpg
              pdfOnly:
                summary: PDF 파일
                value:
                  idempotencyKey: ad5b3f8a-a9c7-446d-98eb-3a6f7c0e2b48
                  file:
                    fileName: document.pdf
      responses:
        '200':
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderName:
                        type: string
                        description: 주문 이름 (자동 생성)
                      orderId:
                        type: string
                        description: 주문 ID
                      file:
                        $ref: '#/components/schemas/WtrExtractOrderFile'
              examples:
                imageOnlyResponse:
                  summary: 단일 이미지 응답
                  value:
                    data:
                      orderName: wtr_extract_2026-02-13
                      orderId: '123456789'
                      file:
                        fileId: 1
                        fileName: watermarked.jpg
                        uploadUrl: https://s3.amazonaws.com/...
                        fileKey: 123/456/watermarked.jpg
                        fileFormat: JPG
                        fileType: IMG
                        role: watermarked
                        sequence: 1
                imageWithOriginalResponse:
                  summary: 이미지 + 원본 응답
                  value:
                    data:
                      orderName: wtr_extract_2026-02-13
                      orderId: '123456789'
                      file:
                        fileId: 1
                        fileName: watermarked.jpg
                        uploadUrl: https://s3.amazonaws.com/...
                        fileKey: 123/456/watermarked.jpg
                        fileFormat: JPG
                        fileType: IMG
                        role: watermarked
                        sequence: 1
                        originalFile:
                          fileId: 2
                          fileName: original.jpg
                          uploadUrl: https://s3.amazonaws.com/...
                          fileKey: 123/456/original.jpg
                          fileFormat: JPG
                          fileType: IMG
                          role: original
                          sequence: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
