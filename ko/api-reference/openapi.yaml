  /api/v2/orders/{orderId}:
    get:
      summary: 주문 상세 조회
      operationId: getOrder
      deprecated: true
      description: |-
        **Deprecated**: 모든 주문 종류를 한 가지 형식으로 반환하는 [`GET /api/v3/orders/{orderId}`](/ko/api-reference/orders/get-order-v3)를 사용하세요. 이 API의 응답과 동작은 바뀌지 않습니다.

        **`errors`**: 주문 처리 실패 정보(`OrderErrors`)이며 API 오류 응답 `{ code }`와 다릅니다. 실패하지 않은 주문은 `null`이고, 실패한 뒤 만료된 주문은 저장된 값을 유지합니다. v3로 만든 워터마크 주문은 저장된 값을 `{ errorCode, errorMessage }`로 바꾸며, 저장값이 `null`이면 `null` 그대로입니다. 그 밖의 주문은 저장값을 그대로 반환하므로 `errorCode`가 없는 객체이거나, 일부 오래된 주문은 문자열입니다.

        **AI Detection `statusCode`**: `likely_real`(AI 생성이 아닐 가능성이 높음), `uncertain_real`(AI 생성이 아닐 가능성이 있음), `uncertain_ai`(AI 생성일 가능성이 있음), `likely_ai`(AI 생성일 가능성이 높음) 중 하나입니다. 판정 값은 AI 생성 여부를 확정하지 않습니다. `probability`가 없는 주문은 `probability`와 `statusCode`를 모두 반환하지 않습니다.

        **보관 기간과 URL 유효 시간**
        - `retentionDays`(7 또는 30)는 주문을 만들 때 계정의 파일 보관 설정에서 가져와 주문에 고정합니다. `expiresAt`은 주문이 처음 완료될 때 완료 시각 + `retentionDays`로 정해집니다. 결과 파일은 `expiresAt`까지 받을 수 있습니다
        - `retentionDays`와 `expiresAt`은 데이터 예외에서만 `null`입니다. `retentionDays`가 `null`인 주문은 기록된 `expiresAt`을 따릅니다. `expiresAt`이 `null`이어도 무기한 보관이 아니며, 이 v2 다운로드는 주문 종류보다 보관 기한을 먼저 검사하므로 `409 FILE_RETENTION_UNKNOWN`을 반환합니다
        - 저장된 이미지의 서명 URL(`thumbnailImageUrl`, `originalImageUrl`, `heatmapUrl`, `overlayUrl`)은 발급 시점부터 최대 7일(604,800초) 동안 유효하고 `expiresAt`을 넘지 않습니다. 상태별 고정 이미지 URL은 서명 URL이 아닙니다. URL 유효 시간은 파일 보관 기간과 별개입니다. 새 URL이 필요하면 주문을 다시 조회하세요

        **테스트 키(`sk_test_`)**: 키가 속한 계정이 소유한 테스트 주문을 같은 형식으로 반환하며 S3 이미지 URL은 주지 않습니다. 이 조회는 읽기 전용이 아닙니다. 같은 계정의 `inProgress` 테스트 주문은 5초가 지나면 `complete` 또는 `failed`가 되고, 테스트 웹훅을 등록했다면 이벤트가 전송됩니다. 영속 테스트 주문이 꺼진 환경에서는 `404 ORDER_NOT_FOUND`를 반환합니다.

        **오류**: 주문이 없거나 다른 계정의 주문이면 `404 ORDER_NOT_FOUND`입니다.
