openapi: "3.0.0"
info:
  title: ContentCare API
  version: 2.0.0
  description: 'ContentCare API는 디지털 콘텐츠 보호를 위한 네 가지 핵심 서비스를 제공합니다:

    - **Anti-AI**: 이미지를 AI 학습으로부터 보호

    - **Watermark Embed**: 이미지에 보이지 않는 디지털 워터마크 삽입

    - **Watermark Extract**: 이미지에서 워터마크 추출 및 검증

    - **AI Detection**: 이미지가 AI로 생성되었는지 감지

    - **테스트 API 키**: `sk_test_` 접두사의 키는 동일한 Bearer 인증을 사용하며, 실제 처리 서비스나 크레딧 사용 없이 주문 흐름을 검증할 수 있습니다. 테스트 업로드는 파일 내용을 폐기하고 결과 파일을 만들지 않습니다

    '
  contact:
    name: ContentCare 지원
    email: support@contentcare.ai
  license:
    name: Proprietary
    url: https://docs.contentcare.ai/legal/terms
servers:
- url: https://api.bizmori.com
  description: 프로덕션
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: '외부 클라이언트 접근을 위한 Bearer API 키. 일반 키는 `sk_` 접두사를 사용하고, 테스트 키는 `sk_test_` 접두사로 모의 응답을 사용해 실제 처리나 크레딧 사용 없이 주문 흐름을 검증합니다.'
  schemas:
    BaseResponse:
      type: object
      properties:
        data:
          oneOf:
          - type: object
            nullable: true
            additionalProperties: true
          - type: array
            items: {}
          description: 응답 데이터 (데이터 없을 경우 null)
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: 에러 코드
    PageInfo:
      type: object
      properties:
        totalItems:
          type: integer
          description: 전체 항목 수
        totalPages:
          type: integer
          description: 전체 페이지 수
        currentPage:
          type: integer
          description: 현재 페이지 번호
        itemsPerPage:
          type: integer
          description: 페이지당 항목 수
    OrderOptions:
      type: object
      properties:
        strength:
          type: string
          enum:
          - low
          - standard
          - high
          default: high
          description: '보호 강도 레벨

            * low - 낮은 보호 강도

            * standard - 표준 보호 강도

            * high - 높은 보호 강도

            '
    OrderFile:
      type: object
      properties:
        fileId:
          type: string
          description: 파일 ID
        fileName:
          type: string
          description: 파일 이름
        uploadUrl:
          type: string
          format: uri
          description: '업로드 URL. live 키는 S3 presigned URL을 받고, 테스트 키는 절대 `https://api.bizmori.com/api/v2/test-uploads/{signedToken}` URL을 받습니다. 두 URL은 발급 후 1시간 동안 유효하며 `POST /api/v2/orders/{orderId}/refresh-urls`로 재발급할 수 있습니다. signed token 자체가 테스트 업로드를 인가하므로 PUT에 Authorization 헤더가 필요 없습니다. 테스트 요청 본문은 스트림으로 소비되어 저장되지 않으며, 테스트 주문은 사용량 차감이나 실제 외부 처리 없이 모의 결과로 전이합니다.'
        fileKey:
          type: string
          description: |
            파일 식별자: live 키에서는 S3 object key이고 테스트 키에서는 격리된 logical key입니다.
    AntiAiOrderFile:
      type: object
      description: 'Anti-AI 주문 파일 정보 (파일 모드에 따라 필드가 다름)

        - 업로드 모드: fileId, fileName, uploadUrl, fileKey

        - URL 모드: fileId, fileName, originalFileUrl

        '
      properties:
        fileId:
          type: string
          description: 파일 ID
        fileName:
          type: string
          description: 파일 이름
        uploadUrl:
          type: string
          format: uri
          description: '업로드 URL — 업로드 모드 파일만 해당. live 키는 S3 presigned URL을 받고, 테스트 키는 절대 `https://api.bizmori.com/api/v2/test-uploads/{signedToken}` URL을 받습니다. 두 URL은 1시간 후 만료되며 `POST /api/v2/orders/{orderId}/refresh-urls`로 재발급할 수 있습니다. signed token 자체가 테스트 업로드를 인가하므로 PUT에 Authorization 헤더가 필요 없습니다. 테스트 요청 본문은 스트림으로 소비되어 저장되지 않으며, 테스트 주문은 사용량 차감이나 실제 외부 처리 없이 모의 결과로 전이합니다.'
        fileKey:
          type: string
          description: |
            파일 식별자 — 업로드 모드 파일만 해당: live 키에서는 S3 object key이고 테스트 키에서는 격리된 logical key입니다.
        originalFileUrl:
          type: string
          format: uri
          description: 원본 이미지 URL — URL 모드 파일만 해당
    Order:
      type: object
      properties:
        orderId:
          type: string
          description: 주문 ID
        orderName:
          type: string
          description: 주문 이름
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 주문 타입. v3 워터마크 API로 생성한 주문도 `watermarkEmbed` 또는 `watermarkExtract`로 반환합니다
        channel:
          type: string
          enum:
          - api
          - web
          description: 주문 채널
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: '주문 상태

            * pending - 대기 중

            * inProgress - 처리 중

            * complete - 완료

            * failed - 실패

            * expired - 주문에 고정된 보관 기간(7일 또는 30일)이 끝나 파일을 더 이상 받을 수 없음

            '
        fileCount:
          type: integer
          description: 파일 수. v3 워터마크 주문은 삽입이면 원본 파일 수, 추출이면 검사 파일만 셉니다
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: |
            썸네일 이미지 URL. Anti-AI·AI Detection·v2 워터마크 주문의 저장된 썸네일은 presigned URL이며 발급 시점부터 최대 7일 동안 유효하고 주문의 보관 기한을 넘지 않습니다. v3로 만든 워터마크 주문의 썸네일은 보관 기한 전에만 발급하지만 900초로 고정 서명합니다. aiDetection 주문은 generateThumbnail 옵션을 쓴 경우에만 반환합니다. 만료되면 null입니다.
            v3 워터마크 주문은 처리 완료 후 최대 100×100 WebP 썸네일(PDF는 첫 페이지)을 반환합니다. 처리 전·실패·썸네일이 없는 주문은 상태 이미지를 반환합니다.
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정일시
        probability:
          type: number
          nullable: true
          description: AI 감지 확률 (aiDetection 주문 전용)
        statusCode:
          type: string
          nullable: true
          enum:
          - detected
          - undetected
          - inconclusive
          - unsupported
          - error
          - likely_real
          - uncertain_real
          - uncertain_ai
          - likely_ai
          description: |
            주문 타입별 상태 코드. 결과가 나오기 전에는 `null`입니다.

            **watermarkExtract 주문:**

            * `detected` - 워터마크 검출됨
            * `undetected` - 워터마크 미검출
            * `inconclusive` - 판단 불가 (v3 주문만)
            * `unsupported` - 처리할 수 없는 입력 (v3 주문만)
            * `error` - 검출 처리 실패 (v3 주문만)

            **aiDetection 주문** (probability로 계산):

            * `likely_real` - 실제 콘텐츠일 가능성 높음
            * `uncertain_real` - 불확실, 실제 콘텐츠 쪽
            * `uncertain_ai` - 불확실, AI 생성 쪽
            * `likely_ai` - AI 생성 가능성 높음
    OrderErrors:
      description: |-
        주문 처리 실패 정보(주문 상세의 `errors`). API 오류 응답 본문 `{ code }`와는 다른 값입니다.
        - 실패하지 않은 주문은 `null`입니다. 실패한 뒤 보관 기한이 지나 `expired`가 된 주문은 실패 때 저장한 값을 그대로 유지합니다
        - v3로 만든 워터마크 주문은 저장된 값을 공개 `errorCode`와 고정 `errorMessage`가 있는 객체로 바꿉니다. 예전 주문에 문자열로 저장된 값도 이 객체로 바꿉니다. 저장값이 `null`이면 `null` 그대로이며, 실패 상태라는 이유만으로 객체를 만들지 않습니다
        - 그 밖의 주문(Anti-AI, AI Detection, v2로 만든 워터마크 주문)은 저장값을 그대로 반환합니다. 보통 객체이며 `errorCode` 없이 `errorMessage`만 있을 수 있고, 오래된 주문은 문자열일 수 있습니다

        `null`, 객체, 문자열을 모두 처리하세요.
      oneOf:
      - $ref: '#/components/schemas/OrderErrorObject'
      - type: string
        description: 오래된 주문에 문자열로 저장된 오류 정보. v3로 만든 워터마크 주문에는 반환하지 않습니다. 저장값 그대로이며 정해진 형식이 없습니다
    OrderErrorObject:
      type: object
      nullable: true
      description: 객체 형식의 실패 정보. v3로 만든 워터마크 주문의 객체에는 두 필드가 모두 있고, 그 밖의 주문은 저장된 필드만 있습니다
      properties:
        errorCode:
          type: string
          description: 오류 코드. v3로 만든 워터마크 주문은 `WATERMARK_FILE_CORRUPTED`, `ORDER_TIMEOUT`, `PROCESSING_ERROR` 같은 공개 코드를 반환합니다. 공개 코드를 저장하는 AI Detection 주문은 `AI_DETECTION_INVALID_IMAGE`, `AI_DETECTION_TIMEOUT`, `AI_DETECTION_SERVICE_ERROR`, `AI_DETECTION_FAILED` 중 하나입니다. 그 밖의 주문에는 없을 수 있습니다
          example: WATERMARK_FILE_CORRUPTED
        errorMessage:
          type: string
          description: 실패 안내 문구(한국어). v3로 만든 워터마크 주문은 오류 코드별 고정 문구이며 처리기 원문을 담지 않습니다. 그 밖의 주문은 저장된 문구입니다
    OrderDetail:
      type: object
      description: 주문 상세 정보
      properties:
        orderId:
          type: string
          description: 주문 ID
        orderName:
          type: string
          description: 주문 이름
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 주문 타입
        channel:
          type: string
          enum:
          - api
          - web
          description: 주문 채널
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: 주문 상태
        fileCount:
          type: integer
          description: 파일 수
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: |
            썸네일 이미지 URL. 저장된 썸네일은 프리사인드 URL이며 발급 시점부터 최대 7일(604,800초) 동안 유효하고 `expiresAt`을 넘지 않습니다. 이 URL 유효 시간은 파일 보관 기간과 별개이며, 새 URL이 필요하면 주문을 다시 조회하세요. 만료 상태 시 null입니다.
            Anti-AI 주문은 비율을 유지한 가로 740·세로 400 이내 WebP 상세 썸네일을 반환합니다. 이 변경 이전에 만든 주문이나 상세 썸네일을 만들지 못한 주문은 200×200 썸네일을 반환합니다.
            AI Detection 주문은 처리 완료 후 `generateThumbnail` 옵션과 관계없이 상세 썸네일(WebP, 740×400 이내)을 반환합니다. 리사이즈 이미지가 준비되지 않았으면 원본 입력 이미지 URL을 반환합니다.
        originalImageUrl:
          type: string
          format: uri
          nullable: true
          description: |
            원본 입력 이미지 다운로드 URL(프리사인드 URL. 발급 시점부터 최대 7일 유효하며 `expiresAt`을 넘지 않음). aiDetection 주문 전용. 만료 상태 시 null입니다.
            처리 완료 후에는 보통 긴 변을 1600px 이내로 줄인 사본(WebP)을 반환합니다. 리사이즈 사본이 준비되지 않았으면 원본 입력 이미지를 반환합니다.
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
        retentionDays:
          type: integer
          nullable: true
          description: 파일 보관 기간(일, 7 또는 30). 주문을 만들 때 계정의 파일 보관 설정에서 가져와 주문에 고정합니다. 데이터 예외에서만 `null`입니다
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 주문 파일을 받을 수 있는 기한(UTC, ISO 8601). 주문이 처음 완료될 때 완료 시각 + `retentionDays`로 정해지며, `pending`·`inProgress`일 때는 임시값입니다. 데이터 예외에서만 `null`입니다. `null`은 무기한 보관이 아니며, 이때 v2 다운로드는 `409 FILE_RETENTION_UNKNOWN`을 반환합니다
        errors:
          $ref: '#/components/schemas/OrderErrors'
        watermarks:
          type: array
          items:
            type: string
          description: 워터마크 텍스트 목록 (watermarkEmbed 주문 전용)
        watermarkText:
          type: string
          nullable: true
          description: 추출된 워터마크 텍스트 (watermarkExtract 주문 전용)
        probability:
          type: number
          nullable: true
          description: AI 감지 확률 (aiDetection 주문 전용)
        statusCode:
          type: string
          nullable: true
          description: '주문 타입별 상태 코드.

            **watermarkExtract 주문:**

            * detected - 워터마크 검출됨

            * undetected - 워터마크 미검출

            **aiDetection 주문** (서버가 probability로 정한 판정):

            * likely_real - AI 생성이 아닐 가능성이 높음

            * uncertain_real - AI 생성이 아닐 가능성이 있음

            * uncertain_ai - AI 생성일 가능성이 있음

            * likely_ai - AI 생성일 가능성이 높음

            판정 값은 AI 생성일 가능성의 정도를 나타내며 AI 생성 여부를 확정하지 않습니다. 아직 `probability`가 없으면 `probability`와 `statusCode`를 모두 반환하지 않습니다.

            다른 주문 타입에서는 반환되지 않습니다.

            '
        options:
          type: object
          nullable: true
          description: 주문 생성 시 설정한 옵션 (aiDetection 주문만)
          properties:
            generateHeatmap:
              type: boolean
              description: 히트맵 이미지 생성 여부
              example: true
            generateOverlay:
              type: boolean
              description: 오버레이 이미지 생성 여부
              example: true
            generateThumbnail:
              type: boolean
              description: 썸네일 이미지 생성 여부
              example: true
        heatmapUrl:
          type: string
          format: uri
          nullable: true
          description: |
            AI 판별 히트맵 이미지 다운로드 URL (aiDetection 주문 전용, generateHeatmap 옵션 사용 시 반환). 프리사인드 URL이며 발급 시점부터 최대 7일 유효하고 `expiresAt`을 넘지 않습니다.
            보통 긴 변을 1600px 이내로 줄인 WebP입니다. 리사이즈 이미지가 준비되지 않았으면 원본 크기 PNG를 반환합니다.
        overlayUrl:
          type: string
          format: uri
          nullable: true
          description: |
            원본 위 히트맵 오버레이 이미지 다운로드 URL (aiDetection 주문 전용, generateOverlay 옵션 사용 시 반환). 프리사인드 URL이며 발급 시점부터 최대 7일 유효하고 `expiresAt`을 넘지 않습니다.
            보통 긴 변을 1600px 이내로 줄인 WebP입니다. 리사이즈 이미지가 준비되지 않았으면 원본 크기 PNG를 반환합니다.
    UsageStats:
      type: object
      properties:
        dailyStats:
          type: array
          items:
            type: object
            properties:
              usageDate:
                type: string
                description: 사용 날짜 (MM.DD)
              usageCount:
                type: integer
                description: 사용 횟수
        domain:
          type: array
          items:
            type: integer
          description: 차트 Y축 범위 [최솟값, 최댓값]
        ticks:
          type: array
          items:
            type: integer
          description: 차트 Y축 눈금 값
    WebhookRegisterRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: 웹훅 엔드포인트 URL
          example: https://example.com/webhook
        isTest:
          type: boolean
          description: '엔드포인트 모드. 테스트 API 키는 생략하거나 true를 사용하며 true로 강제됩니다. false는 AUTH_FORBIDDEN을 반환합니다. live API 키는 두 모드를 선택할 수 있습니다.'
    WebhookInfo:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: 등록된 웹훅 URL
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: 생성 시각
    WebhookCreateRequest:
      type: object
      required:
      - url
      properties:
        name:
          type: string
          maxLength: 100
          description: 웹훅 이름 (식별용)
        url:
          type: string
          format: uri
          description: 웹훅 엔드포인트 URL
          example: https://example.com/webhook
        isTest:
          type: boolean
          description: '엔드포인트 모드. 테스트 API 키에서는 생략하거나 true를 사용하며 false는 AUTH_FORBIDDEN을 반환합니다. live API 키는 두 모드를 선택할 수 있습니다.'
    WebhookUpdateRequest:
      type: object
      required:
      - url
      properties:
        name:
          type: string
          maxLength: 100
          description: 웹훅 이름
        url:
          type: string
          format: uri
          description: 웹훅 URL
          example: https://example.com/webhook
        isTest:
          type: boolean
          description: '엔드포인트 모드. 테스트 API 키에서는 생략 시 테스트 모드를 유지하고 true는 허용되며 false는 AUTH_FORBIDDEN을 반환합니다. live API 키는 두 모드를 선택할 수 있습니다.'
    WebhookListItem:
      type: object
      properties:
        id:
          type: integer
          description: 웹훅 ID
        name:
          type: string
          description: 웹훅 이름
        url:
          type: string
          format: uri
          description: 웹훅 URL
        isActive:
          type: boolean
          description: 활성화 상태
        isTest:
          type: boolean
          description: 테스트 엔드포인트 여부
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 전송 시각
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
    WebhookDetail:
      type: object
      properties:
        id:
          type: integer
          description: 웹훅 ID
        name:
          type: string
          description: 웹훅 이름
        url:
          type: string
          format: uri
          description: 웹훅 URL
        secret:
          type: string
          description: 웹훅 서명 시크릿
        isActive:
          type: boolean
          description: 활성화 상태
        isTest:
          type: boolean
          description: 테스트 엔드포인트 여부
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
    WebhookEvent:
      type: object
      properties:
        id:
          type: integer
          description: 이벤트 DB ID
        eventId:
          type: string
          format: uuid
          description: 이벤트 UUID
        eventType:
          type: string
          description: 이벤트 타입
          example: order.antiAi.completed
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - RETRYING
          - FAILED
          description: 전송 상태
        retries:
          type: integer
          description: 재시도 횟수
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 전송 시각
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
    WebhookPagination:
      type: object
      properties:
        page:
          type: integer
          description: 현재 페이지
        limit:
          type: integer
          description: 페이지당 항목 수
        total:
          type: integer
          description: 전체 항목 수
        totalPages:
          type: integer
          description: 전체 페이지 수
    WatermarkV1OrderResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/WatermarkV1Order'
    WatermarkV1Order:
      type: object
      description: 'v3 API로 생성한 비가시성 워터마크 주문(주문 생성 응답). 주문 상세는 형식이 다른 `GET /api/v3/orders/{orderId}`로 조회하세요'
      required:
      - orderId
      - status
      - processingDelayed
      - files
      - outputs
      - result
      - reports
      properties:
        orderId:
          type: string
          description: 주문 ID
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: |
            주문 처리 상태

            * `pending` - 파일 업로드 대기
            * `inProgress` - 처리 중
            * `complete` - 처리 완료. 추출 주문은 `result`에서 결과를 확인합니다
            * `failed` - 처리 실패, 또는 12시간 안에 업로드되지 않음
            * `expired` - 주문에 고정된 보관 기간(7일 또는 30일)이 끝나 파일을 더 이상 받을 수 없음
        processingDelayed:
          type: boolean
          description: 자동 재시도를 모두 소진해 수동 복구를 기다리면 `true`. 주문은 `inProgress`로 유지됩니다
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 주문 파일을 받을 수 있는 기한. 주문이 처음 완료될 때 완료 시각 + 주문에 고정된 보관 기간으로 정해지며, 그 전에는 임시값입니다. 이후 다운로드와 보고서는 `ORDER_EXPIRED`를 반환합니다
        files:
          type: array
          description: 요청 순서의 입력 파일. 추출 주문은 원본, 검사 파일 순서입니다
          items:
            $ref: '#/components/schemas/WatermarkV1UploadFile'
        outputs:
          type: array
          description: 삽입 결과. 워터마크 문구마다 1개이며 추출 주문은 빈 배열입니다
          items:
            $ref: '#/components/schemas/WatermarkV1Output'
        result:
          $ref: '#/components/schemas/WatermarkV1DetectionResult'
        reports:
          type: array
          description: 이 주문으로 요청한 보고서
          items:
            type: object
            required:
            - locale
            - status
            properties:
              locale:
                type: string
                enum:
                - ko-KR
                - en-US
                - ja-JP
              status:
                type: string
                enum:
                - queued
                - processing
                - completed
                - failed
    WatermarkV1UploadFile:
      type: object
      required:
      - fileId
      - uploadUrl
      - uploadHeaders
      properties:
        fileId:
          type: string
          description: 입력 파일 ID
        uploadUrl:
          type: string
          format: uri
          nullable: true
          description: |
            파일 업로드용 presigned `PUT` URL(900초 유효). 주문 `status`가 `pending`이고 보관 기한 전이며 업로드 대기 중인 파일에만 발급합니다.
            `originalFileUrl`로 지정한 파일, 업로드가 끝난 파일, 12시간 업로드 기한을 넘겨 `failed`가 된 주문, 보관 기한이 지난 주문은 `null`입니다.
            PUT할 때 `uploadHeaders`의 헤더를 그대로 보냅니다. 다르면 스토리지가 403 `SignatureDoesNotMatch`로 거절합니다. `byteSize`를 보냈다면 본문 크기도 그 값과 같아야 합니다.
        uploadHeaders:
          type: object
          nullable: true
          description: |
            `uploadUrl`로 PUT할 때 그대로 보낼 헤더. `uploadUrl`이 `null`이면 `null`입니다.
            지금은 `Content-Type` 하나이며 값은 서버가 파일 확장자로 정합니다. `Content-Length`는 HTTP 클라이언트가 본문 크기로 정하므로 넣지 않습니다.
            테스트 키 주문도 같은 값을 주지만 테스트 업로드는 `Content-Type`을 검사하지 않습니다. 운영 주문이 지원하지 않는 확장자의 테스트 파일은 빈 객체입니다.
          additionalProperties:
            type: string
          example:
            Content-Type: image/jpeg
    WatermarkV1Output:
      type: object
      required:
      - fileId
      - inputFileId
      - outputIndex
      - watermarkText
      - status
      - mediaKind
      properties:
        fileId:
          type: string
          description: '주문 안에서 결과를 구분하는 `{inputFileId}-{순번}` 형식의 식별자(주문 생성 응답 전용). 주문 상세 `result.outputFiles[].fileId`와 다운로드 응답 `files[].fileId`는 숫자 문자열이며 이 값과 다릅니다'
        inputFileId:
          type: string
          description: 이 결과를 만든 입력 파일 ID
        outputIndex:
          type: integer
          minimum: 0
          description: 입력 파일 `watermarks` 안에서 해당 문구의 위치
        watermarkText:
          type: string
          description: 삽입한 워터마크 문구
        status:
          type: string
          enum:
          - pending
          - queued
          - processing
          - completed
          - failed
          - retry_required
          description: 이 결과 파일의 처리 상태
        mediaKind:
          type: string
          enum:
          - image
          - pdf
    WatermarkV1DetectionResult:
      type: object
      nullable: true
      description: 추출 결과 요약. 삽입 주문과 결과가 나오기 전에는 `null`이며 아래 필드만 포함합니다
      required:
      - detectionStatus
      - reportSupported
      - watermarkText
      additionalProperties: false
      properties:
        detectionStatus:
          type: string
          enum:
          - detected
          - not_detected
          - inconclusive
          - unsupported
          - error
          description: |
            * `detected` - 워터마크를 찾음
            * `not_detected` - 끝까지 검사했으나 워터마크 없음
            * `inconclusive` - 후보는 있으나 확신 기준 미달로 판단 불가
            * `unsupported` - 처리할 수 없는 입력 (크레딧 환불)
            * `error` - 검출 처리 실패, 워터마크 없음과 다름 (크레딧 환불)
        reportSupported:
          type: boolean
          description: 이 결과로 보고서를 만들 수 있는지 여부. PDF에서 캡처한 이미지는 `false`
        watermarkText:
          type: string
          nullable: true
          description: |
            검출된 워터마크의 삽입 문구. `detectionStatus`가 `detected`이고, 호출 계정이 직접 삽입했으며 발급 기록이 정확히 1건일 때만 반환합니다.
            다른 계정이 삽입한 워터마크 등 그 외에는 `null`입니다.
    PublicInputFile:
      type: object
      description: '`watermarkExtract` 외 주문의 입력 파일(요청 순서). `role` 키는 없습니다. `uploadUrl` 키는 주문 `status`가 `pending`이고 해당 파일이 업로드 대기 중일 때만 나오며, 그 외에는 키 자체가 없습니다(`null`로 채우지 않음)'
      required:
      - fileId
      - fileName
      additionalProperties: false
      properties:
        fileId:
          type: string
          pattern: ^[0-9]+$
          description: 입력 파일 ID. 숫자로만 된 문자열입니다
          example: '11'
        fileName:
          type: string
          nullable: true
          description: 입력 파일명(확장자 포함). 알 수 없으면 `null`입니다
          example: cat.png
        uploadUrl:
          type: string
          format: uri
          description: 파일 업로드용 presigned `PUT` URL. 주문 `status`가 `pending`이고 보관 기한 전이며 해당 파일이 업로드 대기 중일 때만 나옵니다. 업로드가 끝난 파일, `originalFileUrl`로 지정한 파일, `pending`이 아닌 주문에서는 키가 없습니다. `uploadHeaders`가 함께 있으면 PUT할 때 그 헤더를 그대로 보냅니다. 다르면 스토리지가 403 `SignatureDoesNotMatch`로 거절합니다.
        uploadHeaders:
          type: object
          description: |
            `uploadUrl`로 PUT할 때 그대로 보낼 헤더. v3로 만든 워터마크 주문에서 `uploadUrl`과 함께만 나오며 그 외에는 키가 없습니다.
          additionalProperties:
            type: string
          example:
            Content-Type: image/jpeg
    PublicExtractInputFile:
      type: object
      description: '`watermarkExtract` 주문의 입력 파일. 원본과 검사 대상을 구분하는 `role`이 더해집니다. `uploadUrl` 규칙은 `PublicInputFile`과 같습니다'
      required:
      - fileId
      - fileName
      - role
      additionalProperties: false
      properties:
        fileId:
          type: string
          pattern: ^[0-9]+$
          description: 입력 파일 ID. 숫자로만 된 문자열입니다
          example: '51'
        fileName:
          type: string
          nullable: true
          description: 입력 파일명(확장자 포함). 알 수 없으면 `null`입니다
          example: suspect.png
        role:
          type: string
          enum:
          - original
          - query
          description: |-
            * `original` - 워터마크를 넣은 원본 파일
            * `query` - 워터마크가 있는지 검사할 파일. v2 주문의 `watermarked` 역할도 `query`로 반환합니다
        uploadUrl:
          type: string
          format: uri
          description: 파일 업로드용 presigned `PUT` URL. `status`가 `pending`이고 해당 파일이 업로드 대기 중일 때만 나옵니다. `uploadHeaders`가 함께 있으면 PUT할 때 그 헤더를 그대로 보냅니다. 다르면 스토리지가 403 `SignatureDoesNotMatch`로 거절합니다.
        uploadHeaders:
          type: object
          description: |
            `uploadUrl`로 PUT할 때 그대로 보낼 헤더. v3로 만든 워터마크 주문에서 `uploadUrl`과 함께만 나오며 그 외에는 키가 없습니다.
          additionalProperties:
            type: string
          example:
            Content-Type: image/jpeg
    PublicOutputFile:
      type: object
      description: Anti-AI 주문의 결과 파일 1개. `fileId`는 다운로드 응답 `files[].fileId`와 값·순서가 같습니다
      required:
      - fileId
      - fileName
      - inputFileId
      additionalProperties: false
      properties:
        fileId:
          type: string
          pattern: ^[0-9]+$
          description: 결과 파일 ID. 숫자로만 된 문자열이며 주문 안에서 유일합니다
          example: '21'
        fileName:
          type: string
          nullable: true
          description: 결과 파일명(확장자 포함). 알 수 없으면 `null`입니다
          example: cat.png
        inputFileId:
          type: string
          pattern: ^[0-9]+$
          description: 이 결과를 만든 입력 파일의 `inputFiles[].fileId`
          example: '11'
    PublicWatermarkEmbedOutputFile:
      type: object
      description: 워터마크 삽입 주문의 결과 파일 1개. `PublicOutputFile`에 삽입 문구 `watermarkText`가 더해집니다. v3 주문에서 입력 파일 하나에 문구를 여러 개 넣으면 같은 `inputFileId`를 가진 결과 파일이 여러 개 나옵니다
      required:
      - fileId
      - fileName
      - inputFileId
      - watermarkText
      additionalProperties: false
      properties:
        fileId:
          type: string
          pattern: ^[0-9]+$
          description: 결과 파일 ID. 숫자로만 된 문자열이며 주문 안에서 유일합니다
          example: '201'
        fileName:
          type: string
          nullable: true
          description: 결과 파일명(확장자 포함). 알 수 없으면 `null`입니다
          example: logo.png
        inputFileId:
          type: string
          pattern: ^[0-9]+$
          description: 이 결과를 만든 입력 파일의 `inputFiles[].fileId`
          example: '31'
        watermarkText:
          type: string
          description: 이 결과 파일에 삽입한 워터마크 문구
          example: MORI
    PublicAntiAiResult:
      type: object
      nullable: true
      description: Anti-AI 주문 결과. `status`가 `complete`일 때만 객체이고 그 외에는 `null`입니다
      required:
      - outputFiles
      additionalProperties: false
      properties:
        outputFiles:
          type: array
          description: 결과 파일 목록. 입력 파일마다 결과 1개입니다
          items:
            $ref: '#/components/schemas/PublicOutputFile'
    PublicWatermarkEmbedResult:
      type: object
      nullable: true
      description: 워터마크 삽입 주문 결과. `status`가 `complete`일 때만 객체이고 그 외에는 `null`입니다. 이전 v3 응답의 `outputs[]`와 v2 상세의 `watermarks[]`를 대체합니다
      required:
      - outputFiles
      additionalProperties: false
      properties:
        outputFiles:
          type: array
          description: 결과 파일 목록. 입력 파일 순서, 같은 입력 안에서는 결과 순서로 정렬합니다
          items:
            $ref: '#/components/schemas/PublicWatermarkEmbedOutputFile'
    PublicWatermarkExtractResult:
      type: object
      nullable: true
      description: 워터마크 검출 주문 결과. `status`가 `complete`일 때만 객체이고 그 외에는 `null`입니다. 워터마크 ID, 엔진 사유 코드 같은 내부 값은 포함하지 않습니다
      required:
      - detectionStatus
      - watermarkText
      - reportSupported
      - reports
      additionalProperties: false
      properties:
        detectionStatus:
          type: string
          nullable: true
          enum:
          - detected
          - undetected
          - inconclusive
          - unsupported
          - error
          - null
          description: |-
            판정 값. 검출 기록이 없거나 알 수 없는 값으로 남은 v2 주문(과거 데이터 예외)만 `null`입니다. `error`·`unsupported`는 주문이 `complete`로 끝난 뒤의 검출 결과입니다. 주문 자체가 실패하면 `status`가 `failed`, `result`가 `null`이고 사유는 `errors`에 있습니다.
            * `detected` - 워터마크를 찾음
            * `undetected` - 끝까지 검사했으나 워터마크 없음. v3 엔진의 `not_detected`와 저장 status가 `undetected`인 v2 주문을 포함합니다
            * `inconclusive` - 후보는 있으나 확신 기준에 못 미쳐 판단할 수 없음
            * `unsupported` - 처리할 수 없는 입력(크레딧 환불)
            * `error` - 검출 처리 실패. 워터마크 없음과 다릅니다. 검출 처리에 실패한 v2 주문을 포함합니다
        watermarkText:
          type: string
          nullable: true
          description: 검출된 워터마크의 삽입 문구. `detectionStatus`가 `detected`가 아니면 `null`입니다. v3 주문은 호출 계정이 직접 삽입했고 발급 기록이 정확히 1건일 때만 반환하며, 그 외에는 `null`입니다
        reportSupported:
          type: boolean
          description: 이 검출 결과로 분석 보고서를 만들 수 있는지 여부. v2 주문과 PDF에서 캡처한 이미지는 `false`입니다
        reports:
          type: array
          description: 이 주문의 locale별 보고서 상태. v2 주문은 항상 빈 배열입니다
          items:
            type: object
            required:
            - locale
            - status
            additionalProperties: false
            properties:
              locale:
                type: string
                enum:
                - ko-KR
                - en-US
                - ja-JP
              status:
                type: string
                enum:
                - queued
                - processing
                - completed
                - failed
    PublicAiDetectionResult:
      type: object
      nullable: true
      description: AI Detection 주문 결과. `status`가 `complete`일 때만 객체이고 그 외에는 `null`입니다. 이전 응답의 `statusCode`는 `verdict`로 대체되었습니다
      required:
      - verdict
      - probability
      - options
      - originalImageUrl
      - heatmapUrl
      - overlayUrl
      additionalProperties: false
      properties:
        verdict:
          type: string
          nullable: true
          enum:
          - likely_real
          - uncertain_real
          - uncertain_ai
          - likely_ai
          - null
          description: |-
            `probability` 기준 판정. `probability`가 `null`이면 `null`입니다.
            * `likely_real` - AI 생성이 아닐 가능성이 높음
            * `uncertain_real` - AI 생성이 아닐 가능성이 있음
            * `uncertain_ai` - AI 생성일 가능성이 있음
            * `likely_ai` - AI 생성일 가능성이 높음

            판정 값은 AI 생성일 가능성의 정도를 나타내며 AI 생성 여부를 확정하지 않습니다.
        probability:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: AI 생성 확률(0~1). 값이 없으면 `null`입니다
          example: 0.31
        options:
          type: object
          nullable: true
          description: 주문 생성 시 설정한 옵션. 저장된 옵션이 없으면 `null`입니다
          properties:
            generateHeatmap:
              type: boolean
            generateOverlay:
              type: boolean
            generateThumbnail:
              type: boolean
        originalImageUrl:
          type: string
          format: uri
          nullable: true
          description: 원본 입력 이미지 URL(presigned. 발급 시점부터 최대 7일 유효하며 `expiresAt`을 넘지 않음. 새 URL이 필요하면 주문을 다시 조회). 리사이즈 이미지가 모두 준비된 주문은 긴 변 1600px 이내 WebP입니다
        heatmapUrl:
          type: string
          format: uri
          nullable: true
          description: 히트맵 이미지 URL(presigned. 발급 시점부터 최대 7일 유효하며 `expiresAt`을 넘지 않음. 새 URL이 필요하면 주문을 다시 조회). `generateHeatmap` 옵션을 쓴 주문만 반환하고 그 외에는 `null`입니다
        overlayUrl:
          type: string
          format: uri
          nullable: true
          description: 원본 위 히트맵 오버레이 이미지 URL(presigned. 발급 시점부터 최대 7일 유효하며 `expiresAt`을 넘지 않음. 새 URL이 필요하면 주문을 다시 조회). `generateOverlay` 옵션을 쓴 주문만 반환하고 그 외에는 `null`입니다
    PublicOrderV3DetailCommon:
      type: object
      description: v3 주문 상세의 공통 필드. 모든 주문 종류·워터마크 엔진에서 최상위 키 집합이 같으며 종류별 차이는 `result` 안에만 있습니다. 이전 응답의 최상위 `fileCount`, `statusCode`, `files`, `outputs`, `reports`, `watermarks` 필드는 반환하지 않습니다
      required:
      - type
      - orderId
      - orderName
      - channel
      - status
      - createdAt
      - updatedAt
      - expiresAt
      - retentionDays
      - thumbnailImageUrl
      - processingDelayed
      - errors
      - inputFiles
      - result
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 주문 종류. 워터마크 주문은 v2·v3 어느 쪽으로 만들었든 `watermarkEmbed`/`watermarkExtract`로 반환합니다
        orderId:
          type: string
          description: 주문 ID
          example: '1001'
        orderName:
          type: string
          nullable: true
          description: 주문 이름. v3로 만든 워터마크 주문은 표시 파일명을, 없으면 저장된 이름을 반환합니다
        channel:
          type: string
          enum:
          - api
          - web
          description: 주문 채널
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: |-
            * `pending` - 업로드 대기
            * `inProgress` - 처리 중
            * `complete` - 완료. 이때만 `result`가 객체입니다
            * `failed` - 실패. 사유는 `errors`에 있습니다
            * `expired` - 파일 보관 기한 경과. 조회는 가능하지만 `result`와 모든 URL은 `null`입니다

            저장 status가 `detected`/`undetected`인 v2 워터마크 검출 주문은 `complete`로 반환하고 판정 값은 `result.detectionStatus`에 담습니다
        createdAt:
          type: string
          format: date-time
          description: 생성 일시
        updatedAt:
          type: string
          format: date-time
          description: 수정 일시
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 파일을 받을 수 있는 기한(UTC, ISO 8601). 주문이 처음 완료될 때 완료 시각 + `retentionDays`로 정해지며, `pending`·`inProgress`일 때는 임시값입니다. 무결성 예외에서만 `null`이며 무기한 보관을 뜻하지 않습니다
        retentionDays:
          type: integer
          nullable: true
          description: 파일 보관 기간(일, 7 또는 30). 주문을 만들 때 계정의 파일 보관 설정에서 가져와 주문에 고정하며, 나중에 설정을 바꿔도 기존 주문은 바뀌지 않습니다. 무결성 예외에서만 `null`입니다
          example: 30
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: 썸네일 이미지 URL. 출처는 주문 종류별 규칙을 따릅니다. Anti-AI 주문과 v2 워터마크 주문은 미완료·실패 상태에서 고정 상태 이미지를, AI Detection 주문은 상세 썸네일 또는 원본 이미지를, v3 워터마크 주문은 상세 썸네일을 반환하며 처리 전에는 `null`일 수 있습니다
        processingDelayed:
          type: boolean
          description: v3로 만든 워터마크 주문이 자동 재시도를 모두 소진해 수동 복구를 기다리면 `true`입니다. 주문은 `inProgress`를 유지합니다. 그 외 주문은 항상 `false`입니다
        errors:
          $ref: '#/components/schemas/OrderErrors'
        inputFiles:
          type: array
          description: 입력 파일 목록(요청 순서). 파일 수는 `inputFiles.length`입니다. `watermarkExtract` 주문은 `PublicExtractInputFile`(`role` 포함), 그 외 주문은 `PublicInputFile`입니다
          items:
            anyOf:
            - $ref: '#/components/schemas/PublicInputFile'
            - $ref: '#/components/schemas/PublicExtractInputFile'
        result:
          type: object
          nullable: true
          description: 주문 종류별 결과. 키는 항상 있으며 `status`가 `complete`일 때만 객체이고 그 외에는 `null`입니다
    PublicAntiAiOrderV3Detail:
      title: Anti-AI
      description: Anti-AI 주문 상세
      allOf:
      - $ref: '#/components/schemas/PublicOrderV3DetailCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - antiAi
          inputFiles:
            type: array
            items:
              $ref: '#/components/schemas/PublicInputFile'
          result:
            $ref: '#/components/schemas/PublicAntiAiResult'
    PublicWatermarkEmbedOrderV3Detail:
      title: 워터마크 삽입
      description: 워터마크 삽입 주문 상세(v2·v3)
      allOf:
      - $ref: '#/components/schemas/PublicOrderV3DetailCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - watermarkEmbed
          inputFiles:
            type: array
            items:
              $ref: '#/components/schemas/PublicInputFile'
          result:
            $ref: '#/components/schemas/PublicWatermarkEmbedResult'
    PublicWatermarkExtractOrderV3Detail:
      title: 워터마크 검출
      description: 워터마크 검출 주문 상세(v2·v3). 이 주문 종류만 `inputFiles[].role`이 있습니다
      allOf:
      - $ref: '#/components/schemas/PublicOrderV3DetailCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - watermarkExtract
          inputFiles:
            type: array
            items:
              $ref: '#/components/schemas/PublicExtractInputFile'
          result:
            $ref: '#/components/schemas/PublicWatermarkExtractResult'
    PublicAiDetectionOrderV3Detail:
      title: AI Detection
      description: AI Detection 주문 상세
      allOf:
      - $ref: '#/components/schemas/PublicOrderV3DetailCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - aiDetection
          inputFiles:
            type: array
            items:
              $ref: '#/components/schemas/PublicInputFile'
          result:
            $ref: '#/components/schemas/PublicAiDetectionResult'
    PublicOrderV3Detail:
      description: v3 주문 상세. 최상위 필드는 모든 주문 종류가 같고(`PublicOrderV3DetailCommon`), `type`에 따라 `result`와 검출 주문의 `inputFiles[].role`만 다릅니다
      oneOf:
      - $ref: '#/components/schemas/PublicAntiAiOrderV3Detail'
      - $ref: '#/components/schemas/PublicWatermarkEmbedOrderV3Detail'
      - $ref: '#/components/schemas/PublicWatermarkExtractOrderV3Detail'
      - $ref: '#/components/schemas/PublicAiDetectionOrderV3Detail'
      discriminator:
        propertyName: type
        mapping:
          antiAi: '#/components/schemas/PublicAntiAiOrderV3Detail'
          watermarkEmbed: '#/components/schemas/PublicWatermarkEmbedOrderV3Detail'
          watermarkExtract: '#/components/schemas/PublicWatermarkExtractOrderV3Detail'
          aiDetection: '#/components/schemas/PublicAiDetectionOrderV3Detail'
    PublicOrderV3DetailResponse:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/PublicOrderV3Detail'
    PublicOrderV3DownloadResponse:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        data:
          type: object
          required:
          - archiveUrl
          - files
          - expiresInSeconds
          additionalProperties: false
          properties:
            archiveUrl:
              type: string
              format: uri
              description: 결과 전체를 한 번에 받는 URL. Anti-AI 주문과 v2 워터마크 삽입 주문은 결과 ZIP입니다. v3 워터마크 삽입 주문은 결과 파일이 2개 이상이면 ZIP, 1개면 그 결과 파일 URL(`files[0].downloadUrl`과 같은 파일)입니다
            files:
              type: array
              description: 결과 파일별 다운로드 URL. 주문 상세 `result.outputFiles`와 같은 파일을 같은 순서로 담습니다
              items:
                type: object
                required:
                - fileId
                - downloadUrl
                additionalProperties: false
                properties:
                  fileId:
                    type: string
                    pattern: ^[0-9]+$
                    description: 주문 상세 `result.outputFiles[].fileId`와 같은 값
                  downloadUrl:
                    type: string
                    format: uri
                    description: 결과 파일의 presigned 다운로드 URL
            expiresInSeconds:
              type: integer
              maximum: 3600
              description: URL 유효 시간(초). 기본 3600초이며 `expiresAt`까지 남은 시간이 더 짧으면 그 시간으로 줄입니다
              example: 3600
    OrderReportResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/OrderReportResource'
    OrderReportResource:
      type: object
      required:
      - orderId
      - reportType
      - locale
      - status
      - download
      properties:
        orderId:
          type: string
          description: 주문 ID
        reportType:
          type: string
          enum:
          - watermarkDetection
          - aiDetection
          description: ContentCare가 주문 종류로 결정
        locale:
          type: string
          enum:
          - ko-KR
          - en-US
          - ja-JP
        status:
          type: string
          enum:
          - queued
          - processing
          - completed
          - failed
          description: 보고서 생성 상태
        download:
          nullable: true
          description: 다운로드 정보. `status`가 `completed`일 때만 존재
          allOf:
          - $ref: '#/components/schemas/OrderReportDownload'
        failure:
          nullable: true
          description: 실패 정보. `status`가 `failed`일 때만 존재
          allOf:
          - $ref: '#/components/schemas/OrderReportFailure'
    OrderReportDownload:
      type: object
      required:
      - url
      - expiresInSeconds
      properties:
        url:
          type: string
          format: uri
          description: |
            300초 동안 유효한 PDF 서명 URL. 워터마크 보고서는 `<주문명>-report-<locale>.pdf` 이름으로 저장됩니다(예: `봄 캠페인-report-ko-KR.pdf`).
            URL을 저장하지 말고 새 URL이 필요할 때 보고서 API를 다시 호출하세요.
        expiresInSeconds:
          type: integer
          enum:
          - 300
    OrderReportFailure:
      type: object
      required:
      - code
      - retryable
      properties:
        code:
          type: string
          enum:
          - REPORT_GENERATION_FAILED
          - REPORT_NOT_AVAILABLE
        retryable:
          type: boolean
          description: |
            `true`이면 같은 주문·locale로 `POST /api/v3/orders/{orderId}/reports`를 다시 호출해 새로 생성할 수 있습니다.
            워터마크 보고서는 실패가 3회에 도달하면 `false`입니다.
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_FAILED
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTH_NOT_AUTHENTICATED
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
    UsageLimitExceeded:
      description: 사용량 한도 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: USAGE_LIMIT_EXCEEDED
    InternalError:
      description: 내부 서버 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SERVER_INTERNAL_ERROR
    Forbidden:
      description: API 키가 요청한 모드를 사용할 권한이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTH_FORBIDDEN
    WebhookNotFound:
      description: 웹훅 엔드포인트를 찾을 수 없거나 이 API 키로 접근할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: WEBHOOK_NOT_FOUND

tags:
- name: Anti-AI
  description: AI 학습 방지 이미지 보호 주문
- name: Watermark Embed
  description: 워터마크 삽입 주문
- name: Watermark Extract
  description: 워터마크 추출 주문
- name: AI Detection
  description: AI 생성 이미지 감지 주문
- name: Orders
  description: 주문 조회 및 관리
- name: Webhooks
  description: 웹훅 설정 및 이벤트
- name: Reports
  description: 워터마크 추출·AI Detection 주문의 PDF 분석 보고서
paths:
  /api/v2/orders/anti-ai:
    post:
      summary: Anti-AI 주문 생성
      operationId: createAntiAiOrder
      description: 'Anti-AI 주문을 생성합니다. Anti-AI는 이미지가 AI 학습에 쓰이지 않도록 AI 학습을 방해해 이미지를 보호합니다. AI 생성 이미지 판별(AI Detection)을 피하게 하는 기능이 아닙니다.


        ## 입력 모드 (업로드 / URL / 혼합)

        입력 모드는 각 파일 객체에 `originalFileUrl` 포함 여부로 결정됩니다:

        - **업로드 모드** (`originalFileUrl` 없음): 프리사인드 URL 발급 → 클라이언트가 S3에 업로드 → `/confirm` 호출

        - **URL 모드** (`originalFileUrl` 제공): URL에서 이미지를 다운로드하여 즉시 처리

        - **혼합 모드**: 일부 파일은 업로드 모드, 나머지는 URL 모드로 동시 처리


        ### 동작 방식

        | 조건 | 주문 상태 | Confirm 필요 |

        |------|-----------|-------------|

        | 모든 파일에 `originalFileUrl` 있음 | `inProgress` | 불필요 (즉시 처리) |

        | `originalFileUrl` 없는 파일 포함 | `pending` | 필요 (업로드 후 confirm) |


        ## Zero Copy 모드

        `mode.zeroCopy: true`로 설정하면, 처리 결과가 고객이 제공한 프리사인드 URL로 직접 업로드됩니다. 결과는 지정한 업로드 대상에서 확인하세요. 주문 다운로드 API로 같은 결과를 받을 수 있다고 보장하지 않습니다.

        이 경우 `outputTargets` 배열이 필수이며 `files` 배열과 동일한 길이여야 합니다.

        '
      tags:
      - Anti-AI
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - files
              properties:
                idempotencyKey:
                  type: string
                  description: 중복 요청 방지를 위한 멱등성 키
                orderName:
                  type: string
                  maxLength: 64
                  description: 주문 이름 (미입력 시 자동 생성)
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - fileName
                    properties:
                      fileName:
                        type: string
                        description: 파일 이름 (확장자 포함)
                        example: image.jpg
                      originalFileUrl:
                        type: string
                        format: uri
                        description: '원본 이미지 URL (선택)

                          - 제공 시: URL 모드 (프리사인드 URL 미발급, 즉시 처리)

                          - 미제공 시: 업로드 모드 (프리사인드 URL 발급, confirm 필요)

                          '
                        example: https://example.com/image.jpg
                mode:
                  type: object
                  description: 처리 모드 설정
                  properties:
                    zeroCopy:
                      type: boolean
                      default: false
                      description: Zero Copy 모드 활성화
                outputTargets:
                  type: array
                  description: Zero Copy 모드 결과 업로드 대상 (mode.zeroCopy가 true일 때 필수)
                  items:
                    type: object
                    required:
                    - fileKey
                    - url
                    - presignedUrlExpiresAt
                    properties:
                      fileKey:
                        type: string
                        description: 파일 키 (식별자)
                      url:
                        type: string
                        format: uri
                        description: 결과 업로드를 위한 프리사인드 URL
                      presignedUrlExpiresAt:
                        type: string
                        format: date-time
                        description: 프리사인드 URL 만료 시각 (ISO 8601)
                options:
