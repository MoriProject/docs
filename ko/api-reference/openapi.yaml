  /api/v3/orders/{orderId}/reports:
    post:
      summary: 주문 보고서 생성
      operationId: createOrderReport
      description: |
        주문의 PDF 분석 보고서를 생성합니다. 보고서 종류는 ContentCare가 주문 종류로 정하므로 보내지 않습니다.

        - v3 API로 만든 워터마크 추출 주문 → `watermarkDetection`
        - AI Detection 주문 → `aiDetection`

        이미지 워터마크 보고서는 `ko-KR`, `en-US`, `ja-JP`, PDF 워터마크 보고서는 `ko-KR`만 지원합니다. 같은 주문·locale을 다시 요청하면 기존 보고서를 반환합니다.

        **응답**
        - `202`와 `queued`·`processing`: 생성 중입니다. [`GET /api/v3/orders/{orderId}/reports/{locale}`](/ko/api-reference/reports/get-report)로 조회하세요
        - `200`과 `completed`: 이미 생성된 보고서이며 `download`를 포함합니다
        - `200`과 `failed`: 생성에 실패했고 재시도할 수 없습니다(`failure.retryable`이 `false`)

        **워터마크 보고서 재시도**
        워터마크 보고서가 `failed`이면 같은 주문·locale로 다시 호출할 때 새로 생성합니다(`202`). 시도마다 1크레딧을 예약하며 실패한 시도는 환불되고 성공한 시도만 차감됩니다. 실패가 3회에 도달하면 다시 생성하지 않습니다.

        주문의 보관 기한이 지나면 보고서가 있어도 `400 ORDER_EXPIRED`를 반환합니다.
      tags:
      - Reports
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
        description: 주문 ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum:
                  - ko-KR
                  - en-US
                  - ja-JP
                  default: ko-KR
                  description: 보고서 언어. 기본값 `ko-KR`
            example:
              locale: en-US
      responses:
        '200':
          description: 이미 완료된 보고서, 또는 재시도할 수 없는 실패 보고서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
        '202':
          description: 보고서 요청이 접수되어 `queued` 또는 `processing` 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
        '400':
          description: 잘못된 요청, 주문 종류가 지원하지 않는 locale, 또는 보관 기한이 지난 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                locale:
                  value:
                    code: REPORT_LOCALE_UNSUPPORTED
                expired:
                  value:
                    code: ORDER_EXPIRED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 주문이 없거나 다른 계정의 주문, 또는 완료된 보고서 파일이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order:
                  value:
                    code: ORDER_NOT_FOUND
                report:
                  value:
                    code: REPORT_NOT_FOUND
        '409':
          description: 주문이 완료되지 않았거나 아직 보고서를 만들 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: REPORT_NOT_AVAILABLE
        '429':
          description: 요청 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 보고서 생성을 일시적으로 사용할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
