  /api/v2/orders/{orderId}/download:
    get:
      summary: 다운로드 URL 발급
      operationId: downloadOrderFiles
      deprecated: true
      x-mint:
        href: /ko/api-reference/orders/download-order
      description: |-
        **Deprecated**: 결과 파일별 URL과 결과 전체 URL을 함께 반환하는 [`GET /api/v3/orders/{orderId}/download`](/ko/api-reference/orders/download-order-v3)를 사용하세요. 이 API의 응답과 동작은 바뀌지 않습니다.

        완료된 Anti-AI·워터마크 삽입 주문의 결과 다운로드 URL을 발급합니다. 워터마크 검출과 AI Detection 주문은 받을 결과 파일이 없습니다.

        - `complete` 상태의 주문만 가능합니다
        - 결과 파일은 주문에 고정된 보관 기간(7일 또는 30일, `retentionDays`)이 끝나는 `expiresAt`까지 받을 수 있습니다. 보관 기간은 주문이 완료된 시각부터 셉니다
        - URL 유효 시간은 보관 기간과 별개입니다. Anti-AI 주문과 v2로 만든 워터마크 삽입 주문의 URL은 발급 시점부터 최대 7일(604,800초) 유효하며 `expiresAt`을 넘지 않습니다. v3로 만든 워터마크 삽입 주문의 URL은 남은 기한과 관계없이 300초로 고정 서명합니다. 보관 기한 전에만 발급하지만, `expiresAt` 직전에 발급된 URL은 그 뒤까지 유효할 수 있습니다. 주문이 만료되기 전이면 다시 호출해 새 URL을 받을 수 있습니다
        - Zero Copy(`mode.zeroCopy: true`)로 만든 Anti-AI 주문은 결과를 지정한 업로드 대상에 저장합니다. 이 API로 같은 결과를 받을 수 있다고 보장하지 않습니다

        **오류 검사 순서** (처음 걸린 오류를 반환)
        1. 주문이 없음 → `404 ORDER_NOT_FOUND`
        2. 다른 계정의 주문 → `403 ORDER_NOT_OWNER`. v3 다운로드는 이 경우 `404 ORDER_NOT_FOUND`입니다
        3. 보관 기한을 확인할 수 없음 → `409 FILE_RETENTION_UNKNOWN`. 보관 기한 만료 → `400 ORDER_EXPIRED`
        4. `status`가 `complete`가 아님 → `400 ORDER_NOT_COMPLETED`
        5. 워터마크 검출·AI Detection 주문 → `400 ORDER_TYPE_CANT_DOWNLOAD`
        6. v2로 만든 워터마크 삽입 주문에 결과 기록이 없음 → `404 PROCESSED_FILE_NOT_FOUND`

        만료됐거나 완료되지 않은 워터마크 검출·AI Detection 주문은 3번이나 4번 오류가 먼저 나옵니다. v3 다운로드는 주문 종류를 보관 기한·상태보다 먼저 검사합니다.

        **테스트 키(`sk_test_`)**: 테스트 주문은 결과 파일을 만들지 않으므로 어떤 주문이든 `404 PROCESSED_FILE_NOT_FOUND`를 반환합니다. 영속 테스트 주문이 꺼진 환경에서는 `404 ORDER_NOT_FOUND`입니다. 샘플 결과 URL은 v3 다운로드로 받으세요.
