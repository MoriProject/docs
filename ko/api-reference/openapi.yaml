  /api/v3/orders/wtr-extract:
    post:
      summary: 워터마크 추출 주문 생성
      operationId: createWatermarkV1ExtractOrder
      description: |
        파일 1개에서 비가시성 워터마크를 검사하는 주문을 생성합니다.

        - 요청마다 원본 파일과 검사할 파일을 함께 제출합니다
        - 이미지 원본은 `jpg`, `jpeg`, `png`, `webp`, `bmp`, `tif`, `tiff` 검사 파일을, PDF 원본은 PDF·PNG·JPEG 검사 파일을 받습니다
        - BMP·TIFF의 처리 가능 범위는 워터마크 삽입과 같습니다. 처리할 수 없는 파일은 주문이 `failed`가 아니라 `complete`로 끝나고 `detectionStatus`가 `unsupported`이며 크레딧은 환불됩니다
        - 응답 `files[]`는 2개입니다. `files[0]`은 원본, `files[1]`은 검사 파일이며 각각 `uploadUrl`로 `PUT` 업로드합니다
        - 두 파일 업로드가 끝나면 처리가 자동으로 시작됩니다. 주문당 1크레딧을 사용하며 `unsupported`·`error` 결과는 환불됩니다
        - 결과는 [`GET /api/v3/orders/{orderId}`](/ko/api-reference/orders/get-order-v3)의 `result`에서 확인합니다

        **업로드 헤더**: `uploadUrl`로 PUT할 때 같은 항목의 `uploadHeaders`를 그대로 보냅니다. `Content-Type`이 서명에 포함되어 있어 다른 값을 보내면 스토리지가 403 `SignatureDoesNotMatch`를 반환합니다. 파일은 저장되지 않고 주문과 크레딧도 바뀌지 않습니다. 같은 `uploadUrl`(900초 안) 또는 [`GET /api/v3/orders/{orderId}`](/ko/api-reference/orders/get-order-v3)로 받은 새 `uploadUrl`에 올바른 헤더로 다시 PUT하세요. `byteSize`를 보냈다면 본문 크기도 그 값과 같아야 합니다.

        | 확장자 | Content-Type |
        |---|---|
        | jpg, jpeg | image/jpeg |
        | png | image/png |
        | webp | image/webp |
        | bmp | image/bmp |
        | tif, tiff | image/tiff |
        | pdf | application/pdf |
      tags:
      - Watermark Extract
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - file
              properties:
                idempotencyKey:
                  type: string
                  maxLength: 255
                  description: 멱등성 키. 새 주문마다 새 UUIDv4를 쓰고, 같은 요청을 재시도할 때만 재사용합니다. 같은 키는 기존 주문을 반환하며, 같은
                    키로 다른 요청 본문을 보내면 `409 WATERMARK_V2_CONFLICT`를 반환합니다.
                file:
                  type: object
                  required:
                  - fileName
                  - originalFile
                  description: 검사할 파일
                  properties:
                    fileName:
                      type: string
                      maxLength: 255
                      description: 확장자를 포함한 검사 파일명
                    originalFile:
                      type: object
                      required:
                      - fileName
                      description: 워터마크를 삽입했던 원본 파일
                      properties:
                        fileName:
                          type: string
                          maxLength: 255
            example:
              idempotencyKey: 6c3b9f7e-2d41-4a8e-9b5f-0e1d2c3b4a59
              file:
                fileName: suspect.png
                originalFile:
                  fileName: campaign.png
      responses:
        '200':
          description: 원본 파일과 검사 파일의 업로드 URL과 함께 주문 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatermarkV1OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 같은 `idempotencyKey`로 다른 요청 본문을 보냄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WATERMARK_V2_CONFLICT
        '429':
          description: 요청 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 워터마크 처리를 일시적으로 사용할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WATERMARK_V2_UNAVAILABLE
