    post:
      summary: 웹훅 생성
      operationId: createWebhook
      description: "새 웹훅을 등록합니다. 테스트 API 키에서 `isTest`를 생략하거나 true로 지정하면 같은 owner의 테스트 엔드포인트가 생성되고, `isTest: false`는 `AUTH_FORBIDDEN`을 반환합니다.\n- 여러 웹훅 등록 가능\n- 등록 시 서명 시크릿이 반환됩니다\n\n**중요**: 시크릿은\
        \ 이 응답에서만 확인 가능합니다. 안전하게 보관하세요.\n\n## 웹훅 이벤트 타입\n\n| 이벤트 타입 | 설명 |\n|------------|------|\n\
        | `order.antiAi.completed` | Anti-AI 처리 완료 |\n| `order.antiAi.failed` | Anti-AI\
        \ 처리 실패 |\n| `order.watermarkEmbed.completed` | 워터마크 삽입 완료 |\n| `order.watermarkEmbed.failed`\
        \ | 워터마크 삽입 실패 |\n| `order.watermarkExtract.completed` | 워터마크 추출 완료 |\n| `order.watermarkExtract.failed`\
        \ | 워터마크 추출 실패 |\n\n## 서명 검증\n\n웹훅 요청에는 `X-MoriBiz-Signature` 헤더가 포함됩니다.\n\
        서명은 등록 시 발급된 시크릿으로 HMAC-SHA256을 사용하여 생성됩니다.\n\n```javascript\nconst crypto\
        \ = require('crypto');\nconst signature = crypto.createHmac('sha256', secret)\n\
        \  .update(JSON.stringify(payload))\n  .digest('hex');\n```\n\n## 재시도 정책\n\
        \n- 최대 3회 재시도\n- 지수 백오프 (1초, 2초, 4초)\n- 성공 응답: 2xx 상태 코드\n\n테스트 웹훅 엔드포인트는 `isTest`를 `true`로 지정합니다. 테스트 API 키는 같은 owner의 테스트 엔드포인트만 관리할 수 있습니다.\n"
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '200':
          description: 웹훅 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 웹훅 ID
                      name:
                        type: string
                        description: 웹훅 이름
                      secret:
                        type: string
                        description: '웹훅 서명 시크릿.

                          **주의**: 이 값은 다시 조회할 수 없습니다. 안전하게 보관하세요.

                          '
                      isTest:
                        type: boolean
                        description: 테스트 엔드포인트 여부
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/webhooks \\\n  -H \"Authorization:\
          \ Bearer YOUR_API_TOKEN\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"name\"\
          : \"My Webhook\",\n    \"url\": \"https://example.com/webhook\"\n  }'"
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch('https://api.bizmori.com/api/v2/orders/webhooks', {\n  method:\
          \ 'POST',\n  headers: {\n    'Authorization': 'Bearer YOUR_API_TOKEN',\n    'Content-Type':\
          \ 'application/json'\n  },\n  body: JSON.stringify({\n    name: 'My Webhook',\n    url: 'https://example.com/webhook'\n\
          \  })\n});\nconst data = await response.json();\n// Save data.data.secret securely — it won't\
          \ be shown again"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    'https://api.bizmori.com/api/v2/orders/webhooks',\n\
          \    headers={'Authorization': 'Bearer YOUR_API_TOKEN'},\n    json={\n        'name': 'My Webhook',\n\
          \        'url': 'https://example.com/webhook'\n    }\n)\ndata = response.json()\n# Save data['data']['secret']\
