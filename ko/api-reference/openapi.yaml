openapi: "3.0.0"
info:
  title: BIZ MORI API
  version: 2.0.0
  description: 'BIZ MORI API는 디지털 콘텐츠 보호를 위한 네 가지 핵심 서비스를 제공합니다:

    - **Anti-AI**: 이미지를 AI 학습으로부터 보호

    - **Watermark Embed**: 이미지에 보이지 않는 디지털 워터마크 삽입

    - **Watermark Extract**: 이미지에서 워터마크 추출 및 검증

    - **AI Detection**: 이미지가 AI로 생성되었는지 감지

    - **테스트 API 키**: `sk_test_` 접두사의 키는 동일한 Bearer 인증을 사용하며, 실제 처리 서비스나 크레딧 사용 없이 주문 흐름을 검증할 수 있습니다. 테스트 업로드는 파일 내용을 폐기하고 결과 파일을 만들지 않습니다

    '
  contact:
    name: BIZ MORI 지원
    email: support@bizmori.com
  license:
    name: Proprietary
    url: https://docs.bizmori.com/legal/terms
servers:
- url: https://api.bizmori.com
  description: 프로덕션
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: '외부 클라이언트 접근을 위한 Bearer API 키. 일반 키는 `sk_` 접두사를 사용하고, 테스트 키는 `sk_test_` 접두사로 모의 응답을 사용해 실제 처리나 크레딧 사용 없이 주문 흐름을 검증합니다.'
  schemas:
    BaseResponse:
      type: object
      properties:
        data:
          oneOf:
          - type: object
            nullable: true
            additionalProperties: true
          - type: array
            items: {}
          description: 응답 데이터 (데이터 없을 경우 null)
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: 에러 코드
    PageInfo:
      type: object
      properties:
        totalItems:
          type: integer
          description: 전체 항목 수
        totalPages:
          type: integer
          description: 전체 페이지 수
        currentPage:
          type: integer
          description: 현재 페이지 번호
        itemsPerPage:
          type: integer
          description: 페이지당 항목 수
    OrderOptions:
      type: object
      properties:
        strength:
          type: string
          enum:
          - low
          - standard
          - high
          default: high
          description: '보호 강도 레벨

            * low - 낮은 보호 강도

            * standard - 표준 보호 강도

            * high - 높은 보호 강도

            '
    OrderFile:
      type: object
      properties:
        fileId:
          type: string
          description: 파일 ID
        fileName:
          type: string
          description: 파일 이름
        uploadUrl:
          type: string
          format: uri
          description: '업로드 URL. live 키는 S3 presigned URL을 받고, 테스트 키는 절대 `https://api.bizmori.com/api/v2/test-uploads/{signedToken}` URL을 받습니다. 두 URL은 발급 후 1시간 동안 유효하며 `POST /api/v2/orders/{orderId}/refresh-urls`로 재발급할 수 있습니다. signed token 자체가 테스트 업로드를 인가하므로 PUT에 Authorization 헤더가 필요 없습니다. 테스트 요청 본문은 스트림으로 소비되어 저장되지 않으며, 테스트 주문은 사용량 차감이나 실제 외부 처리 없이 모의 결과로 전이합니다.'
        fileKey:
          type: string
          description: |
            파일 식별자: live 키에서는 S3 object key이고 테스트 키에서는 격리된 logical key입니다.
    AntiAiOrderFile:
      type: object
      description: 'Anti-AI 주문 파일 정보 (파일 모드에 따라 필드가 다름)

        - 업로드 모드: fileId, fileName, uploadUrl, fileKey

        - URL 모드: fileId, fileName, originalFileUrl

        '
      properties:
        fileId:
          type: string
          description: 파일 ID
        fileName:
          type: string
          description: 파일 이름
        uploadUrl:
          type: string
          format: uri
          description: '업로드 URL — 업로드 모드 파일만 해당. live 키는 S3 presigned URL을 받고, 테스트 키는 절대 `https://api.bizmori.com/api/v2/test-uploads/{signedToken}` URL을 받습니다. 두 URL은 1시간 후 만료되며 `POST /api/v2/orders/{orderId}/refresh-urls`로 재발급할 수 있습니다. signed token 자체가 테스트 업로드를 인가하므로 PUT에 Authorization 헤더가 필요 없습니다. 테스트 요청 본문은 스트림으로 소비되어 저장되지 않으며, 테스트 주문은 사용량 차감이나 실제 외부 처리 없이 모의 결과로 전이합니다.'
        fileKey:
          type: string
          description: |
            파일 식별자 — 업로드 모드 파일만 해당: live 키에서는 S3 object key이고 테스트 키에서는 격리된 logical key입니다.
        originalFileUrl:
          type: string
          format: uri
          description: 원본 이미지 URL — URL 모드 파일만 해당
    WtrExtractOrderFile:
      type: object
      description: 워터마크 추출 주문 파일 정보
      properties:
        fileId:
          type: integer
          description: 파일 ID
        fileName:
          type: string
          description: 파일 이름
        uploadUrl:
          type: string
          format: uri
          description: '업로드 URL. live 키는 S3 presigned URL을 받고, 테스트 키는 절대 `https://api.bizmori.com/api/v2/test-uploads/{signedToken}` URL을 받습니다. 두 URL은 1시간 후 만료되며 `POST /api/v2/orders/{orderId}/refresh-urls`로 재발급할 수 있습니다. signed token 자체가 테스트 업로드를 인가하므로 PUT에 Authorization 헤더가 필요 없습니다. 테스트 요청 본문은 스트림으로 소비되어 저장되지 않으며, 테스트 주문은 사용량 차감이나 실제 외부 처리 없이 모의 결과로 전이합니다.'
        fileKey:
          type: string
          description: |
            파일 식별자: live 키에서는 S3 object key이고 테스트 키에서는 격리된 logical key입니다.
        fileFormat:
          type: string
          description: 파일 형식
          example: JPG
        fileType:
          type: string
          enum:
          - IMG
          - DOCUMENT
          description: 파일 타입 (이미지 또는 PDF)
        role:
          type: string
          enum:
          - watermarked
          description: 파일 역할 (항상 "watermarked")
        sequence:
          type: integer
          description: 파일 순서 (항상 1)
          example: 1
        originalFile:
          type: object
          nullable: true
          description: 원본 파일 정보 (includeOriginal이 true일 때만 포함)
          properties:
            fileId:
              type: integer
              description: 파일 ID
            fileName:
              type: string
              description: 파일 이름
            uploadUrl:
              type: string
              format: uri
              description: '업로드 URL. live 키는 S3 presigned URL을 받고, 테스트 키는 절대 `https://api.bizmori.com/api/v2/test-uploads/{signedToken}` URL을 받습니다. 두 URL은 1시간 후 만료되며 `POST /api/v2/orders/{orderId}/refresh-urls`로 재발급할 수 있습니다. signed token 자체가 테스트 업로드를 인가하므로 PUT에 Authorization 헤더가 필요 없습니다. 테스트 요청 본문은 스트림으로 소비되어 저장되지 않으며, 테스트 주문은 사용량 차감이나 실제 외부 처리 없이 모의 결과로 전이합니다.'
            fileKey:
              type: string
              description: |
                파일 식별자: live 키에서는 S3 object key이고 테스트 키에서는 격리된 logical key입니다.
            fileFormat:
              type: string
              description: 파일 형식
            fileType:
              type: string
              enum:
              - IMG
              description: 파일 타입 (이미지만 해당)
            role:
              type: string
              enum:
              - original
              description: 파일 역할 (항상 "original")
            sequence:
              type: integer
              description: 파일 순서 (항상 1)
              example: 1
    Order:
      type: object
      properties:
        orderId:
          type: string
          description: 주문 ID
        orderName:
          type: string
          description: 주문 이름
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 주문 타입
        channel:
          type: string
          enum:
          - api
          - web
          description: 주문 채널
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: '주문 상태

            * pending - 대기 중

            * inProgress - 처리 중

            * complete - 완료

            * failed - 실패

            * expired - 만료됨 (주문 생성 후 7일이 지나면 파일 다운로드 불가)

            '
        fileCount:
          type: integer
          description: 파일 수
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: 썸네일 이미지 URL (프리사인드 URL)
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정일시
        probability:
          type: number
          nullable: true
          description: AI 감지 확률 (aiDetection 주문 전용)
        statusCode:
          type: string
          nullable: true
          enum:
          - likely_real
          - uncertain_real
          - uncertain_ai
          - likely_ai
          description: 'AI 감지 결과 코드 (aiDetection 주문 전용)

            * likely_real - 실제 콘텐츠일 가능성 높음

            * uncertain_real - 불확실, 실제 콘텐츠 쪽에 가까움

            * uncertain_ai - 불확실, AI 생성 쪽에 가까움

            * likely_ai - AI 생성 콘텐츠일 가능성 높음

            '
    OrderDetail:
      type: object
      description: 주문 상세 정보
      properties:
        orderId:
          type: string
          description: 주문 ID
        orderName:
          type: string
          description: 주문 이름
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 주문 타입
        channel:
          type: string
          enum:
          - api
          - web
          description: 주문 채널
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: 주문 상태
        fileCount:
          type: integer
          description: 파일 수
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: 썸네일 이미지 URL (프리사인드 URL, 1시간 유효). aiDetection 주문에서 generateThumbnail 옵션 사용 시에만 반환됩니다.
            만료 상태 시 null.
        originalImageUrl:
          type: string
          format: uri
          nullable: true
          description: 원본 입력 이미지 다운로드 URL (프리사인드 URL, 1시간 유효). aiDetection 주문 전용. 만료 상태 시 null.
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
        errors:
          type: string
          nullable: true
          description: 에러 메시지 (실패 시)
        watermarks:
          type: array
          items:
            type: string
          description: 워터마크 텍스트 목록 (watermarkEmbed 주문 전용)
        watermarkText:
          type: string
          nullable: true
          description: 추출된 워터마크 텍스트 (watermarkExtract 주문 전용)
        probability:
          type: number
          nullable: true
          description: AI 감지 확률 (aiDetection 주문 전용)
        statusCode:
          type: string
          nullable: true
          description: '주문 타입별 상태 코드.

            **watermarkExtract 주문:**

            * detected - 워터마크 검출됨

            * undetected - 워터마크 미검출

            **aiDetection 주문** (probability 기반 자동 계산):

            * likely_real - probability < 0.25

            * uncertain_real - 0.25 <= probability < 0.5

            * uncertain_ai - 0.5 <= probability < 0.75

            * likely_ai - probability >= 0.75

            다른 주문 타입에서는 반환되지 않습니다.

            '
        options:
          type: object
          nullable: true
          description: 주문 생성 시 설정한 옵션 (aiDetection 주문만)
          properties:
            generateHeatmap:
              type: boolean
              description: 히트맵 이미지 생성 여부
              example: true
            generateOverlay:
              type: boolean
              description: 오버레이 이미지 생성 여부
              example: true
            generateThumbnail:
              type: boolean
              description: 썸네일 이미지 생성 여부
              example: true
        heatmapUrl:
          type: string
          format: uri
          nullable: true
          description: AI 판별 히트맵 이미지 다운로드 URL (aiDetection 주문 전용, generateHeatmap 옵션 사용 시 반환)
        overlayUrl:
          type: string
          format: uri
          nullable: true
          description: 원본 위 히트맵 오버레이 이미지 다운로드 URL (aiDetection 주문 전용, generateOverlay 옵션 사용 시 반환)
    UsageStats:
      type: object
      properties:
        dailyStats:
          type: array
          items:
            type: object
            properties:
              usageDate:
                type: string
                description: 사용 날짜 (MM.DD)
              usageCount:
                type: integer
                description: 사용 횟수
        domain:
          type: array
          items:
            type: integer
          description: 차트 Y축 범위 [최솟값, 최댓값]
        ticks:
          type: array
          items:
            type: integer
          description: 차트 Y축 눈금 값
    WebhookRegisterRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: 웹훅 엔드포인트 URL
          example: https://example.com/webhook
        isTest:
          type: boolean
          description: '엔드포인트 모드. 테스트 API 키는 생략하거나 true를 사용하며 true로 강제됩니다. false는 AUTH_FORBIDDEN을 반환합니다. live API 키는 두 모드를 선택할 수 있습니다.'
    WebhookInfo:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: 등록된 웹훅 URL
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: 생성 시각
    WebhookCreateRequest:
      type: object
      required:
      - url
      properties:
        name:
          type: string
          maxLength: 100
          description: 웹훅 이름 (식별용)
        url:
          type: string
          format: uri
          description: 웹훅 엔드포인트 URL
          example: https://example.com/webhook
        isTest:
          type: boolean
          description: '엔드포인트 모드. 테스트 API 키에서는 생략하거나 true를 사용하며 false는 AUTH_FORBIDDEN을 반환합니다. live API 키는 두 모드를 선택할 수 있습니다.'
    WebhookUpdateRequest:
      type: object
      required:
      - url
      properties:
        name:
          type: string
          maxLength: 100
          description: 웹훅 이름
        url:
          type: string
          format: uri
          description: 웹훅 URL
          example: https://example.com/webhook
        isTest:
          type: boolean
          description: '엔드포인트 모드. 테스트 API 키에서는 생략 시 테스트 모드를 유지하고 true는 허용되며 false는 AUTH_FORBIDDEN을 반환합니다. live API 키는 두 모드를 선택할 수 있습니다.'
    WebhookListItem:
      type: object
      properties:
        id:
          type: integer
          description: 웹훅 ID
        name:
          type: string
          description: 웹훅 이름
        url:
          type: string
          format: uri
          description: 웹훅 URL
        isActive:
          type: boolean
          description: 활성화 상태
        isTest:
          type: boolean
          description: 테스트 엔드포인트 여부
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 전송 시각
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
    WebhookDetail:
      type: object
      properties:
        id:
          type: integer
          description: 웹훅 ID
        name:
          type: string
          description: 웹훅 이름
        url:
          type: string
          format: uri
          description: 웹훅 URL
        secret:
          type: string
          description: 웹훅 서명 시크릿
        isActive:
          type: boolean
          description: 활성화 상태
        isTest:
          type: boolean
          description: 테스트 엔드포인트 여부
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
    WebhookEvent:
      type: object
      properties:
        id:
          type: integer
          description: 이벤트 DB ID
        eventId:
          type: string
          format: uuid
          description: 이벤트 UUID
        eventType:
          type: string
          description: 이벤트 타입
          example: order.antiAi.completed
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - RETRYING
          - FAILED
          description: 전송 상태
        retries:
          type: integer
          description: 재시도 횟수
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 전송 시각
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
    WebhookPagination:
      type: object
      properties:
        page:
          type: integer
          description: 현재 페이지
        limit:
          type: integer
          description: 페이지당 항목 수
        total:
          type: integer
          description: 전체 항목 수
        totalPages:
          type: integer
          description: 전체 페이지 수
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_FAILED
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTH_NOT_AUTHENTICATED
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
    UsageLimitExceeded:
      description: 사용량 한도 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
