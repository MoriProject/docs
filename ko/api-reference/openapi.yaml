        이미지 URL을 직접 제공하여 처리합니다.

        - 프리사인드 URL 발급 없이 즉시 처리 시작

        - 제공된 URL에서 이미지를 다운로드하여 처리


        ## Zero Copy 모드

        `mode.zeroCopy: true`로 설정하면, 처리 결과가 고객이 제공한 프리사인드 URL로 직접 업로드됩니다.

        '
