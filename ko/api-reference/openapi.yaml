  /api/v2/orders/ai-detection:
    post:
      summary: AI Detection 주문 생성
      operationId: createAiDetectionOrder
      description: 'AI Detection 주문을 생성하고 이미지 업로드 URL을 발급합니다. live 키는 S3 presigned URL을 받고, 테스트 키는 절대 BIZ MORI test-upload URL을 받습니다.


        ## 처리 흐름


        1. 이 엔드포인트를 호출하여 업로드 URL을 발급받습니다

        2. live S3 URL 또는 테스트 BIZ MORI URL로 이미지를 업로드합니다

        3. `POST /api/v2/orders/ai-detection/confirm` 을 호출하여 비동기 감지를 시작합니다

        4. 웹훅 또는 주문 상세 조회 엔드포인트를 통해 결과를 확인합니다


        ## 주문 상태


        | 상태 | 설명 |

        |------|------|

        | `pending` | 파일 업로드 대기 중 |

        | `inProgress` | 감지 처리 중 |

        | `complete` | 감지 완료, 결과 확인 가능 |

        | `failed` | 감지 실패 |


        ## 지원 파일 형식


        jpg, jpeg, png, webp, bmp, tiff

        '
      tags:
      - AI Detection
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - fileName
              properties:
                idempotencyKey:
                  type: string
                  description: 중복 요청 방지를 위한 멱등성 키
                  example: 0e6c4a9b-b1d8-457e-a9fc-4b7d0e3a6c59
                orderName:
                  type: string
                  maxLength: 64
                  description: 주문명 (선택 사항, 미입력 시 자동 생성)
                  example: my-detection-order
                fileName:
                  type: string
                  description: '이미지 파일명 (확장자 포함). 지원 형식: jpg, jpeg, png, webp, bmp, tiff'
                  example: photo.jpg
                options:
                  type: object
                  description: 출력 옵션 (선택사항). 생성된 파일은 주문 상세 조회 응답에 포함됩니다.
                  properties:
                    generateHeatmap:
                      type: boolean
                      default: false
                      description: AI 판별 히트맵 이미지 생성 여부
                    generateOverlay:
                      type: boolean
                      default: false
                      description: 원본 위 히트맵 오버레이 이미지 생성 여부
                    generateThumbnail:
                      type: boolean
                      default: false
                      description: 썸네일 이미지 생성 여부
      responses:
        '200':
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                        description: 주문 ID
                      orderName:
                        type: string
                        description: 주문명
                      status:
                        type: string
                        enum:
                        - pending
                        description: 주문 상태
                      file:
                        type: object
                        properties:
                          fileId:
                            type: integer
                            description: 파일 레코드 ID
                          fileName:
                            type: string
                            description: 파일명
                          uploadUrl:
                            type: string
                            format: uri
                            description: '업로드 URL. live 키는 S3 presigned URL을 받고, 테스트 키는 절대 `https://api.bizmori.com/api/v2/test-uploads/{signedToken}` URL을 받습니다. 두 URL은 1시간 후 만료됩니다. signed token 자체가 테스트 업로드를 인가하므로 PUT에 Authorization 헤더가 필요 없습니다. 테스트 요청 본문은 스트림으로 소비되어 저장되지 않으며, 테스트 주문은 사용량 차감이나 실제 외부 처리 없이 모의 결과로 전이합니다.'
                          fileKey:
                            type: string
                            description: |
                              파일 식별자: live 키에서는 S3 object key이고 테스트 키에서는 격리된 logical key입니다.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/UsageLimitExceeded'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/ai-detection\
          \ \\\n  -H \"Authorization: Bearer YOUR_API_TOKEN\" \\\n  -H \"Content-Type:\
          \ application/json\" \\\n  -d '{\"idempotencyKey\": \"0e6c4a9b-b1d8-457e-a9fc-4b7d0e3a6c59\", \"fileName\"\
          : \"photo.jpg\"}'"
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch('https://api.bizmori.com/api/v2/orders/ai-detection',\
          \ {\n  method: 'POST',\n  headers: {\n    'Authorization': 'Bearer YOUR_API_TOKEN',\n\
          \    'Content-Type': 'application/json'\n  },\n  body: JSON.stringify({\n\
          \    idempotencyKey: '0e6c4a9b-b1d8-457e-a9fc-4b7d0e3a6c59',\n    fileName: 'photo.jpg'\n  })\n});\n\
          const data = await response.json();"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    'https://api.bizmori.com/api/v2/orders/ai-detection',\n\
          \    headers={'Authorization': 'Bearer YOUR_API_TOKEN'},\n    json={'idempotencyKey':\
          \ '0e6c4a9b-b1d8-457e-a9fc-4b7d0e3a6c59', 'fileName': 'photo.jpg'}\n)\ndata = response.json()"
  /api/v2/orders/ai-detection/confirm:
    post:
      summary: AI Detection 주문 확인
      operationId: confirmAiDetectionOrder
      description: '이미지 업로드가 완료되었음을 확인하고 처리를 시작합니다.


        주문 생성 엔드포인트에서 받은 업로드 URL로 이미지를 업로드한 후 이 엔드포인트를 호출하세요.
        주문 상태가 `pending`에서 `inProgress`로 변경됩니다.


        감지 결과는 웹훅(`order.aiDetection.completed` 또는 `order.aiDetection.failed`)으로 전달되거나, [주문 상세 조회](/ko/api-reference/orders/get-order)
        엔드포인트를 폴링하여 확인할 수 있습니다.


        동일한 `idempotencyKey`로 재요청 시 현재 주문 상태를 반환합니다. (중복 처리 방지)

        '
      tags:
      - AI Detection
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - orderId
              properties:
                idempotencyKey:
                  type: string
                  description: 중복 요청 방지를 위한 멱등성 키. 동일한 키로 재요청 시 재처리 없이 현재 주문 상태를
                    반환합니다.
                  example: c6d4e2f1-3a5b-4c78-9d0e-6f2a1b8c4d95
                orderId:
                  type: string
                  description: 주문 ID
      responses:
        '200':
          description: 처리 시작됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                        description: 주문 ID
                      status:
                        type: string
                        enum:
                        - inProgress
                        description: 주문 상태
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
