  /api/v3/orders/{orderId}/download:
    get:
      summary: 주문 결과 다운로드 URL 발급
      operationId: downloadOrderV3
      description: |
        완료된 Anti-AI·워터마크 삽입 주문의 결과 파일별 다운로드 URL과 결과 전체를 받는 URL을 한 번에 발급합니다. 워터마크 주문을 v2·v3 어느 쪽으로 만들었든 응답 형식은 같습니다.

        - `files[]`: 결과 파일별 `{ fileId, downloadUrl }`. [`GET /api/v3/orders/{orderId}`](/ko/api-reference/orders/get-order-v3)의 `result.outputFiles[]`와 같은 파일을 같은 순서로 담고 `fileId`도 같습니다
        - `archiveUrl`: 이 URL 하나로 결과 전체를 받습니다. 항상 문자열입니다
          - Anti-AI 주문, v2로 만든 워터마크 삽입 주문: 결과 ZIP
          - v3로 만든 워터마크 삽입 주문: 결과 파일이 2개 이상이면 ZIP, 1개면 그 결과 파일 URL(`files[0].downloadUrl`과 같은 파일)
        - `expiresInSeconds`: URL 유효 시간. 기본 3600초(1시간)이며, 보관 기한(`expiresAt`)까지 남은 시간이 더 짧으면 그 시간으로 줄입니다. URL 유효 시간은 주문에 고정된 보관 기간(7일 또는 30일)과 별개입니다. 새 URL이 필요하면 `expiresAt` 전까지 다시 호출하세요
        - Zero Copy(`mode.zeroCopy: true`)로 만든 Anti-AI 주문은 결과를 지정한 업로드 대상(`outputTargets`)에 저장합니다. 이 API가 발급하는 URL로 같은 결과를 받을 수 있다고 보장하지 않습니다
        - 결과 기록이 없는 완료 주문은 `404 PROCESSED_FILE_NOT_FOUND`입니다

        **오류 검사 순서** (처음 걸린 오류를 반환)
        1. 주문이 없거나 다른 계정의 주문 → `404 ORDER_NOT_FOUND`
        2. 워터마크 검출·AI Detection 주문 → `400 ORDER_TYPE_CANT_DOWNLOAD`. 보관 기한이 지났어도 이 오류입니다
        3. 보관 기한 만료 → `400 ORDER_EXPIRED`. 보관 기한을 확인할 수 없으면 `409 FILE_RETENTION_UNKNOWN`
        4. `status`가 `complete`가 아님(`pending`·`inProgress`·`failed`) → `400 ORDER_NOT_COMPLETED`

        **이전 v3 응답과의 차이(breaking change, 2026-10-08)**: 응답이 `{ downloadUrl, expiresInSeconds: 300 }`에서 `{ archiveUrl, files, expiresInSeconds }`로 바뀌었고, Anti-AI 주문과 v2로 만든 워터마크 삽입 주문도 지원합니다. URL 유효 시간은 300초에서 최대 3600초로 늘었습니다. 미완료 주문은 `VALIDATION_FAILED` 대신 `ORDER_NOT_COMPLETED`를, 검출 주문은 `ORDER_TYPE_CANT_DOWNLOAD`를 반환합니다. 결과 파일 하나를 받는 `GET /api/v3/orders/{orderId}/files/{fileId}/download`는 삭제되었습니다. `files[]`를 사용하세요.

        **테스트 키(`sk_test_`)**: 키가 속한 계정이 소유한 완료된 Anti-AI·워터마크 삽입 테스트 주문(v2·v3)에서 동작합니다. URL은 처리 결과가 아니라 `https://api.bizmori.com/api/v2/test-samples/{signedToken}`에서 제공하는 샘플 파일을 가리킵니다. 결과 파일이 없는 Anti-AI 테스트 주문은 `files: []`와 샘플 ZIP `archiveUrl`을 반환합니다. 결과가 1개인 v3 삽입 테스트 주문은 그 샘플 파일을, 그 외 테스트 주문은 샘플 ZIP을 `archiveUrl`로 반환합니다. `expiresInSeconds`, 오류 코드, 검사 순서는 운영 주문과 같습니다.
      tags:
      - Orders
      security:
      - BearerAuth: []
      parameters: *id001
      responses:
        '200':
          description: 결과 파일별 URL과 결과 전체 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrderV3DownloadResponse'
              examples:
                antiAi:
                  summary: Anti-AI (결과 2개, `archiveUrl`은 ZIP)
                  value:
                    data:
                      archiveUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/zip/1001/archive.zip?X-Amz-...
                      files:
                      - fileId: '21'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/cat.png?X-Amz-...
                      - fileId: '22'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/dog.png?X-Amz-...
                      expiresInSeconds: 3600
                watermarkEmbedV3Multiple:
                  summary: 워터마크 삽입(v3) (결과 2개, `archiveUrl`은 ZIP)
                  value:
                    data:
                      archiveUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/archive/2001.zip?X-Amz-...
                      files:
                      - fileId: '201'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/logo-1.png?X-Amz-...
                      - fileId: '202'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/logo-2.png?X-Amz-...
                      expiresInSeconds: 3600
                watermarkEmbedV3Single:
                  summary: 워터마크 삽입(v3) (결과 1개, `archiveUrl`은 결과 파일 URL)
                  value:
                    data:
                      archiveUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/logo.png?X-Amz-...
                      files:
                      - fileId: '201'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/logo.png?X-Amz-...
                      expiresInSeconds: 3600
                watermarkEmbedV2:
                  summary: 워터마크 삽입(v2) (결과 2개, `expiresAt`까지 20분 남아 URL 유효 시간 단축)
                  value:
                    data:
                      archiveUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/zip/2101.zip?X-Amz-...
                      files:
                      - fileId: '41'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/a.png?X-Amz-...
                      - fileId: '42'
                        downloadUrl: https://bucket.s3.ap-northeast-2.amazonaws.com/out/b.png?X-Amz-...
                      expiresInSeconds: 1200
        '400':
          description: 요청 형식 오류, 다운로드할 수 없는 주문 종류, 보관 기한 만료, 미완료 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: '`orderId` 형식 오류'
                  value:
                    code: VALIDATION_FAILED
                typeCantDownload:
                  summary: 워터마크 검출·AI Detection 주문
                  value:
