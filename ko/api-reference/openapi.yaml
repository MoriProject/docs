  /api/v2/orders/wtr-embed:
    post:
      summary: 워터마크 삽입 주문 생성
      operationId: createWatermarkEmbedOrder
      description: '워터마크 삽입 주문을 생성합니다.

        - 이미지당 최대 10개의 워터마크 텍스트

        - 주문당 최대 100개의 파일

        - 지원 이미지 형식 (IMG): jpg, jpeg, png, webp, bmp, tiff

        - 지원 문서 형식 (DOCUMENT): pdf


        ## 입력 모드 (업로드 / URL / 혼합)

        입력 모드는 각 파일 객체의 `originalFileUrl` 존재 여부에 따라 결정됩니다:

        - **업로드 모드** (`originalFileUrl` 없음): Presigned URL 발급 → 클라이언트가 S3에 업로드 → 처리 자동 시작

        - **URL 모드** (`originalFileUrl` 제공): 해당 URL에서 이미지를 다운로드하여 즉시 처리

        - **혼합 모드**: 일부 파일은 업로드 모드, 나머지는 URL 모드로 동시 처리


        ### 동작 방식

        | 조건 | 주문 상태 | Confirm 필요 여부 |

        |------|---------|-----------------|

        | 모든 파일에 `originalFileUrl` 있음 | `pending` | 불필요 (서버 다운로드 후 자동 시작) |

        | `originalFileUrl` 없는 파일 존재 | `pending` | 불필요 (업로드 후 자동 시작) |


        <Note>Anti-AI, AI Detection과 달리 Watermark Embed는 별도의 confirm 단계가 필요하지 않습니다. 파일 업로드가 완료되면 처리가 자동으로
        시작됩니다.</Note>

        '
      tags:
      - Watermark Embed
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - files
              properties:
                idempotencyKey:
                  type: string
                  description: 멱등성 키
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - fileName
                    - watermarks
                    properties:
                      fileName:
                        type: string
                        description: 파일 이름
                        example: image.jpg
                      originalFileUrl:
                        type: string
                        format: uri
                        description: '원본 이미지 URL (선택)

                          - 제공 시: URL 모드 (presigned URL 미발급, 즉시 처리)

                          - 미제공 시: 업로드 모드 (presigned URL 발급)

                          '
                        example: https://example.com/image.jpg
                      watermarks:
                        type: array
                        minItems: 1
                        maxItems: 10
                        items:
                          type: object
                          required:
                          - text
                          properties:
                            text:
                              type: string
                              maxLength: 1000
                              description: 워터마크 텍스트
            examples:
              uploadMode:
                summary: 업로드 모드 (기본)
                value:
                  idempotencyKey: 5e9c7a3b-b4d2-4f18-83e6-8b1a2d5f7c93
                  files:
                  - fileName: image1.jpg
                    watermarks:
                    - text: MORI_WATERMARK
                  - fileName: image2.png
                    watermarks:
                    - text: MORI_WATERMARK
              urlMode:
                summary: URL 모드 (즉시 처리)
                value:
                  idempotencyKey: 6f1d8b4c-c5e3-4029-94f7-9c2b3e6a8d04
                  files:
                  - fileName: image1.jpg
                    originalFileUrl: https://example.com/image1.jpg
                    watermarks:
                    - text: MORI_WATERMARK
                  - fileName: image2.png
                    originalFileUrl: https://example.com/image2.png
                    watermarks:
                    - text: MORI_WATERMARK
              mixedMode:
                summary: 혼합 모드
                value:
                  idempotencyKey: 7a2e9c5d-d6f4-413a-a5b8-0d3c4f7b9e15
                  files:
                  - fileName: upload-file.jpg
                    watermarks:
                    - text: MORI_WATERMARK
                  - fileName: url-file.png
                    originalFileUrl: https://example.com/image.png
                    watermarks:
                    - text: MORI_WATERMARK
      responses:
        '200':
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderName:
                        type: string
                      orderId:
                        type: string
                      status:
                        type: string
                        enum:
                        - pending
                        description: '주문 상태

