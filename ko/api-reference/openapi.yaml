        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 주문이 없거나 다른 계정의 주문(`ORDER_NOT_FOUND`), 또는 완료 주문의 결과 기록이 없음(`PROCESSED_FILE_NOT_FOUND`)
          content:
