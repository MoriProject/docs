  /api/v2/orders/{orderId}/refresh-urls:
    post:
      summary: 업로드 URL 재발급
      operationId: refreshOrderUrls
      description: |
        주문 입력 파일의 업로드 URL을 다시 발급합니다.

        - live 키: `pending` 또는 `inProgress` 상태의 주문에서 사용할 수 있습니다. `uploadUrl`로 올리는 입력 파일마다 이미 업로드했는지와 관계없이 1시간 동안 유효한 새 S3 presigned PUT URL을 발급합니다. 외부 URL로 지정한 파일은 포함하지 않습니다.
        - 테스트 키: `pending` 주문에서, 아직 업로드하지 않은 파일에 대해서만 사용할 수 있습니다. 각 파일은 S3 presigned URL이 아닌 ContentCare 테스트 업로드 URL(`https://api.bizmori.com/api/v2/test-uploads/{signedToken}`)을 받으며, 이 URL은 1시간 동안 유효합니다.
        - 호출할 때마다 새 URL에 서명합니다. 이전에 발급한 URL은 무효화되지 않으며 만료될 때까지 유효합니다.
        - live 워터마크 검출 주문의 응답에는 `files` 대신 `originalFiles`와 `watermarkedFile`이 담깁니다.
      tags:
      - Orders
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
        description: 주문 ID
      responses:
        '200':
          description: 업로드 URL 재발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderFile'
        '400':
          description: '주문 상태가 재발급을 허용하지 않거나(`ORDER_STATUS_INVALID`), 주문 파일 보관 기한이 지났거나(`ORDER_EXPIRED`), live 키 주문의 입력이 모두 외부 URL입니다(`VALIDATION_FAILED`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                orderStatusInvalid:
                  value:
                    code: ORDER_STATUS_INVALID
                orderExpired:
                  value:
                    code: ORDER_EXPIRED
                validationFailed:
                  value:
                    code: VALIDATION_FAILED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 다른 계정의 주문입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ORDER_NOT_OWNER
        '404':
          description: '주문이 없거나(`ORDER_NOT_FOUND`), 재발급할 입력 파일이 없습니다(`ORDER_FILE_NOT_FOUND`). 테스트 키에서는 업로드를 기다리는 파일이 남아 있지 않다는 뜻입니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                orderNotFound:
                  value:
                    code: ORDER_NOT_FOUND
                orderFileNotFound:
                  value:
                    code: ORDER_FILE_NOT_FOUND
        '409':
          description: 주문 파일 보관 기한을 확인할 수 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: FILE_RETENTION_UNKNOWN
        '410':
          description: '지원이 끝난 옛 이미지 전용 워터마크 검출 주문은 입력 저장소가 없어 업로드 URL을 다시 발급할 수 없습니다. `POST /api/v3/orders/wtr-extract`로 새 검출 주문을 만드세요.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WATERMARK_V2_API_SUNSET
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/ORDER_ID/refresh-urls \\\n  -H \"\
          Authorization: Bearer YOUR_API_TOKEN\""
      - lang: javascript
