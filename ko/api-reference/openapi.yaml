  /api/v3/orders/{orderId}/reports/{locale}:
    get:
      summary: 주문 보고서 조회
      operationId: getOrderReport
      description: |
        보고서 상태와, `completed`일 때 다운로드 URL을 조회합니다. 생성 요청이 없던 locale은 `404 REPORT_NOT_FOUND`입니다.

        `download.url`은 호출할 때마다 새로 서명되며 300초 뒤 만료됩니다. 만료된 URL은 저장소가 `403`을 반환하며 갱신할 수 없습니다. URL을 저장하지 말고, 사용자가 다운로드를 누를 때 이 API를 호출해 받은 URL로 바로 이동하세요.

        주문의 보관 기한이 지나면 보고서 상태와 관계없이 `400 ORDER_EXPIRED`를 반환합니다.
      tags:
      - Reports
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,20}$
        description: 주문 ID
      - in: path
        name: locale
        required: true
        schema:
          type: string
          enum:
          - ko-KR
          - en-US
          - ja-JP
        description: 보고서 언어
      responses:
        '200':
          description: '`queued`·`processing`·`completed`·`failed` 상태의 보고서. `download`는 `completed`에서만 존재'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
              example:
                data:
                  orderId: '1234567891'
                  reportType: watermarkDetection
                  locale: en-US
                  status: completed
                  download:
                    url: https://s3.ap-northeast-2.amazonaws.com/...
                    expiresInSeconds: 300
                  failure: null
        '400':
          description: 잘못된 요청, 주문 종류가 지원하지 않는 locale, 또는 보관 기한이 지난 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                locale:
                  value:
                    code: REPORT_LOCALE_UNSUPPORTED
                expired:
                  value:
                    code: ORDER_EXPIRED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 주문이 없거나, 이 locale로 요청한 보고서가 없거나, 완료된 보고서 파일이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order:
                  value:
                    code: ORDER_NOT_FOUND
                report:
                  value:
                    code: REPORT_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 보고서 생성을 일시적으로 사용할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
      x-codeSamples:
      - lang: curl
        label: cURL
        source: |
          curl -X GET https://api.bizmori.com/api/v3/orders/ORDER_ID/reports/en-US \
            -H "Authorization: Bearer YOUR_API_KEY"
      - lang: javascript
        label: JavaScript
        source: |
          const orderId = 'ORDER_ID';
          const locale = 'en-US';
          const response = await fetch(`https://api.bizmori.com/api/v3/orders/${orderId}/reports/${locale}`, {
