    post:
      summary: 웹훅 이벤트 재전송
      operationId: retryWebhookEvent
      description: '실패한 단일 웹훅 이벤트를 수동으로 재전송합니다. 테스트 API 키는 같은 owner의 테스트 엔드포인트 이벤트만 재전송할 수 있습니다. 접근 불가 엔드포인트는 `WEBHOOK_NOT_FOUND`, 접근 가능한 엔드포인트 밖의 이벤트는 `WEBHOOK_EVENT_NOT_FOUND`를 반환합니다.

        - `FAILED` 상태의 이벤트만 재전송할 수 있습니다

        - 성공 시 이벤트 상태가 `SENT`로 변경됩니다

        - 재전송 실패 시 이벤트는 `FAILED` 상태를 유지하며, 30분 후 스케줄러 기반 재시도가 등록됩니다

        - 테스트 API 키는 같은 owner의 테스트 엔드포인트만 관리할 수 있습니다

        '
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          type: integer
        description: 웹훅 ID
      - in: path
        name: eventId
        required: true
        schema:
          type: integer
        description: 웹훅 이벤트 ID
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
                        description: 원본 이벤트 UUID
                      success:
                        type: boolean
                        description: 재전송 성공 여부
                      status_code:
                        type: integer
                        description: 웹훅 엔드포인트의 HTTP 응답 코드 (성공 시)
                      status:
                        type: string
                        description: 이벤트 상태 (재전송 실패 시)
                        example: FAILED
                      error:
                        type: string
                        description: 오류 메시지 (재전송 실패 시)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 웹훅 엔드포인트 또는 이벤트를 찾을 수 없거나 이 API 키로 접근할 수 없음
