                    - text: MORI_WATERMARK
                  - fileName: url-file.png
                    originalFileUrl: https://example.com/image.png
                    watermarks:
                    - text: MORI_WATERMARK
      responses:
        '200':
          description: 注文が正常に作成されました
          headers:
            Deprecation:
              description: 非推奨（deprecated）の API であることを示します
              schema:
                type: string
                example: 'true'
            Sunset:
              description: サポート終了日時（RFC 8594 HTTP-date、2026 年 10 月 9 日 09:00 KST）
              schema:
                type: string
                example: 'Fri, 09 Oct 2026 00:00:00 GMT'
            Link:
              description: 後継の v3 API のパス
              schema:
                type: string
                example: '</api/v3/orders/wtr-embed>; rel="successor-version"'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderName:
                        type: string
                      orderId:
                        type: string
                      status:
                        type: string
                        enum:
                        - pending
                        description: '注文ステータス

                          - `pending`: 入力モードに関わらず常に返却'
                      files:
                        type: array
                        items:
                          type: object
                          description: 'ファイル情報（モードによってフィールドが異なります）

                            - アップロードモード: fileId, fileName, uploadUrl, fileKey, fileFormat, fileType

                            - URLモード: fileId, fileName, originalFileUrl, fileKey, fileFormat, fileType'
