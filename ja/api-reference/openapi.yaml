  /api/v2/orders:
    get:
      summary: 注文一覧を取得
      description: 'ページネーション付きで注文を取得します。

        - ステータス、タイプ、チャネルでフィルタリング

        - キーワード検索に対応

        - 最新順にソート'
      tags:
      - Orders
