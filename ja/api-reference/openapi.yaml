  /api/v3/orders/wtr-extract:
    post:
      summary: watermark 抽出注文を作成
      operationId: createWatermarkV1ExtractOrder
      description: |
        1 つのファイルから不可視 watermark を検査する注文を作成します。

        - リクエストごとに元ファイルと検査するファイルを一緒に提出します
        - 画像の元ファイルには `jpg`, `jpeg`, `png`, `webp`, `bmp`, `tif`, `tiff` の検査ファイル、PDF の元ファイルには PDF・PNG・JPEG の検査ファイルを指定できます
        - BMP・TIFF の処理可能な範囲は watermark の埋め込みと同じです。処理できないファイルは注文が `failed` ではなく `complete` で終わり、`detectionStatus` が `unsupported` になり、クレジットは返金されます
        - レスポンスの `files[]` は 2 件です。`files[0]` が元ファイル、`files[1]` が検査ファイルで、それぞれ `uploadUrl` へ `PUT` でアップロードします
        - 2 つのファイルのアップロードが終わると処理が自動で始まります。注文あたり 1 クレジットを使用し、`unsupported`・`error` の結果は返金されます
        - 結果は [`GET /api/v3/orders/{orderId}`](/ja/api-reference/orders/get-order-v3) の `result` で確認します
      tags:
      - Watermark Extract
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - file
              properties:
                idempotencyKey:
                  type: string
                  maxLength: 255
                  description: 冪等性キー。新しい注文ごとに新しい UUIDv4 を使い、同じリクエストを再試行するときだけ再利用します。同じキーは既存の注文を返し、同じキーで異なるリクエストボディを送ると
                    `409 WATERMARK_V2_CONFLICT` を返します。
                file:
                  type: object
                  required:
                  - fileName
                  - originalFile
                  description: 検査するファイル
                  properties:
                    fileName:
                      type: string
                      maxLength: 255
                      description: 拡張子を含む検査ファイル名
                    originalFile:
                      type: object
                      required:
                      - fileName
                      description: watermark を埋め込んだ元ファイル
                      properties:
                        fileName:
                          type: string
                          maxLength: 255
            example:
              idempotencyKey: 6c3b9f7e-2d41-4a8e-9b5f-0e1d2c3b4a59
              file:
                fileName: suspect.png
                originalFile:
                  fileName: campaign.png
      responses:
        '200':
          description: 元ファイルと検査ファイルのアップロード URL とともに注文を作成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatermarkV1OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 同じ `idempotencyKey` で異なるリクエストボディを送信
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WATERMARK_V2_CONFLICT
        '429':
          description: リクエスト回数の超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: watermark 処理を一時的に利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WATERMARK_V2_UNAVAILABLE
      x-codeSamples:
      - lang: curl
        label: cURL
        source: |
          curl -X POST https://api.bizmori.com/api/v3/orders/wtr-extract \
            -H "Authorization: Bearer YOUR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
            "idempotencyKey": "6c3b9f7e-2d41-4a8e-9b5f-0e1d2c3b4a59",
            "file": {
