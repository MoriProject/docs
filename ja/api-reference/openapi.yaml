openapi: 3.0.0
info:
  title: BIZ MORI API
  version: 2.0.0
  description: 'BIZ MORI API は、デジタルコンテンツ保護のための4つのコアサービスを提供します:

    - **Anti-AI**: 画像をAI学習から保護

    - **Watermark Embed**: 画像に不可視のデジタル watermark を埋め込み

    - **Watermark Extract**: 画像から watermark を抽出・検証

    - **AI Detection**: 画像がAI生成かどうかを検知

    - **テストAPIキー**: `sk_test_` プレフィックスのキーは同じBearer認証を使用しますが、実際の処理サービスの実行やクレジットの消費なしに、統合テスト用のモックレスポンスを返します'
  contact:
    name: BIZ MORI サポート
    email: support@bizmori.com
servers:
- url: https://api.bizmori.com
  description: 本番環境
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 外部クライアントアクセス用のBearer APIキー。本番キーは `sk_` プレフィックスを使用し、テストキーは `sk_test_` プレフィックスを使用して、処理やクレジット消費なしにモックレスポンスを返します。
  schemas:
    BaseResponse:
      type: object
      properties:
        data:
          nullable: true
          description: レスポンスデータ（データがない場合はnull）
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: エラーコード
    PageInfo:
      type: object
      properties:
        totalItems:
          type: integer
          description: 総項目数
        totalPages:
          type: integer
          description: 総ページ数
        currentPage:
          type: integer
          description: 現在のページ番号
        itemsPerPage:
          type: integer
          description: ページあたりの項目数
    OrderOptions:
      type: object
      properties:
        strength:
          type: string
          enum:
          - low
          - standard
          - high
          default: high
          description: '保護強度レベル

            * low - 低い保護強度

            * standard - 標準の保護強度

            * high - 高い保護強度'
    OrderFile:
      type: object
      properties:
        fileId:
          type: string
          description: ファイルID
        fileName:
          type: string
          description: ファイル名
        uploadUrl:
          type: string
          format: uri
          description: アップロードURL（プリサインドURL）
        fileKey:
          type: string
          description: S3ファイルキー
    AntiAiOrderFile:
      type: object
      description: 'Anti-AI 注文ファイル情報（ファイルモードによってフィールドが異なります）

        - アップロードモード: fileId, fileName, uploadUrl, fileKey

        - URLモード: fileId, fileName, originalFileUrl'
      properties:
        fileId:
          type: string
          description: ファイルID
        fileName:
          type: string
          description: ファイル名
        uploadUrl:
          type: string
          format: uri
          description: アップロードURL（プリサインドURL）— アップロードモードのファイルのみ
        fileKey:
          type: string
          description: S3ファイルキー — アップロードモードのファイルのみ
        originalFileUrl:
          type: string
          format: uri
          description: 元画像URL — URLモードのファイルのみ
    WtrExtractOrderFile:
      type: object
      description: watermark 抽出注文ファイル情報
      properties:
        fileId:
          type: integer
          description: ファイルID
        fileName:
          type: string
          description: ファイル名
        uploadUrl:
          type: string
          format: uri
          description: アップロードURL（プリサインドURL）
        fileKey:
          type: string
          description: S3ファイルキー
        fileFormat:
          type: string
          description: ファイル形式
          example: JPG
        fileType:
          type: string
          enum:
          - IMG
          - DOCUMENT
          description: ファイルタイプ（画像またはPDF）
        role:
          type: string
          enum:
          - watermarked
          description: ファイルの役割（メインファイルは常に"watermarked"）
        sequence:
          type: integer
          description: ファイル順序番号（常に1）
          example: 1
        originalFile:
          type: object
          nullable: true
          description: 元ファイル情報（includeOriginalがtrueの場合のみ含まれます）
          properties:
            fileId:
              type: integer
              description: ファイルID
            fileName:
              type: string
              description: ファイル名
            uploadUrl:
              type: string
              format: uri
              description: アップロードURL（プリサインドURL）
            fileKey:
              type: string
              description: S3ファイルキー
            fileFormat:
              type: string
              description: ファイル形式
            fileType:
              type: string
              enum:
              - IMG
              description: ファイルタイプ（画像のみ）
            role:
              type: string
              enum:
              - original
              description: ファイルの役割（常に"original"）
            sequence:
              type: integer
              description: ファイル順序番号（常に1）
              example: 1
    Order:
      type: object
      properties:
        orderId:
          type: string
          description: 注文ID
        orderName:
          type: string
          description: 注文名
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 注文タイプ
        channel:
          type: string
          enum:
          - api
          - web
          description: 注文チャネル
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: '注文ステータス

            * pending - 待機中

            * inProgress - 処理中

            * complete - 完了

            * failed - 失敗

            * expired - 期限切れ（注文作成から7日経過するとファイルはダウンロードできません）'
        fileCount:
          type: integer
          description: ファイル数
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: サムネイル画像URL（プリサインドURL）
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 最終更新日時
        probability:
          type: number
          nullable: true
          description: AI検知確率（aiDetection注文専用）
        statusCode:
          type: string
          nullable: true
          enum:
          - likely_real
          - uncertain_real
          - uncertain_ai
          - likely_ai
          description: 'AI検知結果コード（aiDetection注文専用）

            * likely_real - 実在コンテンツである可能性が高い

            * uncertain_real - 不確実、実在寄り

            * uncertain_ai - 不確実、AI生成寄り

            * likely_ai - AI生成コンテンツである可能性が高い'
    OrderDetail:
      type: object
      description: 注文詳細情報
      properties:
        orderId:
          type: string
          description: 注文ID
        orderName:
          type: string
          description: 注文名
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 注文タイプ
        channel:
          type: string
          enum:
          - api
          - web
          description: 注文チャネル
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: 注文ステータス
        fileCount:
          type: integer
          description: ファイル数
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: サムネイル画像URL（プリサインドURL、有効期限1時間）。aiDetection注文では、generateThumbnailオプション使用時のみ返却されます。期限切れの場合はnull。
        originalImageUrl:
          type: string
          format: uri
          nullable: true
          description: 元の入力画像のダウンロードURL（プリサインドURL、有効期限1時間）。aiDetection注文専用。期限切れの場合はnull。
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
        errors:
          type: string
          nullable: true
          description: エラーメッセージ（失敗時）
        watermarks:
          type: array
          items:
            type: string
          description: watermark テキスト一覧（watermarkEmbed注文専用）
        watermarkText:
          type: string
          nullable: true
          description: 抽出された watermark テキスト（watermarkExtract注文専用）
        probability:
          type: number
          nullable: true
          description: AI検知確率（aiDetection注文専用）
        statusCode:
          type: string
          nullable: true
          description: '注文タイプ別のステータスコード。

            **watermarkExtract 注文:**

            * detected - watermark を検出

            * undetected - watermark 未検出

            **aiDetection 注文**（probabilityから自動計算）:

            * likely_real - probability < 0.25

            * uncertain_real - 0.25 <= probability < 0.5

            * uncertain_ai - 0.5 <= probability < 0.75

            * likely_ai - probability >= 0.75

            他の注文タイプでは返却されません。'
        options:
          type: object
          nullable: true
          description: 注文作成時に設定したオプション（aiDetection注文専用）
          properties:
            generateHeatmap:
              type: boolean
              description: ヒートマップ画像をリクエストしたかどうか
              example: true
            generateOverlay:
              type: boolean
              description: オーバーレイ画像をリクエストしたかどうか
              example: true
            generateThumbnail:
              type: boolean
              description: サムネイル画像をリクエストしたかどうか
              example: true
        heatmapUrl:
          type: string
          format: uri
          nullable: true
          description: AI検知ヒートマップ画像のダウンロードURL（aiDetection注文専用、generateHeatmapオプション使用時に返却）
        overlayUrl:
          type: string
          format: uri
          nullable: true
          description: 元画像にヒートマップを重ねたオーバーレイ画像のダウンロードURL（aiDetection注文専用、generateOverlayオプション使用時に返却）
    UsageStats:
      type: object
      properties:
        dailyStats:
          type: array
          items:
            type: object
            properties:
              usageDate:
                type: string
                description: 使用日（MM.DD）
              usageCount:
                type: integer
                description: 使用回数
        domain:
          type: array
          items:
            type: integer
          description: チャートY軸の範囲 [最小値, 最大値]
        ticks:
          type: array
          items:
            type: integer
          description: チャートY軸の目盛り値
    WebhookRegisterRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Webhookエンドポイント URL
          example: https://example.com/webhook
    WebhookInfo:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: 登録されたWebhook URL
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: 作成日時
    WebhookCreateRequest:
      type: object
      required:
      - url
      properties:
        name:
          type: string
          maxLength: 100
          description: Webhook名（識別用）
        url:
          type: string
          format: uri
          description: Webhookエンドポイント URL
          example: https://example.com/webhook
    WebhookUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Webhook名
        url:
          type: string
          format: uri
          description: Webhook URL
          example: https://example.com/webhook
    WebhookListItem:
      type: object
      properties:
        id:
          type: integer
          description: Webhook ID
        name:
          type: string
          description: Webhook名
        url:
          type: string
          format: uri
          description: Webhook URL
        isActive:
          type: boolean
          description: 有効状態
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: 最終送信日時
        createdAt:
          type: string
          format: date-time
          description: 作成日時
    WebhookDetail:
      type: object
      properties:
        id:
          type: integer
          description: Webhook ID
        name:
          type: string
          description: Webhook名
        url:
          type: string
          format: uri
          description: Webhook URL
        secret:
          type: string
          description: Webhook署名シークレット
        isActive:
          type: boolean
          description: 有効状態
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
    WebhookEvent:
      type: object
      properties:
        id:
          type: integer
          description: イベントDB ID
        eventId:
          type: string
          format: uuid
          description: イベントUUID
        eventType:
          type: string
          description: イベントタイプ
          example: order.antiAi.completed
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - RETRYING
          - FAILED
          description: 配信ステータス
        retries:
          type: integer
          description: リトライ回数
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: 最終送信日時
        createdAt:
          type: string
          format: date-time
          description: 作成日時
    WebhookPagination:
      type: object
      properties:
        page:
          type: integer
          description: 現在のページ
        limit:
          type: integer
          description: ページあたりの項目数
        total:
          type: integer
          description: 総項目数
        totalPages:
          type: integer
          description: 総ページ数
  responses:
    BadRequest:
      description: 不正なリクエスト
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_FAILED
    Unauthorized:
      description: 認証失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTH_NOT_AUTHENTICATED
    NotFound:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
    UsageLimitExceeded:
      description: 使用量上限を超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: USAGE_LIMIT_EXCEEDED
    InternalError:
      description: 内部サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SERVER_INTERNAL_ERROR
tags:
- name: Anti-AI
  description: Anti-AI画像保護の注文
- name: Watermark Embed
  description: watermark 埋め込みの注文
- name: Watermark Extract
  description: watermark 抽出の注文
- name: AI Detection
  description: AI生成画像検知の注文
- name: Orders
  description: 注文の照会と管理
- name: Webhooks
  description: Webhookの設定とイベント
paths:
  /api/v2/orders/anti-ai:
    post:
      summary: Anti-AI注文を作成
      description: 'AI検知防止処理のための注文を作成します。


        ## 入力モード（アップロード / URL / 混合）

        入力モードは、各ファイルオブジェクトに `originalFileUrl` が含まれるかどうかで決定されます:

        - **アップロードモード**（`originalFileUrl` なし）: プリサインドURLを発行 → クライアントがS3にアップロード → `/confirm` を呼び出し

        - **URLモード**（`originalFileUrl` を指定）: URLから画像をダウンロードして即座に処理

        - **混合モード**: 一部のファイルはアップロードモード、残りはURLモードで同時に処理


        ### 動作

        | 条件 | 注文ステータス | Confirmの必要性 |

        |-----------|-------------|-----------------|

        | すべてのファイルに `originalFileUrl` がある | `inProgress` | 不要（即座に処理） |

        | `originalFileUrl` がないファイルが含まれる | `pending` | 必要（アップロード後にconfirm） |


        ## Zero Copy モード

        `mode.zeroCopy: true` の場合、処理結果は顧客が提供したプリサインドURLへ直接アップロードされます。

        この場合、`outputTargets` 配列が必須であり、`files` 配列と同じ長さである必要があります。'
      tags:
      - Anti-AI
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - files
              properties:
                idempotencyKey:
                  type: string
                  description: 重複リクエストを防ぐための冪等性キー
                orderName:
                  type: string
                  maxLength: 64
                  description: 注文名（任意、未指定の場合は自動生成）
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - fileName
                    properties:
                      fileName:
                        type: string
                        description: ファイル名（拡張子を含む）
                        example: image.jpg
                      originalFileUrl:
                        type: string
                        format: uri
                        description: '元画像URL（任意）

                          - 指定した場合: URLモード（プリサインドURLは発行されず、即座に処理）

                          - 指定しない場合: アップロードモード（プリサインドURLを発行、confirmが必要）'
                        example: https://example.com/image.jpg
                mode:
                  type: object
                  description: 処理モード設定
                  properties:
                    zeroCopy:
                      type: boolean
                      default: false
                      description: Zero Copyモードを有効化
                outputTargets:
                  type: array
                  description: Zero Copyモードの出力アップロード先（mode.zeroCopyがtrueの場合必須）
                  items:
                    type: object
                    required:
                    - fileKey
                    - url
                    - presignedUrlExpiresAt
                    properties:
                      fileKey:
                        type: string
                        description: ファイルキー（識別子）
                      url:
                        type: string
                        format: uri
                        description: 結果アップロード用のプリサインドURL
                      presignedUrlExpiresAt:
                        type: string
                        format: date-time
                        description: プリサインドURLの有効期限（ISO 8601）
                options:
                  $ref: '#/components/schemas/OrderOptions'
            examples:
              uploadMode:
                summary: アップロードモード（従来型）
                value:
                  idempotencyKey: key-upload-001
                  files:
                  - fileName: image1.jpg
                  - fileName: image2.png
                  options:
                    strength: high
              urlMode:
                summary: URLモード（即座に処理）
                value:
                  idempotencyKey: key-url-001
                  files:
                  - fileName: image1.jpg
                    originalFileUrl: https://example.com/image1.jpg
                  - fileName: image2.png
                    originalFileUrl: https://example.com/image2.png
                  options:
                    strength: high
              mixedMode:
                summary: 混合モード
                value:
                  idempotencyKey: key-mixed-001
                  files:
                  - fileName: upload-file.jpg
                  - fileName: url-file.png
                    originalFileUrl: https://example.com/image.png
                  options:
                    strength: standard
      responses:
        '200':
          description: 注文が正常に作成されました
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderName:
                        type: string
                      orderId:
                        type: string
                      status:
                        type: string
                        enum:
                        - pending
                        - inProgress
                        description: '注文ステータス

                          - `pending`: アップロードファイルを含む（confirmが必要）

                          - `inProgress`: すべてのファイルがURLモード（即座に処理）'
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/AntiAiOrderFile'
              examples:
                uploadModeResponse:
                  summary: アップロードモードのレスポンス
                  value:
                    data:
                      orderName: anti_ai_2026-02-09
                      orderId: '123456789'
                      status: pending
                      files:
                      - fileId: 1
                        fileName: image1.jpg
                        uploadUrl: https://s3.amazonaws.com/...
                        fileKey: temp/123456789/0/image1.jpg
                urlModeResponse:
                  summary: URLモードのレスポンス
                  value:
                    data:
                      orderName: anti_ai_2026-02-09
                      orderId: '123456789'
                      status: inProgress
                      files:
                      - fileId: 1
                        fileName: image1.jpg
                        originalFileUrl: https://example.com/image1.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/UsageLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/anti-ai \\\n  -H \"Authorization:\
          \ Bearer YOUR_API_TOKEN\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"idempotencyKey\"\
          : \"key-001\",\n    \"files\": [\n      {\"fileName\": \"image1.jpg\"},\n      {\"fileName\"\
          : \"image2.png\"}\n    ],\n    \"options\": {\"strength\": \"high\"}\n  }'"
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch('https://api.bizmori.com/api/v2/orders/anti-ai', {\n  method:\
          \ 'POST',\n  headers: {\n    'Authorization': 'Bearer YOUR_API_TOKEN',\n    'Content-Type':\
          \ 'application/json'\n  },\n  body: JSON.stringify({\n    idempotencyKey: 'key-001',\n    files:\
          \ [\n      { fileName: 'image1.jpg' },\n      { fileName: 'image2.png' }\n    ],\n    options:\
          \ { strength: 'high' }\n  })\n});\nconst data = await response.json();"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    'https://api.bizmori.com/api/v2/orders/anti-ai',\n\
          \    headers={'Authorization': 'Bearer YOUR_API_TOKEN'},\n    json={\n        'idempotencyKey':\
          \ 'key-001',\n        'files': [\n            {'fileName': 'image1.jpg'},\n            {'fileName':\
          \ 'image2.png'}\n        ],\n        'options': {'strength': 'high'}\n    }\n)\ndata = response.json()"
  /api/v2/orders/anti-ai/confirm:
    post:
      summary: Anti-AI注文を確認
      description: 'ファイルアップロード完了後、処理を開始するために呼び出します。

        - すべてのアップロードファイルがS3にアップロードされた後に呼び出してください

        - 処理が開始されるとステータスが `inProgress` に変わります

