  /api/v3/orders/{orderId}/reports:
    post:
      summary: 注文レポートを作成
      operationId: createOrderReport
      description: |
        注文の PDF 分析レポートを作成します。レポートの種類は BIZ MORI が注文の種類から決めるため、送信しません。

        - v3 API で作成した watermark 抽出注文 → `watermarkDetection`
        - AI Detection 注文 → `aiDetection`

        画像の watermark レポートは `ko-KR`、`en-US`、`ja-JP`、PDF の watermark レポートは `ko-KR` のみ対応します。同じ注文・locale を再度リクエストすると既存のレポートを返します。

        **レスポンス**
        - `202` と `queued`・`processing`: 作成中です。[`GET /api/v3/orders/{orderId}/reports/{locale}`](/ja/api-reference/reports/get-report) で照会してください
        - `200` と `completed`: 作成済みのレポートで、`download` を含みます
        - `200` と `failed`: 作成に失敗し、再試行できません(`failure.retryable` が `false`)

        **watermark レポートの再試行**
        watermark レポートが `failed` の場合、同じ注文・locale で再度呼び出すと新しく作成します(`202`)。試行ごとに 1 クレジットを予約し、失敗した試行は返金され、成功した試行だけが差し引かれます。失敗が 3 回に達すると再作成しません。

        注文の保管期限を過ぎると、レポートがあっても `400 ORDER_EXPIRED` を返します。
      tags:
      - Reports
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
        description: 注文 ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum:
                  - ko-KR
                  - en-US
                  - ja-JP
                  default: ko-KR
                  description: レポートの言語。デフォルトは `ko-KR`
            example:
              locale: en-US
      responses:
        '200':
          description: 作成済みのレポート、または再試行できない失敗レポート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
        '202':
          description: レポートのリクエストを受け付け、`queued` または `processing` の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
        '400':
          description: 不正なリクエスト、注文の種類が対応していない locale、または保管期限を過ぎた注文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                locale:
                  value:
                    code: REPORT_LOCALE_UNSUPPORTED
                expired:
                  value:
                    code: ORDER_EXPIRED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 注文が存在しないか別のアカウントの注文、または完了したレポートファイルが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order:
                  value:
                    code: ORDER_NOT_FOUND
                report:
                  value:
                    code: REPORT_NOT_FOUND
        '409':
          description: 注文が完了していないか、まだレポートを作成できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: REPORT_NOT_AVAILABLE
        '429':
          description: リクエスト回数の超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: レポート作成を一時的に利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
      x-codeSamples:
      - lang: curl
        label: cURL
        source: |
          curl -X POST https://api.bizmori.com/api/v3/orders/ORDER_ID/reports \
            -H "Authorization: Bearer YOUR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
            "locale": "en-US"
          }'
      - lang: javascript
        label: JavaScript
        source: |
          const orderId = 'ORDER_ID';
          const response = await fetch(`https://api.bizmori.com/api/v3/orders/${orderId}/reports`, {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer YOUR_API_KEY',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              "locale": "en-US"
            })
          });
          const { data } = await response.json();
      - lang: python
        label: Python
        source: |
          import requests

          order_id = 'ORDER_ID'
          response = requests.post(
              f'https://api.bizmori.com/api/v3/orders/{order_id}/reports',
              headers={'Authorization': 'Bearer YOUR_API_KEY'},
              json={
                "locale": "en-US"
              }
          )
          data = response.json()['data']
  /api/v3/orders/{orderId}/reports/{locale}:
    get:
      summary: 注文レポートを取得
      operationId: getOrderReport
      description: |
        レポートのステータスと、`completed` のときはダウンロード URL を取得します。作成リクエストのない locale は `404 REPORT_NOT_FOUND` です。

        `download.url` は呼び出すたびに新しく署名され、300 秒後に失効します。失効した URL はストレージが `403` を返し、更新できません。URL を保存せず、ユーザーがダウンロードを押したときにこの API を呼び出し、返された URL へすぐに移動してください。

        注文の保管期限を過ぎると、レポートのステータスに関係なく `400 ORDER_EXPIRED` を返します。
      tags:
      - Reports
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,20}$
        description: 注文 ID
      - in: path
        name: locale
        required: true
        schema:
          type: string
          enum:
          - ko-KR
          - en-US
          - ja-JP
        description: レポートの言語
      responses:
        '200':
          description: '`queued`・`processing`・`completed`・`failed` 状態のレポート。`download` は `completed` のときだけ存在'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReportResponse'
              example:
                data:
                  orderId: '1234567891'
                  reportType: watermarkDetection
                  locale: en-US
                  status: completed
                  download:
                    url: https://s3.ap-northeast-2.amazonaws.com/...
                    expiresInSeconds: 300
                  failure: null
        '400':
          description: 不正なリクエスト、注文の種類が対応していない locale、または保管期限を過ぎた注文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                locale:
                  value:
                    code: REPORT_LOCALE_UNSUPPORTED
                expired:
                  value:
                    code: ORDER_EXPIRED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 注文が存在しない、この locale のレポートがリクエストされていない、または完了したレポートファイルが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order:
                  value:
                    code: ORDER_NOT_FOUND
                report:
                  value:
                    code: REPORT_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: レポート作成を一時的に利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
      x-codeSamples:
      - lang: curl
        label: cURL
        source: |
          curl -X GET https://api.bizmori.com/api/v3/orders/ORDER_ID/reports/en-US \
            -H "Authorization: Bearer YOUR_API_KEY"
      - lang: javascript
        label: JavaScript
        source: |
          const orderId = 'ORDER_ID';
          const locale = 'en-US';
          const response = await fetch(`https://api.bizmori.com/api/v3/orders/${orderId}/reports/${locale}`, {
            headers: { 'Authorization': 'Bearer YOUR_API_KEY' }
          });
          const { data } = await response.json();
          if (data.status === 'completed') window.location.href = data.download.url;
      - lang: python
        label: Python
        source: |
          import requests

          order_id = 'ORDER_ID'
          locale = 'en-US'
          response = requests.get(
              f'https://api.bizmori.com/api/v3/orders/{order_id}/reports/{locale}',
              headers={'Authorization': 'Bearer YOUR_API_KEY'}
          )
          data = response.json()['data']
          if data['status'] == 'completed':
              pdf = requests.get(data['download']['url']).content
