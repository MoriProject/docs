              schema:
                type: string
                example: 'true'
            Sunset:
              description: サポート終了日時（RFC 8594 HTTP-date、2026 年 10 月 9 日 09:00 KST）
              schema:
                type: string
                example: 'Fri, 09 Oct 2026 00:00:00 GMT'
            Link:
              description: 後継の v3 API のパス
              schema:
                type: string
                example: '</api/v3/orders/wtr-extract>; rel="successor-version"'
          content:
