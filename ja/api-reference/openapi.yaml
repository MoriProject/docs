  /api/v2/orders/ai-detection:
    post:
      summary: AI Detection注文を作成
      operationId: createAiDetectionOrder
      description: 'AI Detection注文を作成し、画像用のプリサインドS3アップロードURLを発行します。


        ## フロー


        1. このエンドポイントを呼び出し、プリサインドアップロードURLを受け取ります

        2. プリサインドURLを使用して画像を直接S3にアップロードします

        3. `POST /api/v2/orders/ai-detection/confirm` を呼び出して非同期の検知処理を開始します

        4. Webhookまたは注文詳細エンドポイントのポーリングで結果を確認します


        ## 注文ステータス


        | ステータス | 説明 |

        |--------|-------------|

        | `pending` | ファイルアップロード待ち |

        | `inProgress` | 検知処理中 |

        | `complete` | 検知完了、結果を確認可能 |

        | `failed` | 検知失敗 |


        ## 対応形式


        jpg, jpeg, png, webp, bmp, tiff'
      tags:
      - AI Detection
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - fileName
              properties:
                idempotencyKey:
                  type: string
                  description: 重複リクエストを防ぐための冪等性キー
                  example: 0e6c4a9b-b1d8-457e-a9fc-4b7d0e3a6c59
                orderName:
                  type: string
                  maxLength: 64
                  description: 注文名（任意、未指定の場合は自動生成）
                  example: my-detection-order
                fileName:
                  type: string
                  description: '拡張子を含む画像ファイル名。対応形式: jpg, jpeg, png, webp, bmp, tiff'
                  example: photo.jpg
                options:
                  type: object
                  description: 出力オプション（任意）。生成されたファイルは注文詳細レスポンスに含まれます。
                  properties:
                    generateHeatmap:
                      type: boolean
                      default: false
                      description: AI検知ヒートマップ画像を生成
                    generateOverlay:
                      type: boolean
                      default: false
                      description: 元画像にヒートマップを重ねたオーバーレイ画像を生成
                    generateThumbnail:
                      type: boolean
                      default: false
                      description: サムネイル画像を生成
      responses:
        '200':
          description: 注文が正常に作成されました
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                        description: 注文ID
                      orderName:
                        type: string
                        description: 注文名
                      status:
                        type: string
                        enum:
                        - pending
                        description: 注文ステータス
                      file:
                        type: object
                        properties:
                          fileId:
                            type: integer
                            description: ファイルレコードID
                          fileName:
                            type: string
                            description: ファイル名
                          uploadUrl:
                            type: string
                            format: uri
                            description: ファイル直接アップロード用のプリサインドS3 URL。liveキーのプリサインドアップロードURLは発行後1時間有効です。
                          fileKey:
                            type: string
                            description: S3ファイルキー
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/UsageLimitExceeded'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/ai-detection \\\n  -H \"Authorization:\
          \ Bearer YOUR_API_TOKEN\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"idempotencyKey\"\
          : \"0e6c4a9b-b1d8-457e-a9fc-4b7d0e3a6c59\", \"fileName\": \"photo.jpg\"}'"
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch('https://api.bizmori.com/api/v2/orders/ai-detection', {\n\
          \  method: 'POST',\n  headers: {\n    'Authorization': 'Bearer YOUR_API_TOKEN',\n    'Content-Type':\
          \ 'application/json'\n  },\n  body: JSON.stringify({\n    idempotencyKey: '0e6c4a9b-b1d8-457e-a9fc-4b7d0e3a6c59',\n  \
          \  fileName: 'photo.jpg'\n  })\n});\nconst data = await response.json();"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    'https://api.bizmori.com/api/v2/orders/ai-detection',\n\
          \    headers={'Authorization': 'Bearer YOUR_API_TOKEN'},\n    json={'idempotencyKey': '0e6c4a9b-b1d8-457e-a9fc-4b7d0e3a6c59',\
          \ 'fileName': 'photo.jpg'}\n)\ndata = response.json()"
