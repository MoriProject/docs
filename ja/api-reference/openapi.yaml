  /api/v3/orders/{orderId}/download:
    get:
      summary: 注文結果のダウンロード URL を発行
      operationId: downloadOrderV3
      description: |
        完了した Anti-AI・watermark 埋め込み注文について、結果ファイルごとのダウンロード URL と、結果全体を受け取る URL を 1 回の呼び出しで発行します。watermark 注文を v2 と v3 のどちらで作成したかに関係なく、レスポンスの形式は同じです。

        - `files[]`: 結果ファイルごとの `{ fileId, downloadUrl }`。[`GET /api/v3/orders/{orderId}`](/ja/api-reference/orders/get-order-v3) の `result.outputFiles[]` と同じファイルを同じ順序で含み、`fileId` も同じです
        - `archiveUrl`: この URL 1 つで結果全体を受け取れます。常に文字列です
          - Anti-AI の注文、v2 で作成した watermark 埋め込み注文: 結果の ZIP
          - v3 で作成した watermark 埋め込み注文: 結果ファイルが 2 件以上なら ZIP、1 件ならその結果ファイルの URL（`files[0].downloadUrl` と同じファイル）
        - `expiresInSeconds`: URL の有効期間。既定は 3600 秒（1 時間）で、保管期限（`expiresAt`）までの残り時間のほうが短い場合はその時間に短縮します。新しい URL が必要な場合は再度呼び出してください

        **エラーの確認順序**（最初に該当したエラーを返します）
        1. 注文が存在しないか、他のアカウントの注文 → `404 ORDER_NOT_FOUND`
        2. watermark 検出・AI Detection の注文 → `400 ORDER_TYPE_CANT_DOWNLOAD`。保管期限が過ぎていてもこのエラーです
        3. 保管期限切れ → `400 ORDER_EXPIRED`。保管期限を確認できない場合は `409 FILE_RETENTION_UNKNOWN`
        4. `status` が `complete` ではない（`pending`、`inProgress`、`failed`） → `400 ORDER_NOT_COMPLETED`

        **以前の v3 レスポンスからの変更（破壊的変更、2026-10-08）**: レスポンスは `{ downloadUrl, expiresInSeconds: 300 }` から `{ archiveUrl, files, expiresInSeconds }` に変わり、Anti-AI の注文と v2 で作成した watermark 埋め込み注文にも対応しました。URL の有効期間は 300 秒から最大 3600 秒に延びました。未完了の注文は `VALIDATION_FAILED` の代わりに `ORDER_NOT_COMPLETED` を、検出注文は `ORDER_TYPE_CANT_DOWNLOAD` を返します。結果ファイルを 1 つ受け取る `GET /api/v3/orders/{orderId}/files/{fileId}/download` は削除されました。`files[]` を使用してください。

        **テストキー（`sk_test_`）**: 同じキーで作成した、完了済みの Anti-AI・watermark 埋め込みテスト注文（v2・v3）で動作します。URL は処理結果ではなく、`https://api.bizmori.com/api/v2/test-samples/{signedToken}` で提供されるサンプルファイルを指します。結果ファイルのない Anti-AI テスト注文は `files: []` とサンプル ZIP の `archiveUrl` を返します。結果が 1 件の v3 埋め込みテスト注文はそのサンプルファイルを、それ以外のテスト注文はサンプル ZIP を `archiveUrl` として返します。`expiresInSeconds`、エラーコード、確認順序は本番注文と同じです。
