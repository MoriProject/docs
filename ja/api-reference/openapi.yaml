  /api/v2/orders/wtr-extract:
    post:
      summary: watermark 抽出注文を作成
      operationId: createWatermarkExtractOrder
      deprecated: true
      description: '**非推奨。** このエンドポイントは 2026 年 10 月 9 日 09:00 KST（00:00 UTC）にサポートを終了する予定です。`POST /api/v3/orders/wtr-extract` を使用してください。


        このエンドポイントのすべてのレスポンス（認証エラーと `410` レスポンスを含む）には、`Deprecation: true`、`Sunset: Fri, 09 Oct 2026 00:00:00 GMT`、`Link: </api/v3/orders/wtr-extract>; rel="successor-version"` ヘッダーが含まれます。


        2026 年 10 月 9 日 09:00 KST（00:00 UTC）から:

        - 認証・権限の確認はこれまでどおり先に行われるため、`401`・`403` エラーは従来と同じです。

        - 認証を通過した v2 の watermark 埋め込み・抽出リクエストには、本番キーと `sk_test_` キーのどちらでも `410 Gone` と `{ "code": "WATERMARK_V2_API_SUNSET" }` が返されます。`Link` ヘッダーが v3 エンドポイントを示すので、v3 で新しくリクエストしてください。

        - その時点までに処理が始まっていない v2 注文は、処理されずに失敗として確定します。注文の詳細（`errors.errorCode`）と失敗 Webhook には `WATERMARK_V2_API_SUNSET` と v3 への案内メッセージが含まれ、課金されずクレジットは戻ります。

        - 終了時点ですでに処理中の注文は、結果の記録まで完了します。その後に改めて実行されることはありません。


        watermark 抽出注文を作成します。

        - 注文あたりファイル1つのみ

        - 画像（jpg, jpeg, png, webp, bmp, tiff）またはPDFファイルに対応

        - 画像の場合、`includeOriginal: true` で元ファイルも一緒にアップロード可能

        - PDFは `includeOriginal` に非対応'
      tags:
      - Watermark Extract
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - file
              properties:
                idempotencyKey:
                  type: string
                  description: 冪等性キー
                file:
                  type: object
                  required:
                  - fileName
                  properties:
                    fileName:
                      type: string
                      description: watermark 付きファイル名（拡張子を含む）
                      example: watermarked.jpg
                    includeOriginal:
                      type: boolean
                      default: false
                      description: '元ファイルを含める（画像のみ）

                        - true: 元ファイルのアップロードURLも発行されます

                        - PDFファイルでは使用できません'
                    originalFile:
                      type: object
                      description: 元ファイル情報（includeOriginalがtrueの場合必須）
                      required:
                      - fileName
                      properties:
                        fileName:
                          type: string
                          description: 元ファイル名
                          example: original.jpg
            examples:
              imageOnly:
                summary: 単一画像（watermark のみ）
                value:
                  idempotencyKey: 2f4b6c82-8a6e-4f39-9f8a-7d3b5c1e2a40
                  file:
                    fileName: watermarked.jpg
              imageWithOriginal:
                summary: 画像 + 元ファイルを含む
                value:
                  idempotencyKey: key-002
                  file:
                    fileName: watermarked.jpg
                    includeOriginal: true
                    originalFile:
                      fileName: original.jpg
              pdfOnly:
                summary: PDFファイル
                value:
                  idempotencyKey: key-003
                  file:
                    fileName: document.pdf
      responses:
