  /api/v3/orders/{orderId}:
    get:
      summary: 注文詳細を取得
      operationId: getOrderV3
      description: |
        所有する注文の詳細を、**注文の種類や watermark エンジンに関係なく 1 つの形式**で取得します。Anti-AI、AI Detection、watermark 埋め込み・検出の注文を、v2 と v3 のどちらで作成したかに関係なく取得できます。注文のステータスに関係なく、いつでも呼び出せます。

        **共通のトップレベルフィールド**: `type`、`orderId`、`orderName`、`channel`、`status`、`createdAt`、`updatedAt`、`expiresAt`、`retentionDays`、`thumbnailImageUrl`、`processingDelayed`、`errors`、`inputFiles`、`result`。すべての注文で同じキーを返し、注文の種類による違いは `result` の中だけです。
        - `type` は `antiAi`、`aiDetection`、`watermarkEmbed`、`watermarkExtract` のいずれかです。v3 で作成した watermark 注文も、エンジンのバージョン接尾辞なしで同じ値を使います
        - `status` は `pending`、`inProgress`、`complete`、`failed`、`expired` の 5 つだけです。保存されたステータスが `detected` / `undetected` の v2 watermark 検出注文は `complete` を返し、判定は `result.detectionStatus` に入ります
        - `processingDelayed` は v3 で作成した watermark 注文だけで計算します。それ以外の注文では常に `false` です
        - `errors` は失敗した注文の `{ errorCode, errorMessage }` で、それ以外は `null` です

        **`inputFiles[]`**: 入力ファイルごとの `{ fileId, fileName }` をリクエストの順に返します。ファイル数は `inputFiles.length` で確認してください。
        - `role`（`original` / `query`）は `watermarkExtract` の注文にだけ含まれます。v2 注文の `watermarked` ロールは `query` として返します
        - `uploadUrl`（presigned `PUT` URL）は、`status` が `pending` で、そのファイルがアップロード待ちのときだけ含まれます。それ以外はキー自体がありません（`null` にはなりません）

        **`result`**: キーは常にあります。`status` が `complete` のときだけオブジェクトで、`pending`、`inProgress`、`failed`、`expired` では `null` です。
        - `antiAi`: `{ outputFiles: [{ fileId, fileName, inputFileId }] }`
        - `watermarkEmbed`: `{ outputFiles: [{ fileId, fileName, inputFileId, watermarkText }] }`。v3 の注文で 1 つの入力ファイルに複数の watermark テキストを埋め込むと、テキストごとに結果ファイルが 1 つずつ作成されます
        - `watermarkExtract`: `{ detectionStatus, watermarkText, reportSupported, reports }`。`detectionStatus` は `detected`、`undetected`、`inconclusive`、`unsupported`、`error` のいずれかです。`detectionStatus` が `detected` でなければ `watermarkText` は `null` です。v2 の注文は `reportSupported: false`、`reports: []` です
        - `aiDetection`: `{ verdict, probability, options, originalImageUrl, heatmapUrl, overlayUrl }`。`verdict` は `likely_real`、`uncertain_real`、`uncertain_ai`、`likely_ai` のいずれかで、`probability` が `null` なら `verdict` も `null` です。保存されたオプションがなければ `options` は `null` です

        **`fileId`**: すべての `fileId` と `inputFileId` は数字だけの文字列です（`-` などの区切り文字はありません）。`result.outputFiles[].fileId` は注文内で一意で、[`GET /api/v3/orders/{orderId}/download`](/ja/api-reference/orders/download-order-v3) の `files[].fileId` と値・順序が一致します。

        **期限切れの注文**: `expired` の注文も取得できますが、`result` は `null` で、URL は発行しません。

        **以前の v3 レスポンスからの変更（破壊的変更、2026-10-08）**
        - v3 で作成した watermark 注文の `files[]`、`outputs[]`、トップレベルの `reports[]` は、`inputFiles[]`、`result.outputFiles[]`、`result.reports[]` に移りました。結果の `fileId` は `{inputFileId}-{n}` 形式から数字の文字列に変わりました
        - `detectionStatus` の値 `not_detected` は `undetected` に変わりました
        - v2 の詳細と同じ形式だったそれ以外の注文では、トップレベルの `fileCount`、`statusCode`、`watermarks`、`watermarkText`、`probability`、`options`、`originalImageUrl`、`heatmapUrl`、`overlayUrl` が `inputFiles` と `result` に移りました。AI Detection の `statusCode` は `result.verdict` に変わりました
        - 非推奨（deprecated）の [`GET /api/v2/orders/{orderId}`](/ja/api-reference/orders/get-order) のレスポンスは変わりません

        **テストキー（`sk_test_`）**: 同じキーで作成したテスト注文だけを取得します。本番注文と他のアカウントの注文は `404 ORDER_NOT_FOUND` を返し、本番キーでテスト注文を取得した場合も同じです。v2・v3 で作成したすべてのテスト注文をこの形式で返します。`inProgress` のテスト注文は、アップロード完了から 5 秒以上たってから取得すると `complete` または `failed` になります。pending のテスト注文の `uploadUrl` は `https://api.bizmori.com/api/v2/test-uploads/{signedToken}` です。検出テスト注文の `result.reports` は常に空の配列で、`reportSupported` は v3 で作成した検出テスト注文の `detectionStatus` が `detected` のときだけ `true` です。`expiresAt` は注文作成の 7 日後です。
