  /api/v2/orders/wtr-embed:
    post:
      summary: watermark 埋め込み注文を作成
      operationId: createWatermarkEmbedOrder
      deprecated: true
      description: '**非推奨。** このエンドポイントは 2026 年 10 月 9 日 09:00 KST（00:00 UTC）にサポートを終了する予定です。`POST /api/v3/orders/wtr-embed` を使用してください。


        このエンドポイントのすべてのレスポンス（認証エラーと `410` レスポンスを含む）には、`Deprecation: true`、`Sunset: Fri, 09 Oct 2026 00:00:00 GMT`、`Link: </api/v3/orders/wtr-embed>; rel="successor-version"` ヘッダーが含まれます。


        2026 年 10 月 9 日 09:00 KST（00:00 UTC）から:

        - 認証・権限の確認はこれまでどおり先に行われるため、`401`・`403` エラーは従来と同じです。

        - 認証を通過した v2 の watermark 埋め込み・抽出リクエストには、本番キーと `sk_test_` キーのどちらでも `410 Gone` と `{ "code": "WATERMARK_V2_API_SUNSET" }` が返されます。`Link` ヘッダーが v3 エンドポイントを示すので、v3 で新しくリクエストしてください。

        - その時点までに処理が始まっていない v2 注文は、処理されずに失敗として確定します。注文の詳細（`errors.errorCode`）と失敗 Webhook には `WATERMARK_V2_API_SUNSET` と v3 への案内メッセージが含まれ、課金されずクレジットは戻ります。

        - 終了時点ですでに処理中の注文は、結果の記録まで完了します。その後に改めて実行されることはありません。


        watermark 埋め込み注文を作成します。

        - 画像1枚あたり最大10個の watermark テキスト

        - 注文あたり最大100ファイル

        - 対応画像形式（IMG）: jpg, jpeg, png, webp, bmp, tiff

        - 対応文書形式（DOCUMENT）: pdf


        ## 入力モード（アップロード / URL / 混合）

        入力モードは、各ファイルオブジェクトに `originalFileUrl` が含まれるかどうかで決定されます:

        - **アップロードモード**（`originalFileUrl` なし）: プリサインドURLを発行 → クライアントがS3にアップロード → 処理が自動的に開始

        - **URLモード**（`originalFileUrl` を指定）: URLから画像をダウンロードして即座に処理

        - **混合モード**: 一部のファイルはアップロードモード、残りはURLモードで同時に処理


        ### 動作

        | 条件 | 注文ステータス | Confirmの必要性 |

        |-----------|-------------|-----------------|

        | すべてのファイルに `originalFileUrl` がある | `pending` | 不要（サーバーのダウンロード完了後に自動開始） |

        | `originalFileUrl` がないファイルが含まれる | `pending` | 不要（アップロード完了後に自動開始） |


        <Note>Anti-AIやAI Detectionと異なり、Watermark Embedでは別途confirmステップは不要です。ファイルアップロードが完了すると処理が自動的に開始されます。</Note>'
      tags:
      - Watermark Embed
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - files
              properties:
                idempotencyKey:
                  type: string
                  description: 冪等性キー
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - fileName
                    - watermarks
                    properties:
                      fileName:
                        type: string
                        description: ファイル名
                        example: image.jpg
                      originalFileUrl:
                        type: string
                        format: uri
                        description: '元画像URL（任意）

                          - 指定した場合: URLモード（プリサインドURLは発行されず、即座に処理）

                          - 指定しない場合: アップロードモード（プリサインドURLを発行）'
                        example: https://example.com/image.jpg
                      watermarks:
                        type: array
                        minItems: 1
                        maxItems: 10
                        items:
                          type: object
                          required:
                          - text
                          properties:
                            text:
                              type: string
                              maxLength: 1000
                              description: watermark テキスト
            examples:
              uploadMode:
                summary: アップロードモード（従来型）
                value:
                  idempotencyKey: 5e9c7a3b-b4d2-4f18-83e6-8b1a2d5f7c93
                  files:
                  - fileName: image1.jpg
                    watermarks:
                    - text: MORI_WATERMARK
                  - fileName: image2.png
                    watermarks:
                    - text: MORI_WATERMARK
              urlMode:
                summary: URLモード（即座に処理）
                value:
                  idempotencyKey: 6a4d2f80-c9e7-45b1-8a3d-2c5f7e9b1d64
                  files:
                  - fileName: image1.jpg
                    originalFileUrl: https://example.com/image1.jpg
                    watermarks:
                    - text: MORI_WATERMARK
                  - fileName: image2.png
                    originalFileUrl: https://example.com/image2.png
                    watermarks:
                    - text: MORI_WATERMARK
              mixedMode:
                summary: 混合モード
