    post:
      summary: Webhookを作成
      operationId: createWebhook
      description: "新しいWebhookを登録します。\n- 複数のWebhookを登録可能\n- 登録時に署名シークレットが返却されます\n\n**重要**: シークレットはこのレスポンスでのみ表示されます。安全に保管してください。\n\
        \n## Webhookイベントタイプ\n\n| イベントタイプ | 説明 |\n|-----------|-------------|\n| `order.antiAi.completed`\
        \ | Anti-AI処理が完了 |\n| `order.antiAi.failed` | Anti-AI処理が失敗 |\n| `order.watermarkEmbed.completed`\
        \ | watermark 埋め込みが完了 |\n| `order.watermarkEmbed.failed` | watermark 埋め込みが失敗 |\n| `order.watermarkExtract.completed`\
        \ | watermark 抽出が完了 |\n| `order.watermarkExtract.failed` | watermark 抽出が失敗 |\n\n## 署名検証\n\nWebhookリクエストには\
        \ `X-MoriBiz-Signature` ヘッダーが含まれます。\n署名は、登録時に発行されたシークレットを使用してHMAC-SHA256で生成されます。\n\n```javascript\n\
        const crypto = require('crypto');\nconst signature = crypto.createHmac('sha256', secret)\n  .update(JSON.stringify(payload))\n\
        \  .digest('hex');\n```\n\n## リトライポリシー\n\n- 最大3回リトライ\n- 指数バックオフ（1秒、2秒、4秒）\n- 成功レスポンス: 2xxステータスコード"
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '200':
          description: Webhookの作成に成功しました
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Webhook ID
                      name:
                        type: string
                        description: Webhook名
                      secret:
                        type: string
                        description: 'Webhook署名シークレット。

                          **警告**: この値は再取得できません。安全に保管してください。'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/webhooks \\\n  -H \"Authorization:\
          \ Bearer YOUR_API_TOKEN\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"name\"\
          : \"My Webhook\",\n    \"url\": \"https://example.com/webhook\"\n  }'"
