  /api/v2/orders/webhooks/{webhookId}/events/{eventId}/retry:
    post:
      summary: Webhookイベントを再送
      description: '失敗した単一のWebhookイベントを手動で再送します。

        - `FAILED` ステータスのイベントのみ再送可能

        - 成功すると、イベントステータスは `SENT` に変わります

        - 再送が失敗した場合、イベントは `FAILED` のままとなり、30分後にスケジューラーによる再送がキューに登録されます'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          type: integer
        description: Webhook ID
      - in: path
        name: eventId
        required: true
        schema:
          type: integer
        description: WebhookイベントID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
                        description: 元イベントのUUID
                      success:
                        type: boolean
                        description: 再送が成功したかどうか
                      status_code:
                        type: integer
                        description: Webhookエンドポイントからの HTTPレスポンスコード（successがtrueの場合）
                      status:
                        type: string
                        description: イベントステータス（再送失敗時）
                        example: FAILED
                      error:
                        type: string
                        description: エラーメッセージ（再送失敗時）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: イベントは再送不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/webhooks/WEBHOOK_ID/events/EVENT_ID/retry\
          \ \\\n  -H \"Authorization: Bearer YOUR_API_TOKEN\""
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch(\n  `https://api.bizmori.com/api/v2/orders/webhooks/${webhookId}/events/${eventId}/retry`,\n\
          \  {\n    method: 'POST',\n    headers: { 'Authorization': 'Bearer YOUR_API_TOKEN' }\n  }\n\
          );\nconst data = await response.json();"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    f'https://api.bizmori.com/api/v2/orders/webhooks/{webhook_id}/events/{event_id}/retry',\n\
          \    headers={'Authorization': 'Bearer YOUR_API_TOKEN'}\n)\ndata = response.json()"
  /api/v2/orders/webhooks/{webhookId}/events/retry-failed:
    post:
      summary: 失敗したWebhookイベントを一括再送
      description: '指定した期間内のすべての失敗したWebhookイベントを再送します。

        - 1リクエストあたり最大50件の失敗イベントを再送

        - 期間は7日を超えることはできません

        - 各イベントは個別に再送されます'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          type: integer
        description: Webhook ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fromDate
              - toDate
              properties:
                fromDate:
                  type: string
                  format: date
                  description: '開始日（ISO 8601形式、例: 2026-01-01）'
                  example: '2026-01-01'
                toDate:
                  type: string
                  format: date
                  description: '終了日（ISO 8601形式、例: 2026-01-07）。fromDateから7日以内である必要があります。'
                  example: '2026-01-07'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: 期間内に見つかった失敗イベントの総数
                      succeeded:
                        type: integer
                        description: 再送に成功したイベント数
                      failed:
                        type: integer
                        description: 再送に失敗したイベント数
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 無効な期間
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl -X POST https://api.bizmori.com/api/v2/orders/webhooks/WEBHOOK_ID/events/retry-failed\
          \ \\\n  -H \"Authorization: Bearer YOUR_API_TOKEN\" \\\n  -H \"Content-Type: application/json\"\
          \ \\\n  -d '{\n    \"fromDate\": \"2026-01-01\",\n    \"toDate\": \"2026-01-07\"\n  }'"
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch(\n  `https://api.bizmori.com/api/v2/orders/webhooks/${webhookId}/events/retry-failed`,\n\
          \  {\n    method: 'POST',\n    headers: {\n      'Authorization': 'Bearer YOUR_API_TOKEN',\n\
          \      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({\n      fromDate:\
          \ '2026-01-01',\n      toDate: '2026-01-07'\n    })\n  }\n);\nconst data = await response.json();"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    f'https://api.bizmori.com/api/v2/orders/webhooks/{webhook_id}/events/retry-failed',\n\
          \    headers={'Authorization': 'Bearer YOUR_API_TOKEN'},\n    json={\n        'fromDate': '2026-01-01',\n\
          \        'toDate': '2026-01-07'\n    }\n)\ndata = response.json()"
