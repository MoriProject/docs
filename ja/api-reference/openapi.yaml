openapi: 3.0.0
info:
  title: BIZ MORI API
  version: 2.0.0
  description: 'BIZ MORI API は、デジタルコンテンツ保護のための4つのコアサービスを提供します:

    - **Anti-AI**: 画像をAI学習から保護

    - **Watermark Embed**: 画像に不可視のデジタル watermark を埋め込み

    - **Watermark Extract**: 画像から watermark を抽出・検証

    - **AI Detection**: 画像がAI生成かどうかを検知

    - **テストAPIキー**: `sk_test_` プレフィックスのキーは同じBearer認証を使用し、実際の処理サービスの実行やクレジットの消費なしに注文ライフサイクルを検証できます。テストアップロードの内容は破棄され、結果ファイルは作成されません'
  contact:
    name: BIZ MORI サポート
    email: support@bizmori.com
  license:
    name: Proprietary
    url: https://docs.bizmori.com/legal/terms
servers:
- url: https://api.bizmori.com
  description: 本番環境
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 外部クライアントアクセス用のBearer APIキー。本番キーは `sk_` プレフィックスを使用し、テストキーは `sk_test_` プレフィックスを使用して、処理やクレジット消費なしに注文ライフサイクルを検証します。
  schemas:
    BaseResponse:
      type: object
      properties:
        data:
          oneOf:
          - type: object
            nullable: true
            additionalProperties: true
          - type: array
            items: {}
          description: レスポンスデータ（データがない場合はnull）
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: エラーコード
    PageInfo:
      type: object
      properties:
        totalItems:
          type: integer
          description: 総項目数
        totalPages:
          type: integer
          description: 総ページ数
        currentPage:
          type: integer
          description: 現在のページ番号
        itemsPerPage:
          type: integer
          description: ページあたりの項目数
    OrderOptions:
      type: object
      properties:
        strength:
          type: string
          enum:
          - low
          - standard
          - high
          default: high
          description: '保護強度レベル

            * low - 低い保護強度

            * standard - 標準の保護強度

            * high - 高い保護強度'
    OrderFile:
      type: object
      properties:
        fileId:
          type: string
          description: ファイルID
        fileName:
          type: string
          description: ファイル名
        uploadUrl:
          type: string
          format: uri
          description: アップロードURL（プリサインドURL）
        fileKey:
          type: string
          description: S3ファイルキー
    AntiAiOrderFile:
      type: object
      description: 'Anti-AI 注文ファイル情報（ファイルモードによってフィールドが異なります）

        - アップロードモード: fileId, fileName, uploadUrl, fileKey

        - URLモード: fileId, fileName, originalFileUrl'
      properties:
        fileId:
          type: string
          description: ファイルID
        fileName:
          type: string
          description: ファイル名
        uploadUrl:
          type: string
          format: uri
          description: アップロードURL（プリサインドURL）— アップロードモードのファイルのみ
        fileKey:
          type: string
          description: S3ファイルキー — アップロードモードのファイルのみ
        originalFileUrl:
          type: string
          format: uri
          description: 元画像URL — URLモードのファイルのみ
    WtrExtractOrderFile:
      type: object
      description: watermark 抽出注文ファイル情報
      properties:
        fileId:
          type: integer
          description: ファイルID
        fileName:
          type: string
          description: ファイル名
        uploadUrl:
          type: string
          format: uri
          description: アップロードURL（プリサインドURL）
        fileKey:
          type: string
          description: S3ファイルキー
        fileFormat:
          type: string
          description: ファイル形式
          example: JPG
        fileType:
          type: string
          enum:
          - IMG
          - DOCUMENT
          description: ファイルタイプ（画像またはPDF）
        role:
          type: string
          enum:
          - watermarked
          description: ファイルの役割（メインファイルは常に"watermarked"）
        sequence:
          type: integer
          description: ファイル順序番号（常に1）
          example: 1
        originalFile:
          type: object
          nullable: true
          description: 元ファイル情報（includeOriginalがtrueの場合のみ含まれます）
          properties:
            fileId:
              type: integer
              description: ファイルID
            fileName:
              type: string
              description: ファイル名
            uploadUrl:
              type: string
              format: uri
              description: アップロードURL（プリサインドURL）
            fileKey:
              type: string
              description: S3ファイルキー
            fileFormat:
              type: string
              description: ファイル形式
            fileType:
              type: string
              enum:
              - IMG
              description: ファイルタイプ（画像のみ）
            role:
              type: string
              enum:
              - original
              description: ファイルの役割（常に"original"）
            sequence:
              type: integer
              description: ファイル順序番号（常に1）
              example: 1
    Order:
      type: object
      properties:
        orderId:
          type: string
          description: 注文ID
        orderName:
          type: string
          description: 注文名
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 注文タイプ。v3 watermark API で作成した注文も `watermarkEmbed` または `watermarkExtract` として返します
        channel:
          type: string
          enum:
          - api
          - web
          description: 注文チャネル
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: '注文ステータス

            * pending - 待機中

            * inProgress - 処理中

            * complete - 完了

            * failed - 失敗

            * expired - 期限切れ（注文作成から7日経過するとファイルはダウンロードできません）'
        fileCount:
          type: integer
          description: ファイル数。v3 watermark 注文は、埋め込みなら元ファイルの数、抽出なら検査ファイルだけを数えます
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: |
            サムネイル画像 URL(presigned URL、1 時間有効)。aiDetection 注文は generateThumbnail オプションを使用した場合のみ返します。失効すると null です。
            v3 watermark 注文は、処理完了後に最大 100×100 の WebP サムネイル(PDF は 1 ページ目)を返します。処理前・失敗・サムネイルがない注文はステータス画像を返します。
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 最終更新日時
        probability:
          type: number
          nullable: true
          description: AI検知確率（aiDetection注文専用）
        statusCode:
          type: string
          nullable: true
          enum:
          - detected
          - undetected
          - inconclusive
          - unsupported
          - error
          - likely_real
          - uncertain_real
          - uncertain_ai
          - likely_ai
          description: |
            注文タイプ別のステータスコード。結果が出る前は `null` です。

            **watermarkExtract 注文:**

            * `detected` - watermark を検出
            * `undetected` - watermark 未検出
            * `inconclusive` - 判定不可 (v3 注文のみ)
            * `unsupported` - 処理できない入力 (v3 注文のみ)
            * `error` - 検出処理の失敗 (v3 注文のみ)

            **aiDetection 注文** (probability から算出):

            * `likely_real` - 実際のコンテンツの可能性が高い
            * `uncertain_real` - 不確実、実際のコンテンツ寄り
            * `uncertain_ai` - 不確実、AI 生成寄り
            * `likely_ai` - AI 生成の可能性が高い
    OrderDetail:
      type: object
      description: 注文詳細情報
      properties:
        orderId:
          type: string
          description: 注文ID
        orderName:
          type: string
          description: 注文名
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 注文タイプ
        channel:
          type: string
          enum:
          - api
          - web
          description: 注文チャネル
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: 注文ステータス
        fileCount:
          type: integer
          description: ファイル数
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: |
            サムネイル画像URL（プリサインドURL、有効期限1時間）。期限切れの場合はnullです。
            Anti-AI注文は、縦横比を保った幅740×高さ400以内のWebP詳細サムネイルを返します。この変更より前に作成された注文や、詳細サムネイルを作成できなかった注文は200×200のサムネイルを返します。
            AI Detection注文は、処理完了後に `generateThumbnail` オプションに関係なく詳細サムネイル（WebP、740×400以内）を返します。リサイズ画像が用意できていない場合は、元の入力画像のURLを返します。
        originalImageUrl:
          type: string
          format: uri
          nullable: true
          description: |
            元の入力画像のダウンロードURL（プリサインドURL、有効期限1時間）。aiDetection注文専用。期限切れの場合はnullです。
            処理完了後は、通常、長辺を1600px以内に縮小したコピー（WebP）を返します。リサイズしたコピーが用意できていない場合は、元の入力画像を返します。
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
        errors:
          type: string
          nullable: true
          description: エラーメッセージ（失敗時）
        watermarks:
          type: array
          items:
            type: string
          description: watermark テキスト一覧（watermarkEmbed注文専用）
        watermarkText:
          type: string
          nullable: true
          description: 抽出された watermark テキスト（watermarkExtract注文専用）
        probability:
          type: number
          nullable: true
          description: AI検知確率（aiDetection注文専用）
        statusCode:
          type: string
          nullable: true
          description: '注文タイプ別のステータスコード。

            **watermarkExtract 注文:**

            * detected - watermark を検出

            * undetected - watermark 未検出

            **aiDetection 注文**（probabilityから自動計算）:

            * likely_real - probability < 0.25

            * uncertain_real - 0.25 <= probability < 0.5

            * uncertain_ai - 0.5 <= probability < 0.75

            * likely_ai - probability >= 0.75

            他の注文タイプでは返却されません。'
        options:
          type: object
          nullable: true
          description: 注文作成時に設定したオプション（aiDetection注文専用）
          properties:
            generateHeatmap:
              type: boolean
              description: ヒートマップ画像をリクエストしたかどうか
              example: true
            generateOverlay:
              type: boolean
              description: オーバーレイ画像をリクエストしたかどうか
              example: true
            generateThumbnail:
              type: boolean
              description: サムネイル画像をリクエストしたかどうか
              example: true
        heatmapUrl:
          type: string
          format: uri
          nullable: true
          description: |
            AI検知ヒートマップ画像のダウンロードURL（aiDetection注文専用、generateHeatmapオプション使用時に返却）。
            通常、長辺を1600px以内に縮小したWebPです。リサイズ画像が用意できていない場合は、元のサイズのPNGを返します。
        overlayUrl:
          type: string
          format: uri
          nullable: true
          description: |
            元画像にヒートマップを重ねたオーバーレイ画像のダウンロードURL（aiDetection注文専用、generateOverlayオプション使用時に返却）。
            通常、長辺を1600px以内に縮小したWebPです。リサイズ画像が用意できていない場合は、元のサイズのPNGを返します。
    UsageStats:
      type: object
      properties:
        dailyStats:
          type: array
          items:
            type: object
            properties:
              usageDate:
                type: string
                description: 使用日（MM.DD）
              usageCount:
                type: integer
                description: 使用回数
        domain:
          type: array
          items:
            type: integer
          description: チャートY軸の範囲 [最小値, 最大値]
        ticks:
          type: array
          items:
            type: integer
          description: チャートY軸の目盛り値
    WebhookRegisterRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Webhookエンドポイント URL
          example: https://example.com/webhook
    WebhookInfo:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: 登録されたWebhook URL
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: 作成日時
    WebhookCreateRequest:
      type: object
      required:
      - url
      properties:
        name:
          type: string
          maxLength: 100
          description: Webhook名（識別用）
        url:
          type: string
          format: uri
          description: Webhookエンドポイント URL
          example: https://example.com/webhook
    WebhookUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Webhook名
        url:
          type: string
          format: uri
          description: Webhook URL
          example: https://example.com/webhook
    WebhookListItem:
      type: object
      properties:
        id:
          type: integer
          description: Webhook ID
        name:
          type: string
          description: Webhook名
        url:
          type: string
          format: uri
          description: Webhook URL
        isActive:
          type: boolean
          description: 有効状態
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: 最終送信日時
        createdAt:
          type: string
          format: date-time
          description: 作成日時
    WebhookDetail:
      type: object
      properties:
        id:
          type: integer
          description: Webhook ID
        name:
          type: string
          description: Webhook名
        url:
          type: string
          format: uri
          description: Webhook URL
        secret:
          type: string
          description: Webhook署名シークレット
        isActive:
          type: boolean
          description: 有効状態
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
    WebhookEvent:
      type: object
      properties:
        id:
          type: integer
          description: イベントDB ID
        eventId:
          type: string
          format: uuid
          description: イベントUUID
        eventType:
          type: string
          description: イベントタイプ
          example: order.antiAi.completed
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - RETRYING
          - FAILED
          description: 配信ステータス
        retries:
          type: integer
          description: リトライ回数
        lastSentAt:
          type: string
          format: date-time
          nullable: true
          description: 最終送信日時
        createdAt:
          type: string
          format: date-time
          description: 作成日時
    WebhookPagination:
      type: object
      properties:
        page:
          type: integer
          description: 現在のページ
        limit:
          type: integer
          description: ページあたりの項目数
        total:
          type: integer
          description: 総項目数
        totalPages:
          type: integer
          description: 総ページ数
    WatermarkV1OrderResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/WatermarkV1Order'
    WatermarkV1Order:
      type: object
      description: 'v3 API で作成した不可視 watermark 注文（注文作成レスポンス）。注文詳細は形式の異なる `GET /api/v3/orders/{orderId}` で取得してください'
      required:
      - orderId
      - status
      - processingDelayed
      - files
      - outputs
      - result
      - reports
      properties:
        orderId:
          type: string
          description: 注文 ID
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: |
            注文の処理ステータス

            * `pending` - ファイルのアップロード待ち
            * `inProgress` - 処理中
            * `complete` - 処理完了。抽出注文は `result` で結果を確認します
            * `failed` - 処理失敗、または 12 時間以内にアップロードされなかった
            * `expired` - 保管期限を過ぎ、ファイルが削除された
        processingDelayed:
          type: boolean
          description: 自動再試行をすべて使い切り、手動復旧を待っている場合は `true`。注文は `inProgress` のままです
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 注文ファイルが削除される日時。以降のダウンロードとレポートは `ORDER_EXPIRED` を返します
        files:
          type: array
          description: リクエスト順の入力ファイル。抽出注文は元ファイル、検査ファイルの順です
          items:
            $ref: '#/components/schemas/WatermarkV1UploadFile'
        outputs:
          type: array
          description: 埋め込み結果。watermark テキストごとに 1 件で、抽出注文では空の配列です
          items:
            $ref: '#/components/schemas/WatermarkV1Output'
        result:
          $ref: '#/components/schemas/WatermarkV1DetectionResult'
        reports:
          type: array
          description: この注文でリクエストしたレポート
          items:
            type: object
            required:
            - locale
            - status
            properties:
              locale:
                type: string
                enum:
                - ko-KR
                - en-US
                - ja-JP
              status:
                type: string
                enum:
                - queued
                - processing
                - completed
                - failed
    WatermarkV1UploadFile:
      type: object
      required:
      - fileId
      - uploadUrl
      properties:
        fileId:
          type: string
          description: 入力ファイル ID
        uploadUrl:
          type: string
          format: uri
          nullable: true
          description: |
            ファイルアップロード用の presigned `PUT` URL(900 秒有効)。注文の `status` が `pending` で保管期限前、かつアップロード待ちのファイルにだけ発行します。
            `originalFileUrl` で指定したファイル、アップロード済みのファイル、12 時間のアップロード期限を過ぎて `failed` になった注文、保管期限を過ぎた注文は `null` です。
    WatermarkV1Output:
      type: object
      required:
      - fileId
      - inputFileId
      - outputIndex
      - watermarkText
      - status
      - mediaKind
      properties:
        fileId:
          type: string
          description: '注文内で結果を区別する `{inputFileId}-{連番}` 形式の識別子（注文作成レスポンス専用）。注文詳細の `result.outputFiles[].fileId` とダウンロードレスポンスの `files[].fileId` は数字の文字列で、この値とは異なります'
        inputFileId:
          type: string
          description: この結果を作成した入力ファイル ID
        outputIndex:
          type: integer
          minimum: 0
          description: 入力ファイルの `watermarks` 内でのテキストの位置
        watermarkText:
          type: string
          description: 埋め込んだ watermark テキスト
        status:
          type: string
          enum:
          - pending
          - queued
          - processing
          - completed
          - failed
          - retry_required
          description: この結果ファイルの処理ステータス
        mediaKind:
          type: string
          enum:
          - image
          - pdf
    WatermarkV1DetectionResult:
      type: object
      nullable: true
      description: 抽出結果の概要。埋め込み注文と、結果が出る前は `null` で、以下のフィールドだけを含みます
      required:
      - detectionStatus
      - reportSupported
      - watermarkText
      additionalProperties: false
      properties:
        detectionStatus:
          type: string
          enum:
          - detected
          - not_detected
          - inconclusive
          - unsupported
          - error
          description: |
            * `detected` - watermark を検出
            * `not_detected` - 最後まで検査したが watermark なし
            * `inconclusive` - 候補はあるが確信度の基準に満たず判定不可
            * `unsupported` - 処理できない入力 (クレジット返金)
            * `error` - 検出処理の失敗。watermark なしとは異なる (クレジット返金)
        reportSupported:
          type: boolean
          description: この結果からレポートを作成できるかどうか。PDF からキャプチャした画像は `false`
        watermarkText:
          type: string
          nullable: true
          description: |
            検出された watermark の埋め込みテキスト。`detectionStatus` が `detected` で、呼び出し元のアカウントが埋め込み、発行記録がちょうど 1 件のときだけ返します。
            別のアカウントが埋め込んだ watermark など、それ以外は `null` です。
    PublicInputFile:
      type: object
      description: '`watermarkExtract` 以外の注文の入力ファイル（リクエストの順）。`role` キーはありません。`uploadUrl` キーは注文の `status` が `pending` で、そのファイルがアップロード待ちのときだけ含まれ、それ以外はキー自体がありません（`null` にはなりません）'
      required:
      - fileId
      - fileName
      additionalProperties: false
      properties:
        fileId:
          type: string
          pattern: ^[0-9]+$
          description: 入力ファイル ID。数字だけの文字列です
          example: '11'
        fileName:
          type: string
          nullable: true
          description: 入力ファイル名（拡張子を含む）。不明な場合は `null` です
          example: cat.png
        uploadUrl:
          type: string
          format: uri
          description: ファイルをアップロードするための presigned `PUT` URL。注文の `status` が `pending` で保管期限前、かつそのファイルがアップロード待ちのときだけ含まれます。アップロード済みのファイル、`originalFileUrl` で指定したファイル、`pending` ではない注文ではキーがありません
    PublicExtractInputFile:
      type: object
      description: '`watermarkExtract` の注文の入力ファイル。元のファイルと検査対象を区別する `role` が加わります。`uploadUrl` のルールは `PublicInputFile` と同じです'
      required:
      - fileId
      - fileName
      - role
      additionalProperties: false
      properties:
        fileId:
          type: string
          pattern: ^[0-9]+$
          description: 入力ファイル ID。数字だけの文字列です
          example: '51'
        fileName:
          type: string
          nullable: true
          description: 入力ファイル名（拡張子を含む）。不明な場合は `null` です
          example: suspect.png
        role:
          type: string
          enum:
          - original
          - query
          description: |-
            * `original` - watermark を埋め込んだ元のファイル
            * `query` - watermark の有無を検査するファイル。v2 注文の `watermarked` ロールも `query` として返します
        uploadUrl:
          type: string
          format: uri
          description: ファイルをアップロードするための presigned `PUT` URL。`status` が `pending` で、そのファイルがアップロード待ちのときだけ含まれます
    PublicOutputFile:
      type: object
      description: Anti-AI の注文の結果ファイル 1 件。`fileId` はダウンロードのレスポンスの `files[].fileId` と値・順序が一致します
      required:
      - fileId
      - fileName
      - inputFileId
      additionalProperties: false
      properties:
        fileId:
          type: string
          pattern: ^[0-9]+$
          description: 結果ファイル ID。数字だけの文字列で、注文内で一意です
          example: '21'
        fileName:
          type: string
          nullable: true
          description: 結果ファイル名（拡張子を含む）。不明な場合は `null` です
          example: cat.png
        inputFileId:
          type: string
          pattern: ^[0-9]+$
          description: この結果の元になった入力ファイルの `inputFiles[].fileId`
          example: '11'
    PublicWatermarkEmbedOutputFile:
      type: object
      description: watermark 埋め込み注文の結果ファイル 1 件。`PublicOutputFile` に埋め込みテキスト `watermarkText` が加わります。v3 の注文で 1 つの入力ファイルに複数のテキストを埋め込むと、同じ `inputFileId` を持つ結果ファイルが複数作成されます
      required:
      - fileId
      - fileName
      - inputFileId
      - watermarkText
      additionalProperties: false
      properties:
        fileId:
          type: string
          pattern: ^[0-9]+$
          description: 結果ファイル ID。数字だけの文字列で、注文内で一意です
          example: '201'
        fileName:
          type: string
          nullable: true
          description: 結果ファイル名（拡張子を含む）。不明な場合は `null` です
          example: logo.png
        inputFileId:
          type: string
          pattern: ^[0-9]+$
          description: この結果の元になった入力ファイルの `inputFiles[].fileId`
          example: '31'
        watermarkText:
          type: string
          description: この結果ファイルに埋め込んだ watermark テキスト
          example: MORI
    PublicAntiAiResult:
      type: object
      nullable: true
      description: Anti-AI の注文の結果。`status` が `complete` のときだけオブジェクトで、それ以外は `null` です
      required:
      - outputFiles
      additionalProperties: false
      properties:
        outputFiles:
          type: array
          description: 結果ファイルの一覧。入力ファイルごとに結果が 1 件です
          items:
            $ref: '#/components/schemas/PublicOutputFile'
    PublicWatermarkEmbedResult:
      type: object
      nullable: true
      description: watermark 埋め込み注文の結果。`status` が `complete` のときだけオブジェクトで、それ以外は `null` です。以前の v3 レスポンスの `outputs[]` と v2 詳細の `watermarks[]` を置き換えます
      required:
      - outputFiles
      additionalProperties: false
      properties:
        outputFiles:
          type: array
          description: 結果ファイルの一覧。入力ファイルの順、同じ入力の中では結果の順に並びます
          items:
            $ref: '#/components/schemas/PublicWatermarkEmbedOutputFile'
    PublicWatermarkExtractResult:
      type: object
      nullable: true
      description: watermark 検出注文の結果。`status` が `complete` のときだけオブジェクトで、それ以外は `null` です。watermark ID やエンジンの理由コードなどの内部値は含みません
      required:
      - detectionStatus
      - watermarkText
      - reportSupported
      - reports
      additionalProperties: false
      properties:
        detectionStatus:
          type: string
          nullable: true
          enum:
          - detected
          - undetected
          - inconclusive
          - unsupported
          - error
          - null
          description: |-
            判定。検出記録のない v2 の注文（データ異常）だけ `null` です。
            * `detected` - watermark が見つかった
            * `undetected` - 最後まで検査したが watermark はなかった。v3 エンジンの `not_detected` と、保存されたステータスが `undetected` の v2 注文を含みます
            * `inconclusive` - 候補はあるが確信度の基準に届かず判断できない
            * `unsupported` - 処理できない入力（クレジットは返却）
            * `error` - 検出処理の失敗。watermark なしとは異なります。検出処理に失敗した v2 注文を含みます
        watermarkText:
          type: string
          nullable: true
          description: 検出された watermark の埋め込みテキスト。`detectionStatus` が `detected` でなければ `null` です。v3 の注文では、呼び出し元のアカウントが埋め込み、発行記録がちょうど 1 件のときだけ返し、それ以外は `null` です
        reportSupported:
          type: boolean
          description: この検出結果から分析レポートを作成できるかどうか。v2 の注文と PDF からキャプチャした画像は `false` です
        reports:
          type: array
          description: この注文のロケールごとのレポートのステータス。v2 の注文は常に空の配列です
          items:
            type: object
            required:
            - locale
            - status
            additionalProperties: false
            properties:
              locale:
                type: string
                enum:
                - ko-KR
                - en-US
                - ja-JP
              status:
                type: string
                enum:
                - queued
                - processing
                - completed
                - failed
    PublicAiDetectionResult:
      type: object
      nullable: true
      description: AI Detection の注文の結果。`status` が `complete` のときだけオブジェクトで、それ以外は `null` です。以前のレスポンスの `statusCode` は `verdict` に置き換わりました
      required:
      - verdict
      - probability
      - options
      - originalImageUrl
      - heatmapUrl
      - overlayUrl
      additionalProperties: false
      properties:
        verdict:
          type: string
          nullable: true
          enum:
          - likely_real
          - uncertain_real
          - uncertain_ai
          - likely_ai
          - null
          description: |-
            `probability` に基づく判定。`probability` が `null` なら `null` です。
            * `likely_real` - AI 生成ではない可能性が高い、probability < 0.25
            * `uncertain_real` - AI 生成ではない可能性がある、0.25 <= probability < 0.5
            * `uncertain_ai` - AI 生成の可能性がある、0.5 <= probability < 0.75
            * `likely_ai` - AI 生成の可能性が高い、probability >= 0.75
        probability:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: AI 生成の確率（0〜1）。値がない場合は `null` です
          example: 0.31
        options:
          type: object
          nullable: true
          description: 注文作成時に設定したオプション。保存されたオプションがなければ `null` です
          properties:
            generateHeatmap:
              type: boolean
            generateOverlay:
              type: boolean
            generateThumbnail:
              type: boolean
        originalImageUrl:
          type: string
          format: uri
          nullable: true
          description: 元の入力画像の URL（presigned、1 時間有効）。リサイズ画像がすべて用意された注文では、長辺 1600px 以内の WebP です
        heatmapUrl:
          type: string
          format: uri
          nullable: true
          description: ヒートマップ画像の URL（presigned、1 時間有効）。`generateHeatmap` オプションを使った注文だけで返し、それ以外は `null` です
        overlayUrl:
          type: string
          format: uri
          nullable: true
          description: 元の画像にヒートマップを重ねた画像の URL（presigned、1 時間有効）。`generateOverlay` オプションを使った注文だけで返し、それ以外は `null` です
    PublicOrderV3DetailCommon:
      type: object
      description: v3 の注文詳細の共通フィールド。すべての注文の種類・watermark エンジンでトップレベルのキーは同じで、種類による違いは `result` の中だけです。以前のレスポンスのトップレベルの `fileCount`、`statusCode`、`files`、`outputs`、`reports`、`watermarks` は返しません
      required:
      - type
      - orderId
      - orderName
      - channel
      - status
      - createdAt
      - updatedAt
      - expiresAt
      - retentionDays
      - thumbnailImageUrl
      - processingDelayed
      - errors
      - inputFiles
      - result
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - antiAi
          - watermarkEmbed
          - watermarkExtract
          - aiDetection
          description: 注文の種類。watermark の注文は v2 と v3 のどちらで作成しても `watermarkEmbed` / `watermarkExtract` を返します
        orderId:
          type: string
          description: 注文 ID
          example: '1001'
        orderName:
          type: string
          nullable: true
          description: 注文名。v3 で作成した watermark 注文では表示用のファイル名を、なければ保存された名前を返します
        channel:
          type: string
          enum:
          - api
          - web
          description: 注文チャネル
        status:
          type: string
          enum:
          - pending
          - inProgress
          - complete
          - failed
          - expired
          description: |-
            * `pending` - アップロード待ち
            * `inProgress` - 処理中
            * `complete` - 完了。このときだけ `result` がオブジェクトです
            * `failed` - 失敗。理由は `errors` にあります
            * `expired` - ファイルの保管期限切れ。取得はできますが、`result` とすべての URL は `null` です

            保存されたステータスが `detected` / `undetected` の v2 watermark 検出注文は `complete` を返し、判定は `result.detectionStatus` に入ります
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: ファイルの保管期限（UTC、ISO 8601）。整合性の例外でのみ `null` です
        retentionDays:
          type: integer
          nullable: true
          description: 注文作成時に固定されたファイルの保管期間（日、7 または 30）。整合性の例外でのみ `null` です
          example: 30
        thumbnailImageUrl:
          type: string
          format: uri
          nullable: true
          description: サムネイル画像の URL。取得元は注文の種類ごとのルールに従います。Anti-AI の注文と v2 の watermark 注文は未完了・失敗時に固定のステータス画像を、AI Detection の注文は詳細サムネイルまたは元の画像を、v3 の watermark 注文は詳細サムネイルを返し、処理前は `null` の場合があります
        processingDelayed:
          type: boolean
          description: v3 で作成した watermark 注文が自動リトライを使い切り、手動復旧を待っているときに `true` です。注文は `inProgress` のままです。それ以外の注文では常に `false` です
        errors:
          type: object
          nullable: true
          description: 失敗した注文のエラー情報で、それ以外は `null` です。v3 で作成した watermark 注文は公開用の `errorCode` と固定の案内文 `errorMessage` を返します。それ以外の注文は保存されたエラー情報をそのまま返し、`errorCode` がない場合があります
          properties:
            errorCode:
              type: string
              description: 'エラーコード。例: `WATERMARK_FILE_CORRUPTED`、`ORDER_TIMEOUT`、`PROCESSING_ERROR`'
              example: WATERMARK_FILE_CORRUPTED
            errorMessage:
              type: string
              description: エラーコードごとの固定の案内文（韓国語）。処理系の生の出力は含みません
        inputFiles:
          type: array
          description: 入力ファイルの一覧（リクエストの順）。ファイル数は `inputFiles.length` です。`watermarkExtract` の注文は `PublicExtractInputFile`（`role` あり）、それ以外の注文は `PublicInputFile` です
          items:
            anyOf:
            - $ref: '#/components/schemas/PublicInputFile'
            - $ref: '#/components/schemas/PublicExtractInputFile'
        result:
          type: object
          nullable: true
          description: 注文の種類ごとの結果。キーは常にあり、`status` が `complete` のときだけオブジェクトで、それ以外は `null` です
    PublicAntiAiOrderV3Detail:
      title: Anti-AI
      description: Anti-AI の注文詳細
      allOf:
      - $ref: '#/components/schemas/PublicOrderV3DetailCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - antiAi
          inputFiles:
            type: array
            items:
              $ref: '#/components/schemas/PublicInputFile'
          result:
            $ref: '#/components/schemas/PublicAntiAiResult'
    PublicWatermarkEmbedOrderV3Detail:
      title: watermark 埋め込み
      description: watermark 埋め込み注文の詳細（v2・v3）
      allOf:
      - $ref: '#/components/schemas/PublicOrderV3DetailCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - watermarkEmbed
          inputFiles:
            type: array
            items:
              $ref: '#/components/schemas/PublicInputFile'
          result:
            $ref: '#/components/schemas/PublicWatermarkEmbedResult'
    PublicWatermarkExtractOrderV3Detail:
      title: watermark 検出
      description: watermark 検出注文の詳細（v2・v3）。この注文の種類だけ `inputFiles[].role` があります
      allOf:
      - $ref: '#/components/schemas/PublicOrderV3DetailCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - watermarkExtract
          inputFiles:
            type: array
            items:
              $ref: '#/components/schemas/PublicExtractInputFile'
          result:
            $ref: '#/components/schemas/PublicWatermarkExtractResult'
    PublicAiDetectionOrderV3Detail:
      title: AI Detection
      description: AI Detection の注文詳細
      allOf:
      - $ref: '#/components/schemas/PublicOrderV3DetailCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - aiDetection
          inputFiles:
            type: array
            items:
              $ref: '#/components/schemas/PublicInputFile'
          result:
            $ref: '#/components/schemas/PublicAiDetectionResult'
    PublicOrderV3Detail:
      description: v3 の注文詳細。トップレベルのフィールドはすべての注文の種類で同じ（`PublicOrderV3DetailCommon`）で、`type` によって `result` と検出注文の `inputFiles[].role` だけが異なります
      oneOf:
      - $ref: '#/components/schemas/PublicAntiAiOrderV3Detail'
      - $ref: '#/components/schemas/PublicWatermarkEmbedOrderV3Detail'
      - $ref: '#/components/schemas/PublicWatermarkExtractOrderV3Detail'
      - $ref: '#/components/schemas/PublicAiDetectionOrderV3Detail'
      discriminator:
        propertyName: type
        mapping:
          antiAi: '#/components/schemas/PublicAntiAiOrderV3Detail'
          watermarkEmbed: '#/components/schemas/PublicWatermarkEmbedOrderV3Detail'
          watermarkExtract: '#/components/schemas/PublicWatermarkExtractOrderV3Detail'
          aiDetection: '#/components/schemas/PublicAiDetectionOrderV3Detail'
    PublicOrderV3DetailResponse:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/PublicOrderV3Detail'
    PublicOrderV3DownloadResponse:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        data:
          type: object
          required:
          - archiveUrl
          - files
          - expiresInSeconds
          additionalProperties: false
          properties:
            archiveUrl:
              type: string
              format: uri
              description: 結果全体を一度に受け取る URL。Anti-AI の注文と v2 の watermark 埋め込み注文では結果の ZIP です。v3 の watermark 埋め込み注文では、結果ファイルが 2 件以上なら ZIP、1 件ならその結果ファイルの URL（`files[0].downloadUrl` と同じファイル）です
            files:
              type: array
              description: 結果ファイルごとのダウンロード URL。注文詳細の `result.outputFiles` と同じファイルを同じ順序で含みます
              items:
                type: object
                required:
                - fileId
                - downloadUrl
                additionalProperties: false
                properties:
                  fileId:
                    type: string
                    pattern: ^[0-9]+$
                    description: 注文詳細の `result.outputFiles[].fileId` と同じ値
                  downloadUrl:
                    type: string
                    format: uri
                    description: 結果ファイルの presigned ダウンロード URL
            expiresInSeconds:
              type: integer
              maximum: 3600
              description: URL の有効期間（秒）。既定は 3600 秒で、`expiresAt` までの残り時間のほうが短い場合はその時間に短縮します
              example: 3600
    OrderReportResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/OrderReportResource'
    OrderReportResource:
      type: object
      required:
      - orderId
      - reportType
      - locale
      - status
      - download
      properties:
        orderId:
          type: string
          description: 注文 ID
        reportType:
          type: string
          enum:
          - watermarkDetection
          - aiDetection
          description: BIZ MORI が注文の種類から決定
        locale:
          type: string
          enum:
          - ko-KR
          - en-US
          - ja-JP
        status:
          type: string
          enum:
          - queued
          - processing
          - completed
          - failed
          description: レポートの作成ステータス
        download:
          nullable: true
          description: ダウンロード情報。`status` が `completed` のときだけ存在
          allOf:
          - $ref: '#/components/schemas/OrderReportDownload'
        failure:
          nullable: true
          description: 失敗情報。`status` が `failed` のときだけ存在
          allOf:
          - $ref: '#/components/schemas/OrderReportFailure'
    OrderReportDownload:
      type: object
      required:
      - url
      - expiresInSeconds
      properties:
        url:
          type: string
          format: uri
          description: |
            300 秒間有効な PDF の署名付き URL。watermark レポートは `<注文名>-report-<locale>.pdf` という名前で保存されます(例: `春キャンペーン-report-ja-JP.pdf`)。
            URL を保存せず、新しい URL が必要なときはレポート API を再度呼び出してください。
        expiresInSeconds:
          type: integer
          enum:
          - 300
    OrderReportFailure:
      type: object
      required:
      - code
      - retryable
      properties:
        code:
          type: string
          enum:
          - REPORT_GENERATION_FAILED
          - REPORT_NOT_AVAILABLE
        retryable:
          type: boolean
          description: |
            `true` の場合、同じ注文・locale で `POST /api/v3/orders/{orderId}/reports` を再度呼び出すと新しく作成できます。
            watermark レポートは失敗が 3 回に達すると `false` です。
  responses:
    BadRequest:
      description: 不正なリクエスト
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_FAILED
    Unauthorized:
      description: 認証失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTH_NOT_AUTHENTICATED
    NotFound:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
    UsageLimitExceeded:
      description: 使用量上限を超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: USAGE_LIMIT_EXCEEDED
    InternalError:
      description: 内部サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SERVER_INTERNAL_ERROR
tags:
- name: Anti-AI
  description: Anti-AI画像保護の注文
- name: Watermark Embed
  description: watermark 埋め込みの注文
- name: Watermark Extract
  description: watermark 抽出の注文
- name: AI Detection
  description: AI生成画像検知の注文
- name: Orders
  description: 注文の照会と管理
- name: Webhooks
  description: Webhookの設定とイベント
- name: Reports
  description: watermark 抽出・AI Detection 注文の PDF 分析レポート
paths:
  /api/v2/orders/anti-ai:
    post:
      summary: Anti-AI注文を作成
      operationId: createAntiAiOrder
      description: 'AI検知防止処理のための注文を作成します。


        ## 入力モード（アップロード / URL / 混合）

        入力モードは、各ファイルオブジェクトに `originalFileUrl` が含まれるかどうかで決定されます:

        - **アップロードモード**（`originalFileUrl` なし）: プリサインドURLを発行 → クライアントがS3にアップロード → `/confirm` を呼び出し

        - **URLモード**（`originalFileUrl` を指定）: URLから画像をダウンロードして即座に処理

        - **混合モード**: 一部のファイルはアップロードモード、残りはURLモードで同時に処理


        ### 動作

        | 条件 | 注文ステータス | Confirmの必要性 |

        |-----------|-------------|-----------------|

        | すべてのファイルに `originalFileUrl` がある | `inProgress` | 不要（即座に処理） |

        | `originalFileUrl` がないファイルが含まれる | `pending` | 必要（アップロード後にconfirm） |


        ## Zero Copy モード

        `mode.zeroCopy: true` の場合、処理結果は顧客が提供したプリサインドURLへ直接アップロードされます。

        この場合、`outputTargets` 配列が必須であり、`files` 配列と同じ長さである必要があります。'
      tags:
      - Anti-AI
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotencyKey
              - files
              properties:
                idempotencyKey:
                  type: string
                  description: 重複リクエストを防ぐための冪等性キー
                orderName:
                  type: string
                  maxLength: 64
                  description: 注文名（任意、未指定の場合は自動生成）
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - fileName
                    properties:
                      fileName:
                        type: string
                        description: ファイル名（拡張子を含む）
                        example: image.jpg
                      originalFileUrl:
                        type: string
                        format: uri
                        description: '元画像URL（任意）

                          - 指定した場合: URLモード（プリサインドURLは発行されず、即座に処理）

                          - 指定しない場合: アップロードモード（プリサインドURLを発行、confirmが必要）'
                        example: https://example.com/image.jpg
                mode:
                  type: object
                  description: 処理モード設定
                  properties:
                    zeroCopy:
                      type: boolean
                      default: false
                      description: Zero Copyモードを有効化
                outputTargets:
                  type: array
                  description: Zero Copyモードの出力アップロード先（mode.zeroCopyがtrueの場合必須）
                  items:
                    type: object
                    required:
                    - fileKey
                    - url
                    - presignedUrlExpiresAt
                    properties:
                      fileKey:
                        type: string
                        description: ファイルキー（識別子）
                      url:
                        type: string
                        format: uri
                        description: 結果アップロード用のプリサインドURL
                      presignedUrlExpiresAt:
                        type: string
                        format: date-time
                        description: プリサインドURLの有効期限（ISO 8601）
                options:
                  $ref: '#/components/schemas/OrderOptions'
            examples:
              uploadMode:
                summary: アップロードモード（従来型）
                value:
                  idempotencyKey: key-upload-001
                  files:
                  - fileName: image1.jpg
                  - fileName: image2.png
                  options:
                    strength: high
              urlMode:
                summary: URLモード（即座に処理）
                value:
                  idempotencyKey: 3c7a5e19-9b2f-4d86-a1c4-6f8e0b3d5a71
                  files:
                  - fileName: image1.jpg
                    originalFileUrl: https://example.com/image1.jpg
                  - fileName: image2.png
                    originalFileUrl: https://example.com/image2.png
                  options:
                    strength: high
              mixedMode:
                summary: 混合モード
                value:
                  idempotencyKey: key-mixed-001
                  files:
                  - fileName: upload-file.jpg
                  - fileName: url-file.png
                    originalFileUrl: https://example.com/image.png
                  options:
                    strength: standard
      responses:
        '200':
          description: 注文が正常に作成されました
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderName:
                        type: string
                      orderId:
                        type: string
                      status:
                        type: string
                        enum:
                        - pending
                        - inProgress
                        description: '注文ステータス

                          - `pending`: アップロードファイルを含む（confirmが必要）

                          - `inProgress`: すべてのファイルがURLモード（即座に処理）'
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/AntiAiOrderFile'
              examples:
                uploadModeResponse:
                  summary: アップロードモードのレスポンス
                  value:
                    data:
                      orderName: anti_ai_2026-02-09
                      orderId: '123456789'
                      status: pending
                      files:
                      - fileId: '1'
                        fileName: image1.jpg
                        uploadUrl: https://s3.amazonaws.com/...
                        fileKey: temp/123456789/0/image1.jpg
                urlModeResponse:
